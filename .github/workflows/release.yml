name: Release
# T-VERSION (owner 2026-11-16): every APP_VERSION that reaches main becomes a git tag and a GitHub Release whose notes
# are that version's "### vX.Y.Z — …" entry from the README "Product changelog". Runs only when app.py or README.md
# change on main (a few seconds of runner time); a version that is already released is skipped, so re-runs are safe.
# Past versions listed in .github/release-backfill.txt ("tag sha") are released on their own commits by the next run;
# workflow_dispatch can do one by hand: tag + release on the given commit, notes from the README entry.
on:
  push:
    branches: [main]
    paths: [app.py, README.md, .github/release-backfill.txt, .github/workflows/release.yml, tools/release_publish.sh]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish (e.g. v5.9.0); empty = current APP_VERSION"
        required: false
        default: ""
      target:
        description: "Full commit SHA on main to tag when the tag does not exist yet; required with tag (backfill)"
        required: false
        default: ""

permissions:
  contents: write

# No concurrency group: GitHub keeps only one pending run per group and drops the rest, which could skip a version.
# Each run releases only its own version and treats "already exists" as done, so parallel runs are safe.

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version and notes from APP_VERSION and the README changelog
        id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          tag = (os.environ.get("INPUT_TAG") or "").strip()
          if not tag:
              tag = re.search(r'^APP_VERSION = "([^"]+)"', pathlib.Path("app.py").read_text(), re.M).group(1)
          if not re.fullmatch(r"v\d+\.\d+(\.\d+)?", tag):
              raise SystemExit(f"not a version tag: {tag!r}")
          log = pathlib.Path("README.md").read_text().split("## Product changelog", 1)[1]
          m = re.search(r"^### " + re.escape(tag) + r" — ([^\n]*)\n(.*?)(?=^### |\Z)", log, re.M | re.S)
          if not m:
              raise SystemExit(f"README Product changelog has no entry for {tag}")
          pathlib.Path("release-notes.md").write_text(m.group(2).strip() + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag={tag}\ntitle=FactoryOS {tag} — {m.group(1).strip()}\n")
          PY
      - name: Tag and publish the GitHub Release (skipped when it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          TITLE: ${{ steps.v.outputs.title }}
          TARGET: ${{ github.event.inputs.target }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            # A manually named past version must say which commit it was: never tag history on today's main.
            [ -n "$TARGET" ] || { echo "pass target: the full SHA of $TAG's commit"; exit 1; }
            bash tools/release_publish.sh strict "$TAG" "$TARGET" "$TITLE" release-notes.md
          else
            bash tools/release_publish.sh current "$TAG" "$GITHUB_SHA" "$TITLE" release-notes.md
          fi
      - name: Backfill past versions listed in .github/release-backfill.txt (each on its own commit)
        if: github.event_name == 'push' && hashFiles('.github/release-backfill.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("README.md").read_text().split("## Product changelog", 1)[1]
          out = pathlib.Path("backfill"); out.mkdir()
          rows = []
          for line in pathlib.Path(".github/release-backfill.txt").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              tag, sha = line.split()
              if not re.fullmatch(r"v\d+\.\d+(\.\d+)?", tag) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(f"bad backfill line: {line!r}")
              m = re.search(r"^### " + re.escape(tag) + r" — ([^\n]*)\n(.*?)(?=^### |\Z)", log, re.M | re.S)
              if not m:
                  raise SystemExit(f"README Product changelog has no entry for {tag}")
              (out / f"{tag}.md").write_text(m.group(2).strip() + "\n")
              rows.append(f"{tag}\t{sha}\tFactoryOS {tag} — {m.group(1).strip()}")
          (out / "list.tsv").write_text("\n".join(rows) + "\n")
          PY
          while IFS=$'\t' read -r tag sha title; do
            [ -n "$tag" ] || continue
            bash tools/release_publish.sh strict "$tag" "$sha" "$title" "backfill/$tag.md"
          done < backfill/list.tsv
