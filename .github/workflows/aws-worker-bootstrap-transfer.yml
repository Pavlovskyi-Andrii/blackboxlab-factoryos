name: Bootstrap FactoryOS source to AWS
on:
  push:
    branches:
      - bootstrap/aws-worker-transfer-20261026

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GitHub credentials were removed
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git config --get-all http.https://github.com/.extraheader || true)"
      - name: Package exact repository checkout
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/factoryos-src.tgz .
          test -s /tmp/factoryos-src.tgz
          sha256sum /tmp/factoryos-src.tgz
          du -h /tmp/factoryos-src.tgz
