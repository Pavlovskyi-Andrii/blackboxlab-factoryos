name: Gemini Issue to PR

on:
  issues:
    types: [labeled]
  # The 5-minute loop runs on EC2 (tools/gemini_ec2_loop.sh): Actions minutes are limited on a private repo.
  workflow_dispatch:

concurrency:
  group: gemini-issue-${{ github.event.issue.number || 'night' }}
  cancel-in-progress: false

jobs:
  gemini-coder:
    if: github.event_name != 'issues' || (github.event.label.name == 'gemini' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write  # only to dispatch FactoryOS CI on the Gemini branch
    steps:
      - name: Pick issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_ISSUE" ]; then echo "issue=$EVENT_ISSUE" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Night shift: oldest open issue with label gemini (only write-access users can label) and no gemini/issue-N branch yet.
          for n in $(gh issue list --label gemini --state open --json number,body --jq '[.[]|select(.body|startswith("Owner: Gemini"))]|sort_by(.number)|.[].number'); do
            if ! gh api "repos/$GH_REPO/branches/gemini/issue-$n" >/dev/null 2>&1; then echo "issue=$n" >> "$GITHUB_OUTPUT"; echo "picked #$n"; exit 0; fi
          done
          echo "no Gemini issue waiting"

      - name: Verify trusted actor
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq '.permission')"
          case "$permission" in admin|maintain|write) ;; *) echo "Untrusted label actor"; exit 1;; esac

      - uses: actions/checkout@v4
        if: steps.pick.outputs.issue != ''
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.issue != ''
        with:
          node-version: '20'

      - name: Generate bounded Gemini proposal
        if: steps.pick.outputs.issue != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.issue }}
          GEMINI_FREE_MODELS: ${{ vars.GEMINI_FREE_MODELS || 'gemini-3.8-flash,gemini-flash-latest' }}
        run: node tools/gemini_issue_pr.cjs generate

      - name: Publish draft PR (no model API key)
        if: steps.pick.outputs.issue != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.pick.outputs.issue }}
        run: node tools/gemini_issue_pr.cjs publish
