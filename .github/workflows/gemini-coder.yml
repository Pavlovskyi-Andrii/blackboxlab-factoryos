name: Gemini Issue to PR

on:
  issues:
    types: [labeled]

concurrency:
  group: gemini-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gemini-coder:
    if: github.event.label.name == 'gemini' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write  # only to dispatch FactoryOS CI on the Gemini branch
    steps:
      - name: Verify trusted actor
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq '.permission')"
          case "$permission" in admin|maintain|write) ;; *) echo "Untrusted label actor"; exit 1;; esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install official Gemini SDK
        run: npm install --no-save --no-audit --no-fund @google/genai

      - name: Generate bounded Gemini proposal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GEMINI_FREE_MODELS: ${{ vars.GEMINI_FREE_MODELS || 'gemini-3.8-flash,gemini-flash-latest' }}
        run: node tools/gemini_issue_pr.cjs generate

      - name: Publish draft PR (no model API key)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node tools/gemini_issue_pr.cjs publish
