name: Gemini CLI Remote Coder

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  gemini-coder:
    # Запускается, если в тикете или комменте есть упоминание @gemini-cli
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini-cli')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google GenAI SDK & Octokit
        run: npm install @google/genai @octokit/rest

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER_PROMPT: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          node -e '
          const { GoogleGenAI } = require("@google/genai");
          const { Octokit } = require("@octokit/rest");

          async function run() {
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");

            const response = await ai.models.generateContent({
              model: "gemini-2.5-flash",
              contents: `Ты AI-разработчик проекта blackboxlab-factoryos. 
              Ответь на запрос пользователя из GitHub Issue #${process.env.ISSUE_NUMBER}:
              "${process.env.USER_PROMPT}"`
            });

            await octokit.rest.issues.createComment({
              owner,
              repo,
              issue_number: process.env.ISSUE_NUMBER,
              body: `🤖 **Gemini Bot:**\n\n${response.text}`
            });
          }
          run().catch(err => { console.error(err); process.exit(1); });
          '
