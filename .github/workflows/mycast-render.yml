name: MyCast render
# Renders MyCast episode scripts to audio with the open-source Piper TTS (zero spend, no API keys).
# Runs on pushes to mycast/** branches or manually; output is a 14-day artifact, never published.
# A pull request that touches the renderer renders the regression fixture with the real voice, so a broken
# renderer is caught before it reaches the daily branch.
on:
  push:
    branches: [ "mycast/**" ]
    paths: [ "docs/prototypes/mycast/episodes/**", "tools/mycast_render.py", "tools/mycast_changed_episodes.sh", ".github/workflows/mycast-render.yml" ]
  pull_request:
    paths: [ "tools/mycast_render.py", "tools/mycast_changed_episodes.sh", "tools/fixtures/mycast_render_fixture.json", ".github/workflows/mycast-render.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Piper TTS and the Ukrainian voice
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install piper-tts
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/uk/uk_UA/ukrainian_tts/medium
          curl -fsSL -o voices/uk_UA-ukrainian_tts-medium.onnx "$base/uk_UA-ukrainian_tts-medium.onnx"
          curl -fsSL -o voices/uk_UA-ukrainian_tts-medium.onnx.json "$base/uk_UA-ukrainian_tts-medium.onnx.json"
      - name: Render episodes
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=tools/fixtures/mycast_render_fixture.json
          else
            # Every episode changed by this push (all its commits); the newest episode when it changed none.
            changed=$(tools/mycast_changed_episodes.sh "${{ github.event.before }}")
          fi
          for ep in $changed; do
            python tools/mycast_render.py "$ep" voices/uk_UA-ukrainian_tts-medium.onnx out 2> piper.log || { tail -n 20 piper.log; exit 1; }
            # Piper prints one line per character it cannot say; show each such character once.
            grep -o 'Missing phoneme from id map: .*' piper.log | sort -u | head -n 40 || true
          done
          for f in out/*.wav; do ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 96k "${f%.wav}.mp3"; done
      - name: Check every MP3 decodes and matches its WAV length
        run: |
          set -euo pipefail
          for f in out/*.mp3; do
            ffmpeg -v error -xerror -i "$f" -f null -
            mp3=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            wav=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${f%.mp3}.wav")
            python -c "import sys; m, w = float(sys.argv[1]), float(sys.argv[2]); print(f'{sys.argv[3]}: mp3 {m:.1f}s, wav {w:.1f}s'); sys.exit(0 if w > 1 and abs(m - w) <= 1 else 1)" "$mp3" "$wav" "$f"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}  # a failed audio check still leaves the transcript to read
        with:
          name: mycast-episodes
          path: |
            out/*.mp3
            out/*.md
          if-no-files-found: error
          retention-days: 14
