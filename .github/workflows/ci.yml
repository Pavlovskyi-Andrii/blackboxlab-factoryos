name: FactoryOS CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m py_compile app.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Runtime smoke test
        env:
          DATA_DIR: /tmp/factoryos-ci
          FACTORY_PASSWORD: ""
        run: |
          python - <<'PY'
          import app
          assert app.health()["ok"] is True
          state = app.status()
          assert state["factory"] == "online"
          assert "Supervisor" in state["agentStates"]
          assert "usage" in state
          print("FactoryOS runtime smoke test passed")
          PY
      - name: Validate required frontend assets
        run: |
          test -f static/index.html
          test -f static/office_scene.svg
          test -f static/demo_storyboard.svg
          grep -q "FactoryOS" static/index.html
          grep -q "agentDrawer" static/index.html
      - name: Validate dashboard document structure
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          assert html.count("<html") == 1, "expected exactly one html root"
          assert html.count("</html>") == 1, "expected exactly one closing html tag"
          assert html.count("<script>") == 1, "expected exactly one inline script"
          assert html.count("</script>") == 1, "expected exactly one inline script close"
          trailing = html.split("</html>",1)[1].strip()
          assert trailing == "", f"unexpected content after </html>: {trailing[:80]!r}"
          print("Dashboard document structure valid")
          PY
      - name: Check inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          script = html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/factoryos-ui.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/factoryos-ui.js
