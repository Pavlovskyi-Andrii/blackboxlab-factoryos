name: FactoryOS CI
on:
  # Gemini PRs are opened with GITHUB_TOKEN, which does not fire pull_request; gemini-coder dispatches CI instead.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Owner 2026-11-08: Actions minutes are on a $5 budget until the quota resets on 1 Dec, so CI spends as little as it can:
# a newer push to the same PR cancels the older run; the Python 3.9 import check is a step, not its own billed job;
# the 4-minute screenshot job runs only when page files change. Main keeps running CI: Render deploys on checksPass.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax-and-smoke:
    # Pinned: ubuntu-latest moved to 26.04 (2026-11-11), where setup-python has no 3.9 build, and the deployed
    # EC2 worker still runs Python 3.9 (import check below). Move on when the worker leaves 3.9.
    runs-on: ubuntu-24.04
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect page changes (decides whether the screenshot job runs)
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "ui=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "$files"
          if echo "$files" | grep -Eq '^(static/|tools/ui_screenshots\.py$|requirements\.txt$|\.github/workflows/ci\.yml$)'; then echo "ui=true" >> "$GITHUB_OUTPUT"; else echo "ui=false" >> "$GITHUB_OUTPUT"; fi
      # Formerly its own job ec2-python39-import: the deployed EC2 worker still runs Python 3.9.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Import deployed EC2 worker modules on Python 3.9
        run: |
          python -m pip install requests
          python -m py_compile autopilot/delegation.py autopilot/autopilot.py autopilot/claude_pro_worker.py autopilot/relay_tasks.py autopilot/mods_runtime.py autopilot/mp4_check.py
          python -m py_compile browser_runner/action_policy.py browser_runner/action_session.py autopilot/browser_actions.py autopilot/browser_worker.py autopilot/browser_tasks.py
          python -c "import autopilot.autopilot; import autopilot.claude_pro_worker; print('EC2 worker Python 3.9 import OK')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m py_compile app.py relay.py relay_execution.py relay_pairing.py test_relay_pairing.py test_relay_execution.py test_relay_telegram.py autopilot/relay_tasks.py smoke_tests.py media_finisher_worker/app.py media_finisher_worker/test_planner.py autopilot/autopilot.py autopilot/notify.py autopilot/claude_pro_worker.py autopilot/pair_worker.py autopilot/test_pair_worker.py autopilot/supervisor.py autopilot/test_supervisor.py test_worker_token_binding.py autopilot/delegation.py autopilot/test_autopilot.py autopilot/test_notify.py autopilot/test_delegation.py autopilot/control.py autopilot/test_control.py test_delegation_ui.py browser_runner/__init__.py browser_runner/core.py browser_runner/sessions.py browser_runner/playwright_executor.py browser_runner/observability.py browser_runner/vault.py test_browser_vault.py test_vault_ui.py test_browser_runner.py test_browser_sessions.py test_browser_playwright.py test_browser_observability.py
