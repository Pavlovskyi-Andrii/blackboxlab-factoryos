name: FactoryOS CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ec2-python39-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install existing runner Python dependencies
        run: python -m pip install requests
      - name: Import deployed EC2 worker modules on Python 3.9
        run: |
          python -m py_compile autopilot/delegation.py autopilot/autopilot.py autopilot/claude_pro_worker.py autopilot/relay_tasks.py
          python -c "import autopilot.autopilot; import autopilot.claude_pro_worker; print('EC2 worker Python 3.9 import OK')"
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m py_compile app.py relay.py relay_execution.py relay_pairing.py test_relay_pairing.py test_relay_execution.py test_relay_telegram.py autopilot/relay_tasks.py smoke_tests.py media_finisher_worker/app.py media_finisher_worker/test_planner.py autopilot/autopilot.py autopilot/notify.py autopilot/claude_pro_worker.py autopilot/pair_worker.py autopilot/test_pair_worker.py autopilot/supervisor.py autopilot/test_supervisor.py test_worker_token_binding.py autopilot/delegation.py autopilot/test_autopilot.py autopilot/test_notify.py autopilot/test_delegation.py autopilot/control.py autopilot/test_control.py test_delegation_ui.py browser_runner/__init__.py browser_runner/core.py browser_runner/sessions.py browser_runner/playwright_executor.py browser_runner/observability.py test_browser_runner.py test_browser_sessions.py test_browser_playwright.py test_browser_observability.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify provider and worker connection contracts (zero spend)
        run: |
          python -m py_compile connection_capabilities.py test_connection_capabilities.py
          python test_connection_capabilities.py
      - name: Media Finisher planner unit tests
        env:
          FINISHER_DATA_DIR: /tmp/factoryos-finisher-ci
        run: python -m media_finisher_worker.test_planner
      - name: Runtime smoke and regression suite
        env:
          DATA_DIR: /tmp/factoryos-ci
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
        run: python smoke_tests.py
      - name: Smoke suite rerun against reused DATA_DIR
        env:
          DATA_DIR: /tmp/factoryos-ci
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
        run: python smoke_tests.py
      - name: Validate required frontend assets
        run: |
          test -f static/index.html
          test -f static/office_scene.svg
          test -f static/demo_storyboard.svg
          grep -q "FactoryOS" static/index.html
          grep -q "agentDrawer" static/index.html
          grep -q "FactoryOS Build Progress" static/index.html
          grep -q "telegramBridge" static/index.html
          grep -q "Claude Code Pro" static/index.html
          grep -q "openClaudeCodeSetup" static/index.html
          test -f autopilot/claude_pro_worker.py
          grep -q "startTelegramPairing" static/index.html
          grep -q "agentTooltip" static/index.html
          grep -q "MCP connections" static/index.html
          grep -q "const I18N" static/index.html
          grep -q ""uk"" static/index.html
          grep -q ""ru"" static/index.html
          grep -q "startBuildTask" static/index.html
          grep -q "taskSteps" static/index.html
          grep -q "factory_build_manifest.json" app.py
          grep -q 'data-i18n="error.title"' static/index.html
          grep -q 'data-i18n="worker.title"' static/index.html
          grep -q 'data-i18n="intel.title"' static/index.html
          grep -q '"error.confirmUncertain"' static/index.html
          grep -q '"trace.title"' static/index.html
          grep -q '"intel.note"' static/index.html
          grep -q 'data-i18n="finisher.nav"' static/index.html
          test -f media_finisher_worker/Dockerfile
          test -f media_finisher_worker/remotion/src/index.tsx
          test -f ROADMAP.md
          test -f CLAUDE.md
          test -f DECISIONS.md
          test -f autopilot/autopilot.py
          test -f autopilot/notify.py
          test -f autopilot/test_notify.py
          test -f autopilot/Dockerfile
          test -f docker-compose.autopilot.yml
          grep -q "T-502 Autopilot state inside FactoryOS" ROADMAP.md
          grep -q "Never push directly" CLAUDE.md
      - name: Autopilot roadmap unit tests
        run: python -m autopilot.test_autopilot
      - name: Telegram pairing unit tests
        run: python -m autopilot.test_notify
      - name: Relay Telegram / GitHub status unit tests
        run: python test_relay_telegram.py
      - name: Relay worker queue / Claude execution unit tests
        run: python test_relay_execution.py
      - name: Relay secure worker pairing unit tests
        run: python test_relay_pairing.py
      - name: Claude delegation adapter regression
        run: python -m autopilot.test_delegation
      - name: Runner safe operator controls regression
        run: python -m autopilot.test_control
      - name: Interactive worker-pairing security regression
        run: python -m autopilot.test_pair_worker
      - name: Runner Supervisor recovery and no-PAYG safeguards
        run: python -m autopilot.test_supervisor
      - name: EC2 worker token backwards compatibility
        env:
          DATA_DIR: /tmp/factoryos-worker-token-ci
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
        run: python test_worker_token_binding.py
      - name: Browser Action Runner policy regression
        run: python test_browser_runner.py
      - name: Browser session isolation regression
        run: python test_browser_sessions.py
      - name: Browser executor isolated fake-browser fixture
        run: python test_browser_playwright.py
      - name: Browser Runner observability view/API/UI fixtures
        env:
          DATA_DIR: /tmp/factoryos-browser-obs-ci
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
          FACTORYOS_REQUIRE_NODE: "1"
        run: python test_browser_observability.py
      - name: Validate autopilot compose
        run: |
          cp .env.autopilot.example .env.autopilot
          docker compose -f docker-compose.autopilot.yml config >/dev/null
          rm -f .env.autopilot
      - name: Validate dashboard document structure
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          assert html.count("<html") == 1, "expected exactly one html root"
          assert html.count("</html>") == 1, "expected exactly one closing html tag"
          assert html.count("<script>") == 1, "expected exactly one inline script"
          assert html.count("</script>") == 1, "expected exactly one inline script close"
          trailing = html.split("</html>",1)[1].strip()
          assert trailing == "", f"unexpected content after </html>: {trailing[:80]!r}"
          print("Dashboard document structure valid")
          PY
      - name: Check inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          script = html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/factoryos-ui.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/factoryos-ui.js
      - name: Worker / Delegation Control Center UI fixtures
        env:
          FACTORYOS_REQUIRE_NODE: "1"
        run: python test_delegation_ui.py
      - name: Live pipeline handoff trace UI fixtures
        env:
          FACTORYOS_REQUIRE_NODE: "1"
        run: |
          python -m py_compile test_pipeline_flow.py
          python test_pipeline_flow.py
      - name: Explainability tooltip fixtures
        env:
          FACTORYOS_REQUIRE_NODE: "1"
        run: |
          python -m py_compile test_explainability.py
          python test_explainability.py
      - name: EN/UK/RU locale parity regression
        env:
          FACTORYOS_REQUIRE_NODE: "1"
        run: |
          python -m py_compile test_locale_parity.py
          python test_locale_parity.py
      - name: Owner desk runbooks and question queue
        run: |
          python -m py_compile owner_desk.py test_owner_desk.py autopilot/owner_questions.py autopilot/test_owner_questions.py
          python test_owner_desk.py
          python -m autopilot.test_owner_questions
      - name: Delegation execution timeline regression
        env:
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
        run: |
          python -m py_compile test_delegation_timeline.py
          python test_delegation_timeline.py
      - name: Safe operator controls regression
        env:
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
        run: |
          python -m py_compile test_delegation_controls.py
          python test_delegation_controls.py
      - name: Live worker telemetry regression
        env:
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
          FACTORYOS_REQUIRE_NODE: "1"
        run: |
          python -m py_compile worker_observability.py test_worker_telemetry.py
          python test_worker_telemetry.py
      - name: Artifact + media viewer regression
        env:
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
          FACTORYOS_REQUIRE_NODE: "1"
        run: |
          python -m py_compile test_artifact_viewer.py
          python test_artifact_viewer.py
      - name: Revideo zero-spend acceptance
        env:
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
        run: |
          python -m py_compile test_revideo_acceptance.py
          python test_revideo_acceptance.py
      - name: Media Finisher operator preview regression
        env:
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
          FACTORYOS_REQUIRE_NODE: "1"
        run: |
          python -m py_compile test_media_finisher_preview.py
          python test_media_finisher_preview.py
  ui-screenshots:
    # Evidence for UI tasks (T-594..T-597): EN/UK/RU × desktop/tablet/mobile screenshots of a local,
    # password-less, key-less FactoryOS (zero spend). Findings are reported in the job summary, not enforced.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies and headless Chromium
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start FactoryOS locally without credentials
        env:
          DATA_DIR: /tmp/factoryos-ui
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
        run: |
          nohup python -m uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/factoryos-ui.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health > /dev/null || { tail -50 /tmp/factoryos-ui.log; exit 1; }
      - name: Capture dashboard screenshots
        run: |
          python -m py_compile tools/ui_screenshots.py
          python tools/ui_screenshots.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/
          retention-days: 14
