  ui-screenshots:
    # Evidence for UI tasks (T-594..T-597): EN/UK/RU × desktop/tablet/mobile screenshots of a local,
    # password-less, key-less FactoryOS (zero spend). Findings are reported in the job summary, not enforced.
    # Runs only when page files changed and the smoke job passed (budget, 2026-11-08).
    needs: syntax-and-smoke
    # Owner 2026-11-14 (Actions budget, $5 in two days): the 4-minute screenshot job runs on main (Render deploys only after
    # it) and on manual runs, not on every PR push; PR authors run Playwright locally before pushing.
    if: needs.syntax-and-smoke.outputs.ui == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04   # 26.04 has no Playwright browser deps (apt failed 2026-11-11); same pin as syntax-and-smoke
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies and headless Chromium
        run: |
          python -m pip install -r requirements.txt playwright
          # 2026-11-11: GitHub runners could not resolve the Ubuntu mirrors for >1 h, so `--with-deps` (apt) burned
          # the whole 20-minute job three times. Runner images already carry Chromium's system libraries: install the
          # browser alone, prove it launches, and touch apt only if it does not (bounded to 5 minutes).
          python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()"; then
            timeout 300 python -m playwright install --with-deps chromium
          fi
      - name: Start FactoryOS locally without credentials
        env:
          DATA_DIR: /tmp/factoryos-ui
          FACTORY_PASSWORD: ""
          FACTORY_LLM_API_KEY: ""
        run: |
          nohup python -m uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/factoryos-ui.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health > /dev/null || { tail -50 /tmp/factoryos-ui.log; exit 1; }
      - name: Capture dashboard screenshots
        run: |
          python -m py_compile tools/ui_screenshots.py
          python tools/ui_screenshots.py
      - name: Upload screenshots
        if: always()
        # Owner-approved 2026-11-06: an artifact-storage quota error at upload must not fail the job.
        # The screenshot step above still fails on page errors, overflow or failed actions.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/
          retention-days: 1
