envVarGroups:
  - name: factoryos-media-finisher-shared
    envVars:
      - key: FACTORY_MEDIA_FINISHER_SHARED_TOKEN
        generateValue: true

services:
  - type: web
    name: blackboxlab-factoryos
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: FACTORY_USER
        value: blackboxlab
      - key: FACTORY_PASSWORD
        sync: false
      - key: FACTORY_SECRET
        generateValue: true
      - key: FACTORY_LOCAL_BOOSTER_TOKEN
        sync: false
      - key: FACTORY_GOOGLE_CLIENT_ID
        sync: false
      - key: FACTORY_GOOGLE_ALLOWED_EMAILS
        sync: false
      - key: FACTORY_GOOGLE_OWNER_EMAILS
        sync: false
      - key: FACTORY_GOOGLE_VIEWER_EMAILS
        sync: false
      - key: FACTORY_GOOGLE_ALLOWED_DOMAINS
        sync: false
      - key: FACTORY_VIEWER_INVITE_TOKEN
        sync: false
      - key: FACTORY_TELEGRAM_BOT_TOKEN
        sync: false
      - key: FACTORY_TELEGRAM_PAIR_TTL_SECONDS
        value: "600"
      - key: FACTORY_PUBLISHER_ADAPTER
        sync: false
      - key: FACTORY_METRICOOL_TOKEN
        sync: false
      - key: FACTORY_METRICOOL_USER_ID
        sync: false
      - key: FACTORY_METRICOOL_BLOG_ID
        sync: false
      - key: FACTORY_METRICOOL_TIMEZONE
        value: Europe/Kyiv
      - key: FACTORY_METRICOOL_YOUTUBE_MADE_FOR_KIDS
        sync: false
      - key: FACTORY_MEDIA_FINISHER_ADAPTER
        value: render-media-finisher
      - key: FACTORY_MEDIA_FINISHER_ENDPOINT
        fromService:
          type: web
          name: blackboxlab-media-finisher
          property: hostport
      - fromGroup: factoryos-media-finisher-shared
    disk:
      name: factory-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: blackboxlab-media-finisher
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    dockerfilePath: ./media_finisher_worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: FINISHER_DATA_DIR
        value: /var/data/media-finisher
      - key: FINISHER_WHISPER_MODEL
        value: small
      - key: FINISHER_WHISPER_DEVICE
        value: cpu
      - key: FINISHER_WHISPER_COMPUTE_TYPE
        value: int8
      - key: FINISHER_GRAPHICS_ENGINE
        value: remotion
      - key: FACTORYOS_CALLBACK_BASE_URL
        fromService:
          type: web
          name: blackboxlab-factoryos
          property: hostport
      - fromGroup: factoryos-media-finisher-shared
    disk:
      name: media-finisher-data
      mountPath: /var/data
      sizeGB: 5
