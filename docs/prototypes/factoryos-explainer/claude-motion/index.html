<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FactoryOS Motion Explainer</title>
<meta name="description" content="75-секундный концепт-ролик: как задача проходит через FactoryOS — от идеи до проверяемого результата. DEMO, без реальных данных.">
<style>
:root{color-scheme:dark;--bg:#04070f;--bg2:#08101f;--panel:#0d1729;--line:#22314a;--ink:#eef3ff;--muted:#9fb0cc;
  --cyan:#5ee7ff;--teal:#3fe0c0;--violet:#a98bff;--amber:#ffc46b;--red:#ff8a8a;--green:#7cf0a4;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);overflow-x:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.app{max-width:1600px;margin:0 auto;padding:12px 16px 20px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 150px);margin:0 auto;border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 40%,#0b1a33 0%,var(--bg) 70%);border:1px solid #1b2840;isolation:isolate}
svg.world{position:absolute;inset:0;width:100%;height:100%;display:block}
.brandTag{position:absolute;left:14px;top:12px;z-index:5;display:flex;gap:8px;align-items:center;font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.brandTag .demo{color:#081018;background:var(--amber);padding:4px 7px;border-radius:5px;letter-spacing:.08em}
.sceneTag{position:absolute;right:14px;top:12px;z-index:5;font:600 12px/1 var(--mono);color:var(--muted);background:#04070fb0;padding:6px 9px;border-radius:7px;border:1px solid #ffffff14}
/* Hook: the physical monitor the camera pushes through */
.hook{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;transform-origin:50% 46%;will-change:transform,opacity}
.desk{position:absolute;left:-10%;right:-10%;bottom:-6%;height:30%;background:linear-gradient(180deg,#0c1424,#03060c);transform:perspective(600px) rotateX(55deg);border-top:1px solid #1d2b45}
.monitor{position:relative;width:min(46%,700px);aspect-ratio:16/10;border-radius:16px;background:#0a0f1a;border:2px solid #24324d;padding:2.2%;box-shadow:0 40px 120px #000c,0 0 80px #1aa6ff22;margin-top:4%}
.monitor:after{content:"";position:absolute;left:44%;right:44%;bottom:-14%;height:14%;background:linear-gradient(#18233a,#0b111d);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.screen{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#0f2a4a,#050b16 70%);
  background-image:linear-gradient(#5ee7ff10 1px,transparent 1px),linear-gradient(90deg,#5ee7ff10 1px,transparent 1px),radial-gradient(ellipse at 50% 55%,#0f2a4a,#050b16 70%);background-size:28px 28px,28px 28px,auto}
.screen .os{position:absolute;left:5%;top:7%;font:700 clamp(10px,1.3vw,18px)/1 var(--mono);letter-spacing:.16em;color:var(--cyan)}
.screen .idea{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);text-align:center;width:86%}
.screen .idea b{display:block;font-size:clamp(12px,1.9vw,30px);font-weight:700;letter-spacing:-.02em}
.screen .idea small{display:block;margin-top:.6em;color:var(--muted);font-size:clamp(9px,1vw,15px)}
.screen .dot{width:clamp(14px,2vw,30px);aspect-ratio:1;border-radius:50%;margin:0 auto .8em;background:#fff;box-shadow:0 0 12px #fff,0 0 34px var(--cyan),0 0 70px var(--cyan)}
/* Captions */
.caps{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:42px 22px 16px;background:linear-gradient(transparent,#02050bee 55%);pointer-events:none}
.caps .msg{font-size:clamp(20px,2.6vw,40px);font-weight:760;letter-spacing:-.03em;line-height:1.1;min-height:1.1em}
.caps .msg span{display:inline-block;opacity:0;transform:translateY(12px)}
.caps .vo{margin-top:8px;max-width:1050px;color:#c9d5ea;font-size:clamp(13px,1.15vw,17px);min-height:2.6em}
.tagline{position:absolute;left:0;right:0;top:5%;z-index:6;text-align:center;padding:0 16px;pointer-events:none}
.tagline b{display:block;font-size:clamp(17px,2vw,32px);max-width:1100px;margin:0 auto;letter-spacing:-.03em}
.tagline small{color:var(--muted);font-size:clamp(12px,1.1vw,16px)}
.endmark{position:absolute;inset:0;z-index:7;display:grid;place-items:end center;padding-bottom:3%;pointer-events:none;opacity:0}
.endmark div{text-align:center;padding:12px 24px;border-radius:18px;background:#02050bb0;border:1px solid #5ee7ff44;box-shadow:0 0 80px #5ee7ff22}
.endmark b{display:block;font-size:clamp(28px,4vw,60px);letter-spacing:-.05em;background:linear-gradient(100deg,#d9ceff,#7fd8ff 50%,#6ff3d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.endmark span{display:block;font-size:clamp(14px,1.6vw,22px);color:#dbe6f8}
.endmark small{display:block;margin-top:8px;color:var(--muted);font-size:clamp(11px,.95vw,14px)}
/* Controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px auto 0;max-width:100%}
.btn{border:1px solid #33476b;background:#0f1a2e;border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#18284a}
.btn.primary{background:linear-gradient(115deg,#5ee7ff,#a98bff);color:#04111c;border:0;font-weight:700;min-width:96px;justify-content:center}
.time{font:600 13px/1 var(--mono);color:var(--muted);min-width:92px;text-align:center}
.scrub{flex:1 1 220px;accent-color:var(--cyan);min-width:160px}
.opts{display:flex;gap:10px;align-items:center;margin-left:auto;color:var(--muted);font-size:13px}
.opts select{background:#0f1a2e;border:1px solid #33476b;border-radius:8px;padding:6px}
.nav{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-top:10px}
.nav button{border:1px solid #22314a;background:#0a1222;border-radius:9px;padding:7px 6px;text-align:left;cursor:pointer;min-height:44px;font-size:12px;line-height:1.2;color:var(--muted);overflow:hidden}
.nav button b{display:block;font:700 10px/1.2 var(--mono);color:#6f86ad}
.nav button[aria-current="true"]{border-color:var(--cyan);color:var(--ink);background:#0f2440}
.nav button[aria-current="true"] b{color:var(--cyan)}
.note{margin-top:10px;color:#7f92b3;font-size:12px}
@media (max-aspect-ratio:4/5),(max-width:700px){
  .stage{aspect-ratio:auto;height:66vh;max-height:none}
  .caps{padding:36px 14px 12px}
  .caps .msg{font-size:21px}
  .caps .vo{min-height:0;font-size:13px}
  .sceneTag{top:40px;left:14px;right:auto}
  .tagline{top:4%}
  .monitor{width:86%;margin-top:18%}
  .nav{grid-template-columns:repeat(3,minmax(0,1fr))}
  .opts{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.caps .msg span{transition:none}}
/* SVG */
.lbl{font-family:var(--font);fill:var(--ink)}
.mono{font-family:var(--mono)}
</style>
</head>
<body>
<main class="app">
  <div class="stage" id="stage" aria-label="Анимация FactoryOS" role="img">
    <svg class="world" id="svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="14"/></filter>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
        <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#0d1729"/><line x1="0" y1="0" x2="0" y2="14" stroke="#3b4d6e" stroke-width="5"/></pattern>
        <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#5ee7ff0d" stroke-width="2"/></pattern>
        <radialGradient id="vign" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#04070f"/></radialGradient>
      </defs>
      <g id="world"></g>
    </svg>
    <div class="hook" id="hook" aria-hidden="true"><div class="desk"></div>
      <div class="monitor"><div class="screen"><div class="os">FACTORYOS · CONSOLE</div>
        <div class="idea"><div class="dot"></div><b data-t="hook_idea"></b><small data-t="hook_idea_sub"></small></div></div></div></div>
    <div class="tagline" id="tagline"><b data-t="tagline"></b><small data-t="tagline_sub"></small></div>
    <div class="endmark" id="endmark"><div><b>FactoryOS</b><span data-t="end_line"></span><small data-t="end_note"></small></div></div>
    <div class="brandTag"><span>FactoryOS</span><span class="demo">DEMO</span></div>
    <div class="sceneTag" id="sceneTag"></div>
    <div class="caps" id="caps" aria-live="polite"><div class="msg" id="msg"></div><div class="vo" id="vo"></div></div>
  </div>

  <div class="controls" role="group" aria-label="Playback">
    <button class="btn" id="prev" type="button" aria-label="Previous scene">⏮ <span data-t="prev"></span></button>
    <button class="btn primary" id="play" type="button"></button>
    <button class="btn" id="next" type="button" aria-label="Next scene"><span data-t="next"></span> ⏭</button>
    <button class="btn" id="restart" type="button">↺ <span data-t="restart"></span></button>
    <input class="scrub" id="scrub" type="range" min="0" max="75" step="0.1" value="0" aria-label="Timeline">
    <span class="time" id="time">0:00 / 1:15</span>
    <div class="opts">
      <label><input type="checkbox" id="rm"> <span data-t="reduced"></span></label>
      <select id="lang" aria-label="Language"><option value="ru">RU</option><option value="uk">UK</option><option value="en">EN</option></select>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Scenes"></nav>
  <p class="note" data-t="footnote"></p>
</main>

// 9 Supporting layer for the grand reveal
link('M4510 340 C3600 180 1200 160 200 940', 68.4, {tone: 'amber', w: 3, op: .5, dur: 1.4});
[['gh', 1300, 'teal'], ['notion', 2700, 'violet'], ['relay', 4100, 'cyan'], ['ao', 5500, 'green']].forEach(([k, x, tone], i) => {
  card(x, 2020, 900, 110, k, {tone, size: 40, rx: 55, tin: 68.6 + i * .25});
});

/* ---------- Camera: keyframes of (t, cx, cy, view width) ---------- */
const CAM = [
  [0, 200, 1000, 760], [5, 200, 1000, 1000],
  [6.2, 1040, 995, 1980], [13, 1060, 1000, 1880],
  [14.2, 1870, 1005, 1560], [21, 1880, 1005, 1480],
  [22.2, 2670, 890, 1560], [31, 2690, 900, 1500],
  [32.2, 3460, 1020, 1900], [39, 3470, 1020, 1840],
  [40.4, 4390, 1005, 2260], [49, 4420, 1005, 2200],
  [50.2, 5010, 912, 3250], [59, 5050, 912, 3180],
  [60.2, 5880, 985, 3050], [68, 5890, 990, 2980],
  [72.5, 3300, 1250, 7600], [75, 3300, 1250, 7800]];
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function camAt(t, reduced) {
  if (reduced) { // jump straight to the settled framing of the current scene, no fly-through
    const s = sceneIndex(t), end = SCENES[s].t1 - .001;
    let k = CAM.length - 1; while (k > 0 && CAM[k][0] > end) k--; return CAM[k].slice(1);
  }
  if (t <= CAM[0][0]) return CAM[0].slice(1);
  for (let i = 1; i < CAM.length; i++) if (t <= CAM[i][0]) {
    const a = CAM[i - 1], b = CAM[i], u = ease((t - a[0]) / (b[0] - a[0]));
    // zoom in log space so pull-backs feel like a camera, not a slide
    return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, Math.exp(Math.log(a[3]) + (Math.log(b[3]) - Math.log(a[3])) * u)];
  }
  return CAM[CAM.length - 1].slice(1);
}

/* ---------- The luminous concept packet ---------- */
const MAIN = [ // t, x, y, state key
  [0, 200, 1000, 's_question'], [5, 200, 1000, 's_question'], [6.4, 900, 1000, 's_question'],
  [7.4, 800, 940, 's_evidence'], [8.6, 980, 960, 's_evidence'], [9.6, 900, 1060, 's_evidence'], [11.6, 1170, 900, 's_evidence'],
  [13, 1290, 900, 's_evidence'], [14.4, 1650, 1010, 's_evidence'], [16, 1850, 1010, 's_spec'], [17.6, 2050, 1010, 's_spec'],
  [19.6, 1850, 800, 's_spec'], [21, 2300, 1000, 's_spec'], [24.4, 2420, 1000, 's_pr'], [25.8, 2580, 1000, 's_pr'],
  [27.2, 2740, 1000, 's_pr'], [28.6, 2900, 1000, 's_pr'], [31, 2900, 1000, 's_pr'],
  [32.2, 3140, 860, 's_task'], [33.4, 3300, 800, 's_task'], [35, 3460, 860, 's_task'], [36.4, 3620, 800, 's_task'],
  [37.8, 3780, 920, 's_task'], [39.6, FX, 1000, 's_task']];
const BR = y => [ // one branch after the fork; y = 600 (A) or 1400 (B)
  [39.6, FX, 1000, 's_task'], [41, 4180, y, 's_pages'], [43.4, 4480, y, 's_pages'], [46, 4760, y, 's_promo'],
  [49, 4760, y, 's_promo'], [50.6, 5020, y, 's_promo'], [53.4, 5020, y, 's_promo'], [55.4, 5290, y + (y < 1000 ? -75 : 75), 's_promo'],
  [59, 5290, y, 's_promo'], [60.4, 5750, y - 110, 's_obs'], [62.6, 5750, y + 115, 's_obs'], [64.4, 6250, 1000, 's_obs']];
const DEC = [[64.4, 6250, 1000, 's_obs'], [66, 6250, 1240, 's_decision'], [67, 6250, 1500, 's_decision'], [68.8, 5600, 1840, 's_decision'],
  [71, 3300, 1840, 's_decision'], [73, 1000, 1840, 's_decision'], [74.4, 200, 1100, 's_question'], [75, 200, 1060, 's_question']];
function along(path, t, reduced) {
  if (t <= path[0][0]) return path[0];
  for (let i = 1; i < path.length; i++) if (t <= path[i][0]) {
    const a = path[i - 1], b = path[i];
    if (reduced) return a;
    const u = ease((t - a[0]) / (b[0] - a[0]));
    return [t, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, u > .5 ? b[3] : a[3]];
  }
  return path[path.length - 1];
}
function packet(color) {
  const g = el('g', {});
  el('circle', {r: 46, fill: color, opacity: .55, filter: 'url(#glow)'}, g);
  el('circle', {r: 17, fill: '#fff'}, g);
  const ring = el('circle', {r: 30, fill: 'none', stroke: color, 'stroke-width': 3, opacity: .9}, g);
  const lab = el('g', {}, g);
  const bg = el('rect', {x: -90, y: 44, width: 180, height: 36, rx: 18, fill: '#04070fd9', stroke: color, 'stroke-width': 2}, lab);
  const tx = el('text', {x: 0, y: 70, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#eef3ff', class: 'lbl'}, lab);
  return {g, ring, tx, bg};
}
const P = {main: packet('#5ee7ff'), a: packet('#5ee7ff'), b: packet('#a98bff')};

/* ---------- Render: everything is a pure function of t ---------- */
const $ = id => document.getElementById(id);
const stage = $('stage'), hook = $('hook'), tagline = $('tagline'), endmark = $('endmark');
let t = 0, playing = false, last = 0, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, lastScene = -1, lastMsgT = -1;
function sceneIndex(x) { for (let i = SCENES.length - 1; i >= 0; i--) if (x >= SCENES[i].t0) return i; return 0; }
const fade = (x, tin, tout, d = .45) => clamp((x - tin) / d) * (tout === undefined ? 1 : clamp((tout - x) / d));

function setPacket(p, state, x, y, op, ts) {
  p.g.setAttribute('transform', `translate(${x} ${y})`);
  p.g.style.opacity = op;
  p.ring.setAttribute('r', 30 + (reduced ? 0 : 6 * Math.sin(ts * 5)));
  const s = tr(state); if (p.tx.textContent !== s) { p.tx.textContent = s; const w = Math.max(120, s.length * 13 + 40); p.bg.setAttribute('x', -w / 2); p.bg.setAttribute('width', w); }
}
function render() {
  const s = sceneIndex(t);
  // camera; portrait screens frame tighter so labels stay legible
  const [cx, cy, w0] = camAt(t, reduced);
  const r = stage.getBoundingClientRect(), aspect = r.height / Math.max(1, r.width);
  const w = aspect > 1 ? w0 * (.62 + .38 * clamp((w0 - 3500) / 3000)) : w0, h = w * aspect;
  // captions overlay the bottom of the frame, so the subject sits above them
  const cyv = cy + (aspect > 1 ? .14 : .12) * h;
  svg.setAttribute('viewBox', `${(cx - w / 2).toFixed(1)} ${(cyv - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  // hook: push through the physical monitor
  const push = reduced ? 0 : ease(clamp((t - 2.6) / 2.4));
  if (!push) { // zoom into the glowing dot itself, wherever the layout put it
    const dr = hook.querySelector('.dot').getBoundingClientRect(), hr = hook.getBoundingClientRect();
    if (hr.width) hook.style.transformOrigin = `${dr.left + dr.width / 2 - hr.left}px ${dr.top + dr.height / 2 - hr.top}px`;
  }
  hook.style.transform = `scale(${1 + push * 7})`;
  hook.style.opacity = reduced ? (t < 4.4 ? 1 : 0) : 1 - clamp((t - 4.1) / .9);
  hook.style.visibility = t > 5.05 ? 'hidden' : 'visible';
  tagline.style.opacity = fade(t, .05, 3.6, .35);
  svg.style.opacity = clamp((t - 3.4) / 1.4);
  const endOp = fade(t, 72.6, undefined, .8);
  endmark.style.opacity = endOp; $('caps').style.opacity = 1 - endOp;   // the end mark takes over the caption band
  for (const e of timed) e.node.style.opacity = fade(t, e.tin, e.tout);
  for (const d of draws) {
    const u = reduced ? (t >= d.tin ? 1 : 0) : clamp((t - d.tin) / d.dur);
    d.p.setAttribute('stroke-dashoffset', 1 - u);
    d.p.style.visibility = (u > 0 && (d.tout === undefined || t < d.tout)) ? 'visible' : 'hidden';
  }
  // packets: one until the fork, two independent ones for A/B, one again for the decision
  const m = along(MAIN, t, reduced), a = along(BR(600), t, reduced), b = along(BR(1400), t, reduced), d = along(DEC, t, reduced);
  if (t < 39.6) setPacket(P.main, m[3], m[1], m[2], 1, t);
  else if (t >= 64.4) setPacket(P.main, d[3], d[1], d[2], 1, t);
  else setPacket(P.main, m[3], m[1], m[2], 0, t);
  const split = t >= 39.6 && t < 64.4 ? 1 : 0;
  setPacket(P.a, a[3], a[1], a[2], split, t); setPacket(P.b, b[3], b[1], b[2], split, t);
  // captions: kinetic per scene
  if (s !== lastScene) { buildCaption(s); lastScene = s; }
  const local = t - SCENES[s].t0;
  document.querySelectorAll('#msg span').forEach((sp, i) => {
    const u = reduced ? 1 : clamp((local - .25 - i * .09) / .35);
    sp.style.opacity = u; sp.style.transform = `translateY(${(1 - u) * 12}px)`;
  });
  $('vo').style.opacity = reduced ? 1 : clamp((local - .6) / .5);
  // chrome
  $('sceneTag').textContent = `${s + 1}/9 · ${L[lang].scenes[s]}`;
  $('scrub').value = t.toFixed(1);
  $('time').textContent = `${fmt(t)} / ${fmt(T)}`;
  document.querySelectorAll('#nav button').forEach((bt, i) => bt.setAttribute('aria-current', String(i === s)));
  $('play').textContent = playing ? L[lang].pause : (t >= T ? L[lang].replay : L[lang].play);
}
function buildCaption(s) {
  const msg = $('msg'); msg.textContent = '';
  L[lang].msg[s].split(' ').forEach((wd, i, arr) => { const sp = document.createElement('span'); sp.textContent = wd + (i < arr.length - 1 ? ' ' : ''); msg.appendChild(sp); });
  $('vo').textContent = L[lang].vo[s];
  stage.setAttribute('aria-label', `${L[lang].scenes[s]}: ${L[lang].msg[s]} ${L[lang].vo[s]}`);
}
const fmt = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

/* ---------- Playback ---------- */
function frame(now) {
  if (playing) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    t = Math.min(T, t + dt);
    if (t >= T) playing = false;
    render();
  }
  requestAnimationFrame(frame);
}
function play() { if (t >= T) t = 0; playing = true; last = performance.now(); render(); }
function pause() { playing = false; render(); }
function seek(x) { t = clamp(x, 0, T); render(); }
function goScene(i) { i = clamp(i, 0, SCENES.length - 1); seek(SCENES[i].t0 + (i ? .001 : 0)); }
$('play').onclick = () => playing ? pause() : play();
$('restart').onclick = () => { seek(0); play(); };
$('prev').onclick = () => { const s = sceneIndex(t); goScene(t - SCENES[s].t0 > 1.5 ? s : s - 1); };
$('next').onclick = () => goScene(sceneIndex(t) + 1);
$('scrub').oninput = e => seek(parseFloat(e.target.value));
$('rm').checked = reduced;
$('rm').onchange = e => { reduced = e.target.checked; render(); };
$('lang').onchange = e => setLang(e.target.value);
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,select')) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
  else if (e.key === 'Home') { e.preventDefault(); seek(0); }
});
const nav = $('nav');
SCENES.forEach((sc, i) => { const b = document.createElement('button'); b.type = 'button'; b.onclick = () => goScene(i); nav.appendChild(b); });
function setLang(l) {
  lang = L[l] ? l : 'ru'; document.documentElement.lang = lang; $('lang').value = lang;
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = L[lang][n.dataset.t]; });
  document.querySelectorAll('#world [data-k]').forEach(n => { n.textContent = tr(n.dataset.k); });
  nav.querySelectorAll('button').forEach((b, i) => { b.innerHTML = ''; const k = document.createElement('b');
    k.textContent = `${fmt(SCENES[i].t0)}`; b.appendChild(k); b.appendChild(document.createTextNode(L[lang].scenes[i])); });
  lastScene = -1; render();
}
addEventListener('resize', render);
// test / review hooks: ?t=42&lang=en&paused=1
const q = new URLSearchParams(location.search);
window.explainer = {seek, play, pause, goScene, state: () => ({t, playing, scene: SCENES[sceneIndex(t)].id, lang, reduced}), duration: T, scenes: SCENES};
setLang(q.get('lang') || 'ru');
if (q.get('reduced') === '1') { reduced = true; $('rm').checked = true; }
seek(parseFloat(q.get('t')) || 0);
if (q.get('paused') !== '1' && !q.get('t')) play();
requestAnimationFrame(frame);
})();
</script>
