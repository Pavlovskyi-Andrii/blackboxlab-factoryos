<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FactoryOS Owner Home</title>
<style>
/* Clickable prototype for issue #452 (T-733), direction 2 «Products and goals».
   Self-contained: served by /learn/view/owner-home in a CSP sandbox (no network, no storage guaranteed).
   Layout: product shell (sidebar on wide, bottom tabs on narrow) under a separate amber prototype bar. */
:root{
  --bg:#050a10;--panel:#0a1420;--panel2:#0e1a2a;--line:#193149;--line2:#264b69;
  --text:#f3f8ff;--muted:#93a6b9;--cyan:#27caff;--blue:#2677ff;--green:#34dc7d;--amber:#ffb63a;--red:#ff6b6b;
  --proto:#2a2008;--proto-line:#8a6a1c;
  --f12:12px;--f14:14px;--f16:16px;--f20:20px;--f28:28px;
  --s4:4px;--s8:8px;--s12:12px;--s16:16px;--s24:24px;--s32:32px;
  --r:10px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--f14)/1.5 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- prototype bar (not part of the product) ---- */
.proto{background:var(--proto);border-bottom:1px dashed var(--proto-line);padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:var(--f12)}
.proto b{color:var(--amber);letter-spacing:.08em}
.proto label{display:flex;gap:6px;align-items:center;color:#e9d9b0}
.proto select,.proto button{background:#1b1505;border:1px solid var(--proto-line);border-radius:6px;padding:4px 8px;min-height:30px}
.proto .langs{display:flex;gap:4px}
.proto .langs button[aria-pressed="true"]{background:var(--amber);color:#1b1505;font-weight:700}

/* ---- app shell ---- */
.stage{padding:16px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
@media (max-width:600px){.stage{padding:0 0 24px}.app{border:0;border-radius:0}}
.app{display:grid;grid-template-columns:220px 1fr;min-height:720px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);max-width:1360px;margin:0 auto}
.app.framed{max-width:390px;min-height:780px}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:var(--f16);padding:4px 8px 16px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:var(--f12)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:10px 10px;color:var(--muted);min-height:40px}
.nav:hover{color:var(--text);background:var(--panel2)}
.nav[aria-current="page"]{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.count{min-width:22px;padding:0 6px;border-radius:999px;background:var(--amber);color:#1b1505;font-weight:700;font-size:var(--f12);text-align:center}
.sep{height:1px;background:var(--line);margin:8px 4px}
.side .grow{flex:1}
.proBtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px;min-height:40px;text-align:left}
.proBtn small{color:var(--muted);font-size:var(--f12)}
.main{min-width:0;display:flex;flex-direction:column}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.head h1{font-size:var(--f20);margin:0;line-height:1.25;text-wrap:balance}
.head .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo{font-size:var(--f12);letter-spacing:.08em;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:2px 8px;white-space:nowrap}
.body{padding:24px;display:flex;flex-direction:column;gap:24px;min-width:0}
.tabbar{display:none}

/* ---- narrow (phone) layout: set by width of .app, not the window ---- */
.app.narrow{grid-template-columns:1fr}
.app.narrow .side{display:none}
.app.narrow .head{padding:12px 16px}
.app.narrow .body{padding:16px 16px 96px;gap:16px}
.app.narrow .tabbar{display:flex;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;margin-top:auto}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;min-width:64px;padding:4px 6px;font-size:var(--f12);border-radius:8px}
.tab[aria-current="page"]{color:var(--cyan)}
.tab .count{font-size:var(--f12)}
.app.narrow .btn{min-height:44px}
.app.narrow .grid3,.app.narrow .grid2,.app.narrow .cmp{grid-template-columns:1fr}

/* ---- components ---- */
h2{font-size:var(--f16);margin:0 0 var(--s12);text-wrap:balance}
h3{font-size:var(--f14);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.lead{font-size:var(--f16);color:var(--muted);max-width:68ch}
.label{font-size:var(--f12);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 var(--s8)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.need{border-color:var(--amber)}
.card.bad{border-color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;min-height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:none}
.btn.danger{border-color:var(--red);color:var(--red);background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--f12);padding:2px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.need{color:var(--amber);border-color:var(--amber)}
.pill.work{color:var(--cyan);border-color:var(--cyan)}
.pill.done{color:var(--green);border-color:var(--green)}
.pill.stop{color:var(--red);border-color:var(--red)}
.pill.wait,.pill.off{color:var(--muted)}
.strip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--amber);border-radius:var(--r);padding:12px 16px}
.strip .grow{flex:1;min-width:200px}
.banner{border-radius:var(--r);padding:12px 16px;border:1px solid var(--line2);background:var(--panel2);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.banner.warn{border-color:var(--amber)}
.banner.bad{border-color:var(--red)}
.banner .grow{flex:1;min-width:200px}
.funnel{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.funnel table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.funnel th,.funnel td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:var(--f14)}
.funnel tr:last-child td{border-bottom:0}
.funnel th{font-size:var(--f12);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.funnel td.n{text-align:right;white-space:nowrap}
.na{color:var(--muted);font-style:italic}
.tw{overflow-x:auto}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);justify-self:center}
.dot.done{background:var(--green);border-color:var(--green)}
.dot.work{background:var(--cyan);border-color:var(--cyan)}
.dot.need{background:var(--amber);border-color:var(--amber)}
.dot.stop{background:var(--red);border-color:var(--red)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hero{display:flex;flex-direction:column;gap:16px;padding:8px 0}
.hero h2{font-size:var(--f28);line-height:1.2;margin:0;max-width:22ch}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:h;list-style:none;margin:0;padding:0}
.how li{counter-increment:h;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.how li::before{content:counter(h);font-weight:700;color:var(--cyan)}
/* wizard */
.wiz{max-width:640px;display:flex;flex-direction:column;gap:16px}
.progress{display:flex;gap:4px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--cyan)}
.choice{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);min-height:44px}
.opt:has(input:checked){border-color:var(--cyan);background:var(--panel2)}
.opt input{margin-top:3px;accent-color:var(--cyan)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;min-height:44px}
.field textarea{min-height:88px;resize:vertical}
.wizActions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.app.narrow .wizActions{position:sticky;bottom:64px;background:var(--bg);padding:8px 0;border-top:1px solid var(--line)}
.summary dd .unk{color:var(--amber)}
/* compare */
.cmpbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 16px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--cyan);font-weight:700}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.land{background:#f6f3ee;color:#16202b;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;border:3px solid transparent}
.land.win{border-color:var(--green)}
.land .tag{font-size:var(--f12);font-weight:700;letter-spacing:.08em;color:#5b6775}
.land h4{font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.land p{color:#38444f}
.land .cta{align-self:flex-start;background:#1f5eff;color:#fff;border-radius:8px;padding:10px 16px;font-weight:700}
.land .sample{display:flex;gap:10px;align-items:center;background:#e7e1d6;border-radius:8px;padding:10px 12px;font-size:var(--f14)}
.land .sample i{width:28px;height:28px;border-radius:50%;background:#16202b;display:inline-block;flex:none}
.land .foot{font-size:var(--f12);color:#5b6775}
.show-diff .land mark{background:#ffe48a;color:inherit;padding:0 2px;border-radius:3px}
.land mark{background:none;color:inherit}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.ok{color:var(--green);font-weight:700}.warn{color:var(--amber);font-weight:700}.no{color:var(--red);font-weight:700}
.decide{display:flex;flex-direction:column;gap:12px}
.consequence{border-left:3px solid var(--cyan);padding:8px 12px;background:var(--panel2);border-radius:0 8px 8px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--cyan);border-radius:10px;padding:10px 16px;max-width:min(92vw,520px);z-index:20}
.pro{display:flex;flex-direction:column;gap:16px}
.pro .mock{border:1px dashed var(--line2);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pro .mock span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:var(--f12);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tools .card button{text-align:left;background:none;border:0;padding:6px 0;color:var(--text);min-height:32px}
.tools .card button:hover{color:var(--cyan)}
</style>
</head>

/* ================= prototype state ================= */
const STATES = ["new","empty","working","approval","completed","failed","offline","budget"];
const VIEWS = ["home","needs","results","team","tools","goal-mycast","compare","wizard","pro"];
const S = {lang:"ru",state:"approval",view:"home",framed:false,diff:true,side:"A",decision:null,later:{},wiz:{step:1,product:"mycast",newName:"",newLink:"",result:"a",other:"",audience:"",ch:{tg:true,li:false,direct:false},until:"2026-12-31",edit:null},mode:"simple"};
const mem = {};
function store(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function load(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}}

const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function t(k,vars){let s=(L[S.lang]&&L[S.lang][k]);if(s===undefined)s=L.en[k];if(s===undefined)s=k;if(vars)for(const v in vars)s=s.split("{"+v+"}").join(vars[v]);return s}
const $ = sel => document.querySelector(sel);

/* ================= data per state (DEMO) ================= */
function D(){
 const st=S.state;
 const products = st==="new"?[]:["mycast","dm","content"];
 const hasGoal = !["new","empty"].includes(st);
 const needs = ({
  new:[],empty:[],
  working:["dm"],
  approval:["compare","dm","pay"],
  completed:["next","pay"],
  failed:["stop","dm"],
  offline:["compare"],
  budget:["budget","dm"]
 })[st].filter(id=>!S.later[id] && !(id==="compare" && S.decision));
 const mycastStatus = ({empty:null,working:"work",approval:"need",completed:"done",failed:"stop",offline:"off",budget:"work"})[st]||null;
 const lanes = {
  claude: ({working:["work","lw_claude"],budget:["work","lw_budget"],offline:["off","lane_off"],failed:["wait","lane_idle"]})[st]||["wait","lane_idle"],
  chatgpt: st==="offline"?["off","lane_off"]:["off","lane_off"],
  gemini: ["off","lane_off"],
  surfer: ({working:["work","lw_surfer"],failed:["stop","lane_stop"],offline:["off","lane_off"]})[st]||["wait","lane_idle"]
 };
 const plan = ({
  working:{research:"work"},
  approval:{research:"done",hyp:"done",var:"done",qa:"done",decide:"need"},
  completed:{research:"done",hyp:"done",var:"done",qa:"done",decide:"done",dist:"done",measure:"done",learn:"done"},
  failed:{research:"stop"},
  offline:{research:"done",hyp:"done",var:"done",qa:"done",decide:"need"},
  budget:{research:"done",hyp:"work"}
 })[st]||{};
 if(S.decision && plan.decide==="need") plan.decide="done";
 return {products,hasGoal,needs,mycastStatus,lanes,plan,measured:st==="completed"};
}
const NEED = {
 compare:{kind:"need",k:"k_approve",title:"n_compare",sub:"n_compareS",act:["compare","go:compare"]},
 dm:{kind:"need",k:"k_answer",title:"n_dm",sub:"n_dmS",act:["answer","toast:linkAnswer"]},
 pay:{kind:"need",k:"k_setup",title:"n_pay",sub:"n_payS",act:["howTo","go:pro"]},
 next:{kind:"need",k:"k_approve",title:"n_next",sub:"n_nextS",act:["k_approve","approveNext"]},
 stop:{kind:"stop",k:"k_stopped",title:"n_stop",sub:"n_stopS",act:["retry","retry"]},
 budget:{kind:"need",k:"k_setup",title:"n_budget",sub:"n_budgetS",act:["howTo","go:pro"]}
};

/* ================= rendering ================= */
const pill = (kind,label) => `<span class="pill ${kind}">${esc(label)}</span>`;
const stWord = {need:"st_need",work:"st_work",wait:"st_wait",done:"st_done",stop:"st_stop",off:"st_off",pause:"st_pause"};

function render(){
 document.documentElement.lang = S.lang==="uk"?"uk":S.lang;
 document.title = "FactoryOS · "+t("t_"+titleKey());
 ["pLabel","pState","pFrame","pNote"].forEach(id=>$("#"+id).textContent=t(id));
 const sel=$("#stateSel"); sel.innerHTML=STATES.map(s=>`<option value="${s}"${s===S.state?" selected":""}>${esc(t("s_"+s))}</option>`).join("");
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===S.lang)));
 const d=D();
 const app=$("#app"); app.classList.toggle("framed",S.framed);
 lastNarrow = app.clientWidth<760; app.classList.toggle("narrow",lastNarrow);
 const nNeeds=d.needs.length;
 const navItem=(v,label,count)=>`<button class="nav" data-go="${v}"${current(v)?' aria-current="page"':""}><span>${esc(label)}</span>${count?`<span class="count">${count}</span>`:""}</button>`;
 app.innerHTML = `
 <nav class="side" aria-label="Main">
  <div class="brand">FactoryOS<small>${esc(t("brandSub"))}</small></div>
  ${navItem("home",t("nav_home"))}${navItem("needs",t("nav_needs"),nNeeds)}${navItem("results",t("nav_results"))}
  <div class="sep"></div>
  ${navItem("team",t("nav_team"))}${navItem("tools",t("nav_tools"))}
  <div class="grow"></div>
  <button class="proBtn" data-act="pro"><span>${esc(t("pro"))}<br><small>${esc(t("proHint"))}</small></span><span aria-hidden="true">→</span></button>
 </nav>
 <div class="main">
  <header class="head">
   <h1>${esc(t("t_"+titleKey()))}</h1>
   <div class="tools"><span class="demo">${esc(t("demo"))}</span>${S.view==="pro"?`<button class="btn" data-act="simple">${esc(t("simple"))}</button>`:`<button class="btn ghost" data-act="pro">${esc(t("pro"))}</button>`}${S.view==="home"&&d.products.length?`<button class="btn pri" data-go="wizard">+ ${esc(t("newGoal"))}</button>`:""}</div>
  </header>
  <main class="body" id="view">${views[viewKey()](d)}</main>
  <nav class="tabbar" aria-label="Main">
   ${tab("home",t("nav_home"))}${tab("needs",t("nav_needs"),nNeeds)}${tab("results",t("nav_results"))}${tab("tools",t("nav_more"))}
  </nav>
 </div>`;
}
function tab(v,label,count){const on=v==="tools"?["tools","team","pro"].includes(S.view):current(v);return `<button class="tab" data-go="${v}"${on?' aria-current="page"':""}><span>${esc(label)}</span>${count?`<span class="count">${count}</span>`:""}</button>`}
function current(v){return S.view===v||(v==="home"&&["goal-mycast","compare","wizard"].includes(S.view))}
function viewKey(){return S.view==="goal-mycast"?"goal":S.view}
function titleKey(){return ({"goal-mycast":"goal"})[S.view]||S.view}

function banners(){
 if(S.state==="offline") return `<div class="banner bad" role="status"><div class="grow"><b>${esc(t("offTitle"))}</b><p class="muted">${esc(t("offSub"))}</p></div><button class="btn" data-go="team">${esc(t("nav_team"))}</button></div>`;
 if(S.state==="failed") return `<div class="banner bad" role="status"><div class="grow"><b>${esc(t("failTitle"))}</b><p class="muted">${esc(t("failSub"))}</p></div><button class="btn pri" data-act="retry">${esc(t("retry"))}</button><button class="btn" data-act="toast:linkRunbook">${esc(t("runbook"))}</button></div>`;
 if(S.state==="budget") return `<div class="banner warn" role="status"><div class="grow"><b>${esc(t("budgetTitle"))}</b><p class="muted">${esc(t("budgetSub"))}</p></div><button class="btn" data-act="pro">${esc(t("howTo"))}</button></div>`;
 return "";
}
function needCard(id){const n=NEED[id];return `<div class="card ${n.kind==="stop"?"bad":"need"}"><div class="row">${pill(n.kind==="stop"?"stop":"need",t(n.k))}<h3 class="grow">${esc(t(n.title))}</h3></div><p class="muted">${esc(t(n.sub))}</p><div class="row"><button class="btn pri" data-act="${n.act[1]}">${esc(t(n.act[0]))}</button><button class="btn ghost" data-act="later:${id}">${esc(t("later"))}</button></div></div>`}

function funnelRows(d,compact){
 const m=d.measured;
 const rows=[
  ["f_exposure",null,null,"—"],
  ["f_visit",m?"214 / 198":null,null,"f_exposure"],
  ["f_signup",m?"9 / 15":(d.hasGoal?"12":"0"),null,"f_visit"],
  ["f_active",m?"5 / 10":(d.hasGoal?"7":"0"),null,"f_signup"],
  ["f_pay",null,"notConnected","f_active"]
 ];
 if(compact) return rows.filter((r,i)=>i>0).map(r=>`<tr><td>${esc(t(r[0]))}</td><td class="n">${r[1]!==null?esc(r[1]):`<span class="na">${esc(t(r[2]||"notMeasured"))}</span>`}</td></tr>`).join("");
 return rows.map(r=>`<tr><td>${esc(t(r[0]))}</td><td class="n">${r[1]!==null?esc(r[1]):`<span class="na">${esc(t(r[2]||"notMeasured"))}</span>`}</td><td class="muted">${r[3]==="—"?"—":esc(t(r[3]))}</td></tr>`).join("");
}

function productCard(id,d){
 if(id==="mycast"){
  const st=d.mycastStatus;
  if(!d.hasGoal) return `<div class="card"><div class="row"><h3 class="grow">MyCast</h3></div><p class="muted">${esc(t("noGoal"))}</p><div class="row"><button class="btn pri" data-go="wizard" data-prod="mycast" data-quick="1">${esc(t("setGoal"))}</button></div></div>`;
  return `<div class="card${st==="need"?" need":st==="stop"?" bad":""}"><div class="row"><h3 class="grow">MyCast</h3>${pill(st,t(stWord[st]))}</div>
   <p class="muted">${esc(t("goalMy"))}</p>
   <div class="funnel"><table><caption class="sr">${esc(t("g_funnel"))}</caption><tbody>${funnelRows(d,true)}</tbody></table></div>
   <p><span class="muted">${esc(t("next"))}:</span> ${esc(t("nx_"+S.state))}</p>
   <div class="row">${st==="need"?`<button class="btn pri" data-go="compare">${esc(t("compare"))}</button>`:""}<button class="btn" data-go="goal-mycast">${esc(t("openGoal"))}</button><button class="btn ghost" data-go="results">${esc(t("evidence"))}</button></div></div>`;
 }
 if(id==="dm"){
  const asks=d.needs.includes("dm");
  return `<div class="card${asks?" need":""}"><div class="row"><h3 class="grow">AI Decision Memory</h3>${asks?pill("need",t("st_need")):""}</div><p class="muted">${esc(t("noGoal"))}. ${esc(t("dmStage"))}</p><div class="row"><button class="btn pri" data-go="wizard" data-prod="dm" data-quick="1">${esc(t("setGoal"))}</button>${asks?`<button class="btn" data-act="toast:linkAnswer">${esc(t("answer"))}</button>`:""}</div></div>`;
 }
 return `<div class="card"><div class="row"><h3 class="grow">${esc(t("contentCard"))}</h3>${pill("wait",t("st_pause"))}</div><p class="muted">${esc(t("contentSub"))}</p><div class="row"><button class="btn" data-act="pro">${esc(t("open"))}</button></div></div>`;
}

function workingBlock(d){
 const on=Object.entries(d.lanes).filter(([,v])=>v[0]==="work");
 const inner = on.length? on.map(([k,v])=>`<div class="row">${pill("work",t("st_work"))}<span class="grow"><b>${esc(t("lane_"+k))}</b> · ${esc(t(v[1]))}</span></div>`).join("")
  : `<p class="muted">${esc(d.needs.length?t("w_noneNeeds",{n:d.needs.length}):t("w_none"))}</p>`;
 return `<div class="card"><p class="label">${esc(t("workingNow"))}</p>${inner}</div>`;
}
function spendBlock(){
 const low=S.state==="budget";
 return `<div class="card${low?" need":""}"><p class="label">${esc(t("spend"))}</p><b>${esc(t(low?"spendLow":"spend0"))}</b><p class="muted">${esc(t(low?"spendLowSub":"spend0sub"))}</p></div>`;
}

   <section class="hero"><h2>${esc(t("newTitle"))}</h2><p class="lead">${esc(t("newLead"))}</p>
   <div class="row"><button class="btn pri" data-go="wizard" data-prod="new">${esc(t("addFirst"))}</button><button class="btn" data-act="state:approval">${esc(t("seeExample"))}</button><button class="btn ghost" data-act="toast:linkLearn">${esc(t("howWorks"))}</button></div></section>
   <ol class="how"><li><b>${esc(t("how1"))}</b><span class="muted">${esc(t("how1s"))}</span></li><li><b>${esc(t("how2"))}</b><span class="muted">${esc(t("how2s"))}</span></li><li><b>${esc(t("how3"))}</b><span class="muted">${esc(t("how3s"))}</span></li><li><b>${esc(t("how4"))}</b><span class="muted">${esc(t("how4s"))}</span></li></ol>
   <div class="grid2">${workingBlock(d)}${spendBlock()}</div>`;
  const strip = d.needs.length?`<div class="strip">${pill("need",t("needsStrip",{n:d.needs.length}))}<b class="grow">${esc(t(NEED[d.needs[0]].title))}</b><button class="btn pri" data-act="${NEED[d.needs[0]].act[1]}">${esc(t(NEED[d.needs[0]].act[0]))}</button>${d.needs.length>1?`<button class="btn" data-go="needs">${esc(t("more",{n:d.needs.length-1}))}</button>`:""}</div>`:"";
  return `<p class="lead">${esc(t("promise"))}</p>${banners()}${strip}
   ${S.state==="empty"?`<div class="empty"><b>${esc(t("emptyTitle"))}</b><p class="muted">${esc(t("emptyLead"))}</p></div>`:""}
   <section class="grid3" aria-label="${esc(t("t_home"))}">${d.products.map(p=>productCard(p,d)).join("")}</section>
   <div class="grid2">${workingBlock(d)}${spendBlock()}</div>`;
 },
 needs(d){
  if(!d.needs.length) return `${banners()}<div class="empty"><b>${esc(t("needsEmpty"))}</b><p class="muted">${esc(t("needsEmptyS"))}</p></div>`;
  return `${banners()}<div class="list">${d.needs.map(needCard).join("")}</div>`;
 },
 results(d){
  const defs=`<dl class="kv"><dt>${esc(t("r_click"))}</dt><dd>${esc(t("r_clickS"))}</dd><dt>${esc(t("r_lead"))}</dt><dd>${esc(t("r_leadS"))}</dd><dt>${esc(t("r_pay"))}</dt><dd>${esc(t("r_payS"))}</dd></dl>`;
  if(!d.hasGoal) return `<p class="lead">${esc(t("results_intro"))}</p><div class="card">${defs}</div><div class="empty"><b>${esc(t("r_none"))}</b><button class="btn pri" data-go="wizard">${esc(t("newGoal"))}</button></div>`;
  return `<p class="lead">${esc(t("results_intro"))}</p>${banners()}
   <section class="card"><div class="row"><h2 class="grow" style="margin:0">MyCast</h2>${pill(d.mycastStatus,t(stWord[d.mycastStatus]))}</div><p class="muted">${esc(t("goalMy"))}</p>
   <div class="funnel tw"><table><thead><tr><th>${esc(t("col_step"))}</th><th class="n">${esc(t("col_count"))}${d.measured?" (A / B)":""}</th><th>${esc(t("col_from"))}</th></tr></thead><tbody>${funnelRows(d,false)}</tbody></table></div>
   <p class="muted">${esc(t("denomNote"))}</p>${d.measured?`<p>${esc(t("resultNote"))}</p>`:""}</section>
   <div class="card">${defs}</div>`;
 },
 team(d){
  const rows=Object.entries(d.lanes).map(([k,v])=>`<div class="card"><div class="row"><h3 class="grow">${esc(t("lane_"+k))}</h3>${pill(v[0],t(stWord[v[0]]))}</div><p class="muted">${esc(t(v[1]))}</p></div>`).join("");
  return `${banners()}<div class="grid2">${rows}</div><div class="banner"><p class="grow">${esc(t("teamPro"))}</p><button class="btn" data-act="pro">${esc(t("pro"))}</button></div>`;
 },
 tools(){
  const G=[
   ["tg_content",["New Job","Jobs","Discovery","Revideo","Content Brain","Media Finisher"]],
   ["tg_publish",["Review","Publish","Social autopilot","LinkedIn","OLX"]],
   ["tg_mvp",["Projects","MyCast podcast","Decision Memory","MyBrief","Launchpad"]],
   ["tg_team",["Agent Office","Workers","Build Progress","Autopilot","Supervisor","Error Center","Release QA","Browser agent"]],
   ["tg_data",["Performance","Analytics","Experiments","Google Sheets","Brand strategy","Mods & skills","Learning"]]
  ];
  return `<p class="muted">${esc(t("toolPro"))}</p><div class="tools">${G.map(([g,items])=>`<div class="card"><p class="label">${esc(t(g))}</p>${items.map(i=>`<button data-act="pro">${esc(i)}</button>`).join("")}</div>`).join("")}</div>
   <div class="row"><button class="btn" data-go="team">${esc(t("nav_team"))}</button><button class="btn" data-act="pro">${esc(t("pro"))}</button></div>`;
 },
 goal(d){
  if(!d.hasGoal) return `<div class="empty"><b>${esc(t("noGoal"))}</b><button class="btn pri" data-go="wizard">${esc(t("setGoal"))}</button></div>`;
  const steps=["research","hyp","var","qa","decide","dist","measure","learn"];
  const plan=steps.map(s=>{const st=d.plan[s]||"wait";return `<li><span class="dot ${st}"></span><span>${esc(t("p_"+s))}</span><span>${st==="wait"?`<span class="muted">${esc(t("st_wait"))}</span>`:pill(st,t(stWord[st]))}</span></li>`}).join("");
  const showHyp = d.plan.hyp==="done";
  const log = [
   ["14:02",S.lang==="en"?"Claude took «MyCast research» (run-8f2c)":S.lang==="uk"?"Claude узяв «Дослідження MyCast» (run-8f2c)":"Claude взял «Исследование MyCast» (run-8f2c)"],
   ...(d.plan.research==="done"?[["15:20",t("ev1")+" · "+t("lv_linked")]]:[]),
   ...(d.plan.var==="done"?[["16:05",t("ev2")]]:[]),
   ...(d.plan.qa==="done"?[["16:30",t("ev3")+" · "+t("lv_checked")]]:[]),
   ...(d.plan.decide==="done"?[["17:12",t("ev4")]]:[]),
   ...(S.state==="failed"?[["03:41",t("n_stopS")]]:[])
  ].reverse();
  return `${banners()}
   <section class="card"><dl class="kv"><dt>${esc(t("g_outcome"))}</dt><dd><b>${esc(t("wz2a"))}</b><br><span class="muted">${esc(t("g_genuine"))}</span></dd><dt>${esc(t("g_audience"))}</dt><dd>${esc(t("g_audVal"))}</dd><dt>${esc(t("g_channel"))}</dt><dd>Telegram</dd><dt>${esc(t("g_langs"))}</dt><dd>EN, UK, RU</dd><dt>${esc(t("g_period"))}</dt><dd>31.12.2026</dd><dt>${esc(t("g_budget"))}</dt><dd>$0</dd></dl></section>
   ${d.needs.filter(n=>["compare","next","stop"].includes(n)).map(needCard).join("")}
   <div class="grid2">
    <section class="card"><h2>${esc(t("g_funnel"))}</h2><div class="funnel tw"><table><thead><tr><th>${esc(t("col_step"))}</th><th class="n">${esc(t("col_count"))}</th><th>${esc(t("col_from"))}</th></tr></thead><tbody>${funnelRows(d,false)}</tbody></table></div><p class="muted">${esc(t("denomNote"))}</p>${d.measured?`<p>${esc(t("resultNote"))}</p><div class="consequence"><b>${esc(t("learn"))}</b><p>${esc(t("learnS"))}</p></div>`:""}</section>
    <section class="card"><h2>${esc(t("g_plan"))}</h2><ol class="steps">${plan}</ol></section>
   </div>
   ${showHyp?`<section class="card"><h2>${esc(t("g_hyp"))}</h2><p>${esc(t("hA"))}</p><p>${esc(t("hB"))}</p><p class="muted">${esc(t("hMetric"))}</p>${d.plan.var==="done"?`<div class="row"><button class="btn" data-go="compare">${esc(t("compare"))}</button></div>`:""}</section>`:""}
   <div class="grid2">
    <section class="card"><h2>${esc(t("g_log"))}</h2><ul class="log">${log.map(([tm,x])=>`<li><time>${tm}</time><span>${esc(x)}</span></li>`).join("")}</ul></section>
    <section class="card"><h2>${esc(t("g_ev"))}</h2><ul class="log">${[["ev1","lv_linked",d.plan.research==="done"],["ev2","lv_linked",d.plan.var==="done"],["ev3","lv_checked",d.plan.qa==="done"],["ev4","lv_accepted",d.plan.decide==="done"]].filter(x=>x[2]).map(([e,l])=>`<li><time>${esc(t(l))}</time><span>${esc(t(e))}</span></li>`).join("")||`<li><time>—</time><span class="muted">${esc(t("st_wait"))}</span></li>`}</ul></section>
   </div>`;
 },
 compare(){
  const land=(v)=>{const a=v==="A";const win=S.decision===v;
   return `<article class="land${win?" win":""}" aria-label="${esc(t(a?"lA":"lB"))}"><span class="tag">${esc(t(a?"lA":"lB"))}</span>
    <h4><mark>${esc(t(a?"a_h":"b_h"))}</mark></h4><p><mark>${esc(t(a?"a_p":"b_p"))}</mark></p>
    ${a?"":`<div class="sample"><mark style="display:contents"><i aria-hidden="true"></i>${esc(t("b_sample"))} · 1:00</mark></div>`}
    <span class="cta"><mark style="background:none;color:inherit">${esc(t(a?"a_cta":"b_cta"))}</mark></span><span class="foot">${esc(t("land_foot"))}</span></article>`};
  const narrow=$("#app").classList.contains("narrow");
  const qa=[["ok","qa1"],["ok","qa2"],["ok","qa3"],["ok","qa4"],["warn","qa5","qa5s"],["ok","qa6"]].map(([c,k,s])=>`<li><span class="${c}" aria-hidden="true">${c==="ok"?"✓":"!"}</span><span>${esc(t(k))}${s?` — <span class="muted">${esc(t(s))}</span>`:""}</span></li>`).join("");
  const decided = S.decision? `<div class="consequence" role="status"><b>${esc(S.decision==="rejected"?t("rejected"):t("decided",{v:t(S.decision==="A"?"v_a":"v_b"),time:"04:31"}))}</b></div><div class="row"><button class="btn" data-act="undo">${esc(t("undo"))}</button><button class="btn pri" data-go="goal-mycast">${esc(t("openGoal"))}</button></div>`
   : `<p class="consequence">${esc(t("cons"))}</p>
      <div class="row"><button class="btn pri" data-act="decide:A">${esc(t("chooseA"))}</button><button class="btn pri" data-act="decide:B">${esc(t("chooseB"))}</button><button class="btn ghost" data-act="later:compare">${esc(t("later"))}</button></div>
      <div class="field"><label for="reason">${esc(t("reason"))}</label><input id="reason" placeholder="${esc(t("reasonPh"))}"></div>
      <div class="row"><button class="btn danger" data-act="reject">${esc(t("rejectBoth"))}</button></div>`;
  return `<div class="cmpbar"><span class="muted grow">${esc(t("c_ch"))}</span>
    <label class="row"><input type="checkbox" id="diffChk"${S.diff?" checked":""}> ${esc(t("c_show"))}</label>
    ${narrow?`<div class="seg" role="group"><button data-act="side:A" aria-pressed="${S.side==="A"}">A</button><button data-act="side:B" aria-pressed="${S.side==="B"}">B</button></div>`:""}</div>
   <div class="cmp${S.diff?" show-diff":""}">${narrow?land(S.side):land("A")+land("B")}</div>
   <div class="grid2">
    <section class="card"><h2>${esc(t("g_hyp"))}</h2><p>${esc(t("hA"))}</p><p>${esc(t("hB"))}</p><p class="muted">${esc(t("hMetric"))}</p></section>
    <section class="card"><h2>${esc(t("c_qa"))}</h2><ul class="checks">${qa}</ul></section>
   </div>
   <section class="card decide"><h2>${esc(t("c_decide"))}</h2>${decided}</section>`;
 },
 wizard(){
  const W=S.wiz, N=6, i=W.step;
  const prog=`<div class="progress" aria-hidden="true">${Array.from({length:N},(_,k)=>`<span class="${k<i?"on":""}"></span>`).join("")}</div><p class="muted">${esc(t("wz_step",{i,n:N}))}</p>`;
  const radio=(name,val,label,checked)=>`<label class="opt"><input type="radio" name="${name}" value="${val}"${checked?" checked":""}><span>${esc(label)}</span></label>`;
  const aud = W.audience || t("g_audVal");
  let body="";
  if(i===1) body=`<h2>${esc(t("wz1"))}</h2><div class="choice">${S.state==="new"?"":radio("product","mycast","MyCast",W.product==="mycast")+radio("product","dm","AI Decision Memory",W.product==="dm")}${radio("product","new",t("wz1new"),W.product==="new"||S.state==="new")}</div>
   ${(W.product==="new"||S.state==="new")?`<div class="field"><label for="wzName">${esc(t("wz1name"))}</label><input id="wzName" value="${esc(W.newName)}"></div><div class="field"><label for="wzLink">${esc(t("wz1link"))}</label><input id="wzLink" value="${esc(W.newLink)}" inputmode="url"></div>`:""}`;
  if(i===2) body=`<h2>${esc(t("wz2"))}</h2><div class="choice">${radio("result","a",t("wz2a"),W.result==="a")}${radio("result","b",t("wz2b"),W.result==="b")}${radio("result","c",t("wz2c"),W.result==="c")}</div>${W.result==="c"?`<div class="field"><label for="wzOther">${esc(t("wz2other"))}</label><input id="wzOther" value="${esc(W.other)}"></div>`:""}${W.result==="a"?`<p class="muted">${esc(t("g_genuine"))}</p>`:""}`;
  if(i===3) body=`<h2>${esc(t("wz3"))}</h2><p class="muted">${esc(t("wz3hint"))}</p><div class="field"><label class="sr" for="wzAud">${esc(t("g_audience"))}</label><textarea id="wzAud">${esc(aud)}</textarea></div>`;
  if(i===4) body=`<h2>${esc(t("wz4"))}</h2><p class="muted">${esc(t("wz4hint"))}</p><div class="choice">${["tg","li","direct"].map(c=>`<label class="opt"><input type="checkbox" name="ch" value="${c}"${W.ch[c]?" checked":""}><span>${esc(t("ch_"+(c==="direct"?"direct":c)))}</span></label>`).join("")}</div>`;
  if(i===5) body=`<h2>${esc(t("wz5"))}</h2><p class="muted">${esc(t("wz5hint"))}</p><div class="field"><label class="sr" for="wzUntil">${esc(t("g_period"))}</label><input id="wzUntil" type="date" value="${esc(W.until)}"></div>`;
  if(i===6){
   const prod = (W.product==="new"||S.state==="new") ? (W.newName||"") : (W.product==="dm"?"AI Decision Memory":"MyCast");
   const res = W.result==="a"?t("wz2a"):W.result==="b"?t("wz2b"):W.other;
   const chans = ["tg","li","direct"].filter(c=>W.ch[c]).map(c=>t("ch_"+c)).join(", ");
   const line=(k,v,step)=>`<dt>${esc(t(k))}</dt><dd>${v?esc(v):`<span class="unk">${esc(t("unknown"))}</span>`} <button class="btn ghost" style="min-height:28px;padding:2px 8px" data-act="wizgo:${step}">${esc(t("editLine"))}</button></dd>`;
   body=`<h2>${esc(t("wz6"))}</h2><p class="muted">${esc(t("wz6hint"))}</p><dl class="kv summary">${line("wz1",prod,1)}${line("g_outcome",res,2)}${line("g_audience",aud,3)}${line("g_channel",chans,4)}${line("g_period",W.until,5)}<dt>${esc(t("g_budget"))}</dt><dd>$0</dd></dl>
    <div class="consequence"><b>${esc(t("wz_next"))}</b><p>${esc(t("wz_nextS"))}</p></div>`;
  }
  return `<div class="wiz">${prog}${body}<div class="wizActions"><button class="btn" data-act="wizback"${i===1?" disabled":""}>${esc(t("back"))}</button>${i<N?`<button class="btn pri" data-act="wiznext">${esc(t("cont"))}</button>`:`<button class="btn pri" data-act="wizstart">${esc(t("start"))}</button>`}</div></div>`;
 },
 pro(){
  const blocks=["Control Room","Agent Office","Connections","Content / Promotion","MVP Builder · Projects","Open questions","Owner console","Brand strategy","Mods & skills","Supervisor","Error Center","Worker results"];
  return `<section class="pro"><h2>${esc(t("proTitle"))}</h2><p class="lead">${esc(t("proLead"))}</p><div class="mock" aria-hidden="true">${blocks.map(b=>`<span>${esc(b)}</span>`).join("")}</div>
   <p>${esc(t("proRemember"))}</p><p class="muted">${esc(t("proNote"))}</p><div class="row"><button class="btn pri" data-act="simple">${esc(t("proBack"))}</button></div></section>`;
 }
};

/* ================= behaviour ================= */
let toastTimer=0;
function toast(msg){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3600)}
function go(v){if(!VIEWS.includes(v))v="home";if(location.hash!=="#"+v){location.hash=v}else{S.view=v;render();focusMain()}}
function focusMain(){const h=document.querySelector(".head h1");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}}
function syncWizInputs(){
 const W=S.wiz;
 const r=document.querySelector('input[name="product"]:checked');if(r)W.product=r.value;
 const res=document.querySelector('input[name="result"]:checked');if(res)W.result=res.value;
 const v=id=>{const el=document.getElementById(id);return el?el.value:null};
 if(v("wzName")!==null)W.newName=v("wzName").trim();
 if(v("wzLink")!==null)W.newLink=v("wzLink").trim();
 if(v("wzOther")!==null)W.other=v("wzOther").trim();
 if(v("wzAud")!==null)W.audience=v("wzAud").trim();
 if(v("wzUntil")!==null)W.until=v("wzUntil");
 document.querySelectorAll('input[name="ch"]').forEach(c=>W.ch[c.value]=c.checked);
}
function setMode(m){S.mode=m;store("factoryos_home_view",m);toast(t("remembered",{v:t(m==="pro"?"pro":"simple")}))}

document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");
 if(g){if(g.dataset.go==="wizard"){S.wiz.step=g.dataset.quick?6:1;if(g.dataset.prod)S.wiz.product=g.dataset.prod;else if(S.state==="new")S.wiz.product="new"}go(g.dataset.go);return}
 const b=e.target.closest("[data-act]");if(!b)return;
 const [a,arg]=b.dataset.act.split(/:(.*)/s);
 if(a==="go"){go(arg);return}
 if(a==="pro"){setMode("pro");go("pro");return}
 if(a==="simple"){setMode("simple");go("home");return}
 if(a==="approveNext"){S.later.next=true;toast(t("nextApproved"));render();return}
 if(a==="later"){S.later[arg]=true;toast(t("laterDone"));render();return}
 if(a==="state"){S.state=arg;S.decision=null;S.later={};render();return}
 if(a==="retry"){S.state="working";S.later={};toast(t("st_work")+" · "+t("lw_claude"));render();return}
 if(a==="toast"){toast(arg==="linkLearn"?t("linkLearn"):t("proNote"));return}
 if(a==="decide"){S.decision=arg;render();focusMain();return}
 if(a==="reject"){const r=$("#reason");if(!r||!r.value.trim()){toast(t("needReason"));if(r)r.focus();return}S.decision="rejected";render();return}
 if(a==="undo"){S.decision=null;render();return}
 if(a==="side"){S.side=arg;render();return}
 if(a==="wizback"){syncWizInputs();S.wiz.step=Math.max(1,S.wiz.step-1);render();focusMain();return}
 if(a==="wiznext"){syncWizInputs();S.wiz.step=Math.min(6,S.wiz.step+1);render();focusMain();return}
 if(a==="wizgo"){syncWizInputs();S.wiz.step=+arg;render();focusMain();return}
 if(a==="wizstart"){syncWizInputs();if(S.state==="new"||S.state==="empty")S.state="working";toast(t("started"));go("goal-mycast");return}
});
document.addEventListener("change",e=>{
 if(e.target.id==="stateSel"){S.state=e.target.value;S.decision=null;S.later={};render();return}
 if(e.target.id==="frameChk"){S.framed=e.target.checked;render();return}
 if(e.target.id==="diffChk"){S.diff=e.target.checked;render();return}
 if(e.target.name==="product"||e.target.name==="result"){syncWizInputs();render()}
});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{S.lang=b.dataset.lang;store("factoryos_lang",S.lang);render()}));
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);S.view=VIEWS.includes(v)?v:"home";render();focusMain()});

let lastNarrow=null;
if(window.ResizeObserver){new ResizeObserver(()=>{const app=$("#app");const n=app.clientWidth<760;if(n!==lastNarrow)render()}).observe($("#app"))}else{window.addEventListener("resize",render)}

/* boot: language from ?lang=, saved choice, or the browser; view from the hash or the remembered mode */
(function boot(){
 let q=null;try{q=new URLSearchParams(location.search).get("lang")}catch(e){}
 const nav=(navigator.language||"").slice(0,2);
 S.lang=["en","uk","ru"].includes(q)?q:(["en","uk","ru"].includes(load("factoryos_lang"))?load("factoryos_lang"):(nav==="en"?"en":nav==="ru"?"ru":"uk"));
 let st=null;try{st=new URLSearchParams(location.search).get("state")}catch(e){}
 if(STATES.includes(st))S.state=st;
 S.mode=load("factoryos_home_view")==="pro"?"pro":"simple";
 const h=location.hash.slice(1);
 S.view=VIEWS.includes(h)?h:(S.mode==="pro"?"pro":"home");
 render();
})();
</script>
</body>
</html>
