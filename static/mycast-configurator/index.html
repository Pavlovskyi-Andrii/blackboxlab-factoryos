<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>MyCast Configurator</title>
<!-- #261 MVP Factory pilot. Static prototype: no backend, no network calls, no schedule, no delivery, no AI episode. -->
<style>
:root{
  /* Midnight canvas, aurora light (violet / cyan / teal) and one warm coral accent for "your choice". */
  --bg:#070a16;--bg2:#0b1024;--glass:rgba(20,27,54,.58);--glass2:rgba(28,37,72,.62);--edge:rgba(160,180,255,.14);--edge2:rgba(160,180,255,.26);
  --ink:#eef1ff;--mute:#a3abc9;--dim:#717a9c;
  --violet:#8b7bff;--cyan:#4fe3ff;--teal:#3ee6c1;--coral:#ff7a6b;--coral-ink:#2a0d08;--warn:#ffd27a;--bad:#ff8f86;--ok:#79e8b0;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;--px:0;--py:0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}  /* a class with display:grid/flex must never override hidden */
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
body{overflow-x:hidden;padding-bottom:84px}
@media (min-width:960px){body{padding-bottom:0}}

/* Aurora: three soft light fields that drift slowly and lean toward the pointer. */
.aurora{position:fixed;inset:-20vmax;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.aurora .a1{width:60vmax;height:60vmax;left:5vmax;top:-5vmax;background:radial-gradient(circle at 40% 40%,#5b43ff 0,rgba(91,67,255,0) 65%);animation:drift1 34s ease-in-out infinite alternate;translate:calc(var(--px)*-26px) calc(var(--py)*-20px)}
.aurora .a2{width:55vmax;height:55vmax;right:0;top:10vmax;background:radial-gradient(circle at 60% 40%,#00c8ff 0,rgba(0,200,255,0) 62%);opacity:.38;animation:drift2 40s ease-in-out infinite alternate;translate:calc(var(--px)*34px) calc(var(--py)*24px)}
.aurora .a3{width:50vmax;height:50vmax;left:30vmax;bottom:-10vmax;background:radial-gradient(circle,#11d6a8 0,rgba(17,214,168,0) 60%);opacity:.26;animation:drift3 46s ease-in-out infinite alternate;translate:calc(var(--px)*-18px) calc(var(--py)*30px)}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-10vmax,4vmax) scale(.94)}}
@keyframes drift3{to{transform:translate(-6vmax,-8vmax) scale(1.1)}}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,10,22,0) 0,rgba(7,10,22,.65) 70%,var(--bg) 100%)}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:grid;gap:28px;min-width:0}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:700 12px/1.2 var(--mono);letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.brand svg{flex:none}
.topR{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.langs{display:flex;gap:4px;padding:3px;border:1px solid var(--edge);border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.langs button{font:600 12px var(--mono);background:transparent;color:var(--mute);border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--bg);background:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 12px/1 var(--mono);letter-spacing:.05em;padding:8px 12px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.pill.state-draft{color:var(--mute)}.pill.state-preview_ready{color:var(--cyan)}.pill.state-reviewed{color:var(--warn)}.pill.state-approved{color:var(--ok)}

/* Hero */
.hero{display:grid;gap:24px;align-items:center;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;min-height:min(560px,78vh)}}
.eyebrow{font:700 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font:700 clamp(34px,6.2vw,64px)/1.02 var(--display);margin:10px 0 14px;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;background:linear-gradient(100deg,#c9c2ff 0,var(--cyan) 45%,var(--teal) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:#c8cee8;max-width:58ch;margin:0;font-size:17px}
.ctaRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cta{font:700 15px var(--body);background:linear-gradient(135deg,#ff9a7b,var(--coral));color:var(--coral-ink);border:0;border-radius:999px;padding:13px 22px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(255,122,107,.7);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-1px);box-shadow:0 14px 34px -10px rgba(255,122,107,.85)}
.ghost{font:600 15px var(--body);background:var(--glass);color:var(--ink);border:1px solid var(--edge2);border-radius:999px;padding:12px 20px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.simNote{margin-top:14px;font:12.5px/1.45 var(--mono);color:var(--dim)}

.stage{position:relative;border-radius:28px;border:1px solid var(--edge);background:radial-gradient(120% 90% at 30% 20%,rgba(91,67,255,.22),rgba(7,10,22,.2) 60%),var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px;min-width:0;box-shadow:0 30px 80px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06)}
.stage svg{display:block;width:100%;height:auto}
.stage .lbl{font:600 11px var(--mono);letter-spacing:.08em;fill:#d6dcff;text-transform:uppercase}
.stage .sub{font:10px var(--mono);fill:#8f98c2}
.stage .node{fill:rgba(12,16,36,.9);stroke:url(#gEdge);stroke-width:1.4}
.stage .halo{fill:none;stroke:rgba(79,227,255,.25);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
.stage .halo.d2{animation-delay:.8s}.stage .halo.d3{animation-delay:1.6s}.stage .halo.d4{animation-delay:2.4s}
@keyframes halo{from{transform:scale(.7);opacity:.9}to{transform:scale(1.7);opacity:0}}
.stage .simTag{position:absolute;left:18px;top:16px;font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--warn);border:1px solid rgba(255,210,122,.35);background:rgba(40,30,10,.55);padding:5px 9px;border-radius:999px;text-transform:uppercase}

/* Three builders */
.sectionHead{display:grid;gap:6px;max-width:70ch}
.sectionHead h2{font:700 clamp(24px,3.6vw,34px)/1.1 var(--display);margin:0}
.sectionHead p{margin:0;color:var(--mute)}
.builders{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));counter-reset:b}
.builder{position:relative;padding:20px;border-radius:var(--r);border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;transition:transform .25s,border-color .25s}
.builder:hover{transform:translateY(-2px);border-color:var(--edge2)}
.builder::after{content:"";position:absolute;inset:auto -30% -60% auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(139,123,255,.35)),transparent 70%);pointer-events:none}
.builder .n{font:700 12px var(--mono);color:var(--dim);letter-spacing:.14em}
.builder h3{margin:8px 0 6px;font:700 19px var(--body)}
.builder p{margin:0 0 12px;color:var(--mute);font-size:14.5px}
.builder a{color:var(--cyan);font:600 13px var(--mono);text-decoration:none;border-bottom:1px solid rgba(79,227,255,.35)}
.builder .done{display:inline-flex;gap:6px;align-items:center;margin-left:8px;font:600 11px var(--mono);color:var(--ok)}

/* Configurator layout: steps + sticky "podcast DNA" */
.layout{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 340px}}
.steps{display:grid;gap:18px;min-width:0}
section.step{scroll-margin-top:16px;background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
section.step>h2{margin:0;font:700 22px var(--display);display:flex;gap:12px;align-items:baseline}
section.step>h2 small{font:700 12px var(--mono);color:var(--cyan);letter-spacing:.12em}
.hint{color:var(--mute);font-size:14px;margin:0}
input[type=search],input[type=text],input[type=url],input[type=time],select{font:15px var(--body);background:rgba(9,13,30,.75);color:var(--ink);border:1px solid var(--edge2);border-radius:12px;padding:10px 12px;min-width:0;max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,227,255,.15);outline:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.field{display:grid;gap:5px;min-width:0}.field>label,.field>.lab{font-size:13px;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:600 14px var(--body);border-radius:12px;padding:10px 15px;border:1px solid var(--edge2);background:rgba(28,37,72,.7);color:var(--ink);cursor:pointer;transition:background .2s,transform .15s}
.btn:hover:not([disabled]){background:rgba(44,56,104,.85)}
.btn:active:not([disabled]){transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#ff9a7b,var(--coral));color:var(--coral-ink);border-color:transparent}
.btn[disabled]{opacity:.42;cursor:not-allowed}

details.cat{border:1px solid var(--edge);border-radius:14px;background:rgba(10,14,32,.55);transition:border-color .2s}
details.cat[open]{border-color:var(--edge2)}
details.cat>summary{cursor:pointer;padding:13px 15px;font-weight:700;display:flex;align-items:center;gap:10px;list-style:none}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
details.cat>summary .count{margin-left:auto;font:700 12px var(--mono);color:var(--bg);background:var(--c);border-radius:999px;padding:2px 8px}
details.cat>summary .count:empty{display:none}
details.cat>summary .chev{color:var(--dim);transition:transform .25s}
details.cat[open]>summary .chev{transform:rotate(90deg)}
.groups{padding:0 15px 14px;display:grid;gap:12px}
.group h4{margin:4px 0 8px;font:600 12px var(--mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topic{position:relative;display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--edge2);border-radius:999px;background:rgba(20,27,54,.7);cursor:pointer;font-size:14px;transition:border-color .2s,background .2s,transform .15s;user-select:none}
.topic:hover{transform:translateY(-1px)}
.topic input{position:absolute;opacity:0;pointer-events:none}
.topic .tick{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;transition:all .2s;flex:none}
.topic .tick::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);transform:scale(0);transition:transform .2s}
.topic:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,rgba(20,27,54,.8))}
.topic:has(input:checked) .tick{border-color:var(--c)}
.topic:has(input:checked) .tick::after{transform:scale(1)}
.topic:has(input:focus-visible){outline:2px solid var(--cyan);outline-offset:2px}
.scopes{display:grid;gap:8px}
.scopeRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:12px;background:rgba(10,14,32,.5);border:1px solid var(--edge)}
.scopeRow b{min-width:0;flex:1 1 160px;font-weight:600}
.empty{color:var(--dim);font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 11px;border-radius:999px;border:1px solid var(--edge2);background:rgba(20,27,54,.7);font-size:14px;max-width:100%}
.chip small{font:600 10px var(--mono);color:var(--cyan);text-transform:uppercase;letter-spacing:.06em}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip button{border:0;background:rgba(255,255,255,.08);color:var(--ink);width:24px;height:24px;border-radius:50%;cursor:pointer;flex:none}

.chan{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chan label{position:relative;display:grid;gap:4px;padding:14px;border:1px solid var(--edge);border-radius:14px;background:rgba(10,14,32,.55);cursor:pointer;transition:border-color .2s}
.chan label:has(input:checked){border-color:var(--coral);background:rgba(60,24,24,.35)}
.chan label.off{cursor:not-allowed;opacity:.6}
.chan .nm{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.chan .tags{display:flex;flex-wrap:wrap;gap:6px}
.chan input{accent-color:var(--coral)}
.chan .why{font-size:12.5px;color:var(--mute)}
.tag{font:600 10.5px var(--mono);padding:3px 7px;border-radius:999px;border:1px solid var(--edge2);color:var(--mute);white-space:nowrap}
.tag.no{color:var(--bad);border-color:rgba(255,143,134,.35)}.tag.yes{color:var(--ok);border-color:rgba(121,232,176,.4)}.tag.plan{color:var(--warn);border-color:rgba(255,210,122,.35)}.tag.pri{color:var(--coral);border-color:rgba(255,122,107,.45)}

/* Own entry in each row, social platforms, quick-pick people, weekday dots, share. */
.ownRow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.ownRow input{flex:1 1 180px;padding:7px 11px;border-radius:999px;font-size:14px;border-style:dashed}
.ownRow .chip{border-color:var(--c)}
.platforms{display:flex;flex-wrap:wrap;gap:8px}
.plat{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;border:1px solid var(--edge2);background:rgba(20,27,54,.7);color:var(--ink);font:600 13.5px var(--body);cursor:pointer}
.plat svg{width:18px;height:18px;flex:none}
.plat[aria-checked="true"]{border-color:var(--cyan);background:rgba(79,227,255,.12)}
.people{display:flex;flex-wrap:wrap;gap:10px}
.person{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--edge2);background:rgba(20,27,54,.7);color:var(--ink);font:600 13.5px var(--body);cursor:pointer}
.person .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);color:#0b1024;background:linear-gradient(135deg,var(--cyan),var(--violet))}
.person .pl{font-size:16px;line-height:1;color:var(--cyan)}
.person[aria-pressed="true"]{border-color:var(--ok);background:rgba(121,232,176,.12)}
.person[aria-pressed="true"] .pl{color:var(--ok)}
.chip .ic svg{width:14px;height:14px;display:block}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--edge2);background:rgba(20,27,54,.7);color:var(--mute);font:700 13px var(--mono);cursor:pointer;transition:all .2s}
.day[aria-pressed="true"]{background:linear-gradient(135deg,#ff9a7b,var(--coral));color:var(--coral-ink);border-color:transparent}
.msg{font-size:13.5px;color:var(--bad);min-height:0}
.msg.ok{color:var(--ok)}
textarea{font:13px var(--mono);background:rgba(9,13,30,.75);color:var(--ink);border:1px solid var(--edge2);border-radius:12px;padding:10px;width:100%;resize:vertical}
details.jsonBox>summary{cursor:pointer;color:var(--mute);font-size:14px;margin-bottom:8px}
.qrBox{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qrBox[hidden]{display:none}
.qr{width:min(320px,100%);aspect-ratio:1;background:#fff;border-radius:18px;padding:12px}
.qr svg{display:block;width:100%;height:100%}
.qrSide{flex:1 1 200px;display:grid;gap:10px}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;border:1px solid rgba(79,227,255,.45);background:rgba(10,30,50,.75)}
.banner[hidden]{display:none}
/* Player + waveform: bars move only while the browser is really speaking. */
.player{display:grid;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--edge2);background:linear-gradient(135deg,rgba(91,67,255,.18),rgba(0,200,255,.08)),rgba(10,14,32,.6)}
.wave{display:flex;align-items:center;gap:3px;height:54px}
.wave i{flex:1;min-width:2px;border-radius:3px;height:calc(var(--h)*1%);background:linear-gradient(180deg,var(--cyan),var(--violet));opacity:.35;transform-origin:center;transition:opacity .3s}
.player.playing .wave i{opacity:1;animation:bar 1.1s ease-in-out infinite;animation-delay:calc(var(--i)*-73ms)}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.status{font-size:14px;padding:11px 13px;border-radius:12px;border:1px solid var(--edge);background:rgba(10,14,32,.55)}
.status.bad{color:var(--bad);border-color:rgba(255,143,134,.35)}.status.ok{color:var(--ok);border-color:rgba(121,232,176,.4)}.status.info{color:var(--cyan);border-color:rgba(79,227,255,.35)}
.errors{margin:0;padding-left:20px;color:var(--bad);font-size:14px}
.errors:empty{display:none}
.confirm{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.confirm input{width:20px;height:20px;accent-color:var(--coral);margin-top:2px;flex:none}
pre{margin:0;background:rgba(4,6,14,.85);border:1px solid var(--edge);border-radius:12px;padding:12px;font:12.5px/1.5 var(--mono);color:#cfd6f4;overflow:auto;max-height:340px}

/* Podcast DNA */
.dna{position:sticky;top:16px;display:grid;gap:14px;padding:18px;border-radius:22px;border:1px solid var(--edge2);background:linear-gradient(160deg,rgba(91,67,255,.2),rgba(7,10,22,.1) 55%),var(--glass2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 70px -40px rgba(0,0,0,.95)}
.dna h3{margin:0;font:700 12px var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.cover{border-radius:16px;overflow:hidden;aspect-ratio:1;border:1px solid var(--edge2);background:#0b1024}
.cover svg{display:block;width:100%;height:100%}
.counter{display:flex;align-items:baseline;gap:8px}
.counter b{font:700 40px/1 var(--display);transition:transform .3s}
.counter b.bump{transform:scale(1.15)}
.counter span{color:var(--mute);font-size:14px}
.mix{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)}
.mix i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.facts{display:grid;gap:6px;margin:0;font-size:13.5px}
.facts div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--edge);padding-bottom:6px}
.facts dt{color:var(--mute)}.facts dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.progress{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.progress li{display:flex;gap:8px;align-items:center;color:var(--mute)}
.progress li::before{content:"";width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);flex:none}
.progress li.on{color:var(--ink)}
.progress li.on::before{border-color:var(--ok);background:radial-gradient(circle,var(--ok) 0 4px,transparent 5px)}

/* FAQ */
.faq{display:grid;gap:10px}
.faq details{border:1px solid var(--edge);border-radius:14px;background:var(--glass);padding:0 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.faq summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq p{margin:0 0 14px;color:var(--mute)}
footer{color:var(--dim);font-size:13px;text-align:center}

/* Mobile action bar */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:rgba(9,12,28,.86);border-top:1px solid var(--edge2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.mbar .sum{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.mbar .sum b{font-size:15px}
.mbar .sum span{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:960px){.mbar{display:none}}

:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* Calm mode: reduced motion or a low-power device. Everything still works; nothing drifts or pulses. */
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.calm .aurora i,.calm .stage .halo,.calm .player.playing .wave i{animation:none!important}
.calm .aurora i{translate:none!important}
.calm .player.playing .wave i{opacity:1}
.lowfx .aurora i{filter:blur(40px)}
.lowfx .stage,.lowfx section.step,.lowfx .builder,.lowfx .dna,.lowfx .faq details,.lowfx .mbar,.lowfx .langs{backdrop-filter:none;-webkit-backdrop-filter:none}
</style>
</head>

  <header class="top">

  <div class="layout" id="configurator">

        </div>
        <div id="taxonomy" class="scopes"></div>
      </section>

      <section class="step" id="stepGeo" aria-labelledby="h2s">

        <div class="btns"><button class="btn primary" type="button" id="approveBtn" data-t="approve" disabled></button></div>

          <button class="btn" type="button" id="shareNative" data-t="share_native" hidden></button>
          <button class="btn" type="button" id="showQr" data-t="share_qr"></button>
          <button class="btn" type="button" id="copyJson" data-t="share_json"></button>
          <button class="btn" type="button" id="importJsonBtn" data-t="share_import"></button>

        <div class="qrBox" id="qrBox" hidden>
          <div class="qr" id="qr" role="img"></div>
          <div class="qrSide"><p class="hint" data-t="qr_hint"></p><div class="btns"><button class="btn" type="button" id="qrPng" data-t="qr_png"></button></div></div>

        </div>
        <details class="jsonBox"><summary data-t="json_h"></summary><p class="hint" data-t="json_hint"></p><pre id="json" tabindex="0"></pre></details>
      </section>
    </div>

    <aside class="dna" aria-labelledby="dnaTitle">

      <details><summary data-t="q4"></summary><p data-t="a4"></p></details>
    </div>
  </section>
  <footer data-t="foot"></footer>
</div>

const COLORS = { sports:'#ff7a6b', tech:'#4fe3ff', news:'#a78bfa', business:'#fbbf24', health:'#34d399', culture:'#f472b6', travel:'#60a5fa', science:'#818cf8', auto:'#fb923c', hobbies:'#a3e635' };
const $ = s => document.querySelector(s);
const KEY = 'mycast-configurator-draft-v1';
const mq = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
const calm = mq('(prefers-reduced-motion: reduce)');
const lowfx = (navigator.connection && navigator.connection.saveData) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
if (calm) document.documentElement.classList.add('calm');
if (lowfx) document.documentElement.classList.add('lowfx', 'calm');
let lang = 'uk', profile = MyCast.newProfile(), openCats = new Set(['sports', 'tech']), lastNote = '', lastCount = 0, platform = 'x', sharedProfile = null;
const speech = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved && saved.version === 1) profile = MyCast.migrate(saved);  // older drafts: watch list, weekly schedule
} catch (e) {}
try { const l = localStorage.getItem(KEY + ':lang'); if (['uk','ru','en'].includes(l)) lang = l; } catch (e) {}
// A share link carries #p=<code>. It is offered, never applied silently over the visitor's own draft.
try { const m = /[#&]p=([A-Za-z0-9_-]+)/.exec(location.hash); if (m) sharedProfile = MyCast.decodeShare(m[1]); } catch (e) { sharedProfile = null; }

function save() { try { localStorage.setItem(KEY, JSON.stringify(profile)); localStorage.setItem(KEY + ':lang', lang); } catch (e) {} }
function t() { return T[lang]; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function catOf(id) { return id.split('.')[0]; }
function catLabel(id) { const c = MyCast.TAXONOMY.find(x => x.id === id); return c ? c.label[lang] : id; }

function setPlaying(on) { $('#player').classList.toggle('playing', !!on); $('#stopBtn').disabled = !on; }

function change(next) {
  const wasAhead = profile.state !== 'draft';
  profile = next; lastNote = wasAhead && next.state === 'draft' ? t().ap.invalidated : '';
  if (speech) { try { speechSynthesis.cancel(); } catch (e) {} }
  setPlaying(false);
  save(); render();
  if (!$('#qrBox').hidden) showQr();
}

function renderTaxonomy() {
  const q = $('#search').value, hits = new Set(MyCast.search(q, lang));
  $('#taxonomy').innerHTML = MyCast.TAXONOMY.map(cat => {
    const groups = cat.groups.map(g => {
      const topics = g.topics.map(([tid]) => `${cat.id}.${g.id}.${tid}`).filter(id => hits.has(id));
      if (!topics.length) return '';
      const gk = `${cat.id}.${g.id}`, own = (profile.custom || {})[gk] || [], x = t();
      const ownRow = `<div class="ownRow">` + own.map((v, i) => `<span class="chip" style="--c:${COLORS[cat.id]}"><span>${esc(v)}</span><button type="button" data-own-del="${gk}" data-i="${i}" aria-label="${esc(x.own_remove + ': ' + v)}">×</button></span>`).join('') +
        (own.length < MyCast.MAX_CUSTOM_PER_GROUP ? `<input type="text" data-own="${gk}" maxlength="40" placeholder="${esc(x.own_ph)}" aria-label="${esc(x.own_add + ' · ' + g.label[lang])}" enterkeyhint="done">` : '') + `</div>`;
      return `<div class="group"><h4>${esc(g.label[lang])}</h4><div class="topics">` + topics.map(id =>
        `<label class="topic"><input type="checkbox" data-topic="${id}" ${profile.topics[id] ? 'checked' : ''}><span class="tick" aria-hidden="true"></span>${esc(MyCast.topicLabel(id, lang))}</label>`).join('') + '</div>' + ownRow + '</div>';
    }).join('');
    if (!groups) return '';
    const n = Object.keys(profile.topics).filter(id => catOf(id) === cat.id).length +
      Object.keys(profile.custom || {}).filter(g => g.startsWith(cat.id + '.')).reduce((k, g) => k + profile.custom[g].length, 0);
    const open = q.trim() ? true : openCats.has(cat.id);
    return `<details class="cat" data-cat="${cat.id}" style="--c:${COLORS[cat.id]}" ${open ? 'open' : ''}><summary><span class="dot" aria-hidden="true"></span><span>${esc(cat.label[lang])}</span><span class="count">${n || ''}</span><span class="chev" aria-hidden="true">›</span></summary><div class="groups">${groups}</div></details>`;
  }).join('');
}

function renderGeo() {
  const x = t(), geo = Object.keys(profile.topics).filter(id => MyCast.INDEX[id] && MyCast.INDEX[id].geo);
  $('#scopeBox').innerHTML = geo.length ? geo.map(id => { const s = profile.topics[id].scope || { kind: 'world' };
    return `<div class="scopeRow"><b>${esc(MyCast.topicLabel(id, lang))}</b><select data-scope="${id}" aria-label="${esc(MyCast.topicLabel(id, lang))}">` +
      MyCast.SCOPES.map(k => `<option value="${k}" ${s.kind === k ? 'selected' : ''}>${esc(x.scope[k])}</option>`).join('') + '</select>' +
      (s.kind === 'custom' ? `<input type="text" data-place="${id}" maxlength="60" value="${esc(s.place || '')}" placeholder="${esc(x.place)}" aria-label="${esc(x.place)}">` : '') + '</div>'; }).join('')
    : `<p class="empty">${esc(x.geo_empty)}</p>`;
  $('#platforms').innerHTML = Object.keys(MyCast.PLATFORMS).map(pl =>
    `<button type="button" class="plat" role="radio" aria-checked="${pl === platform}" data-plat="${pl}">${ICONS[pl]}${esc(x.plat[pl])}</button>`).join('');
  $('#followLabel').textContent = `${x.platL} · ${x.plat[platform]}`;
  $('#followValue').placeholder = x.platPh[platform];
  const follows = profile.follows || [];
  const has = f => follows.some(y => y.platform === f.platform && y.value.toLowerCase() === f.value.toLowerCase());
  $('#people').innerHTML = MyCast.SUGGESTED_FOLLOWS.map(f => { const on = has(f), name = f.name[lang] || f.name.en;
    const ini = name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    return `<button type="button" class="person" aria-pressed="${on}" data-person="${f.id}" title="${esc(f.value)}"><span class="av" aria-hidden="true">${esc(ini)}</span>${esc(name)}<span class="pl" aria-hidden="true">${on ? '✓' : '+'}</span></button>`; }).join('');
  $('#follows').innerHTML = follows.length ? follows.map((f, i) =>
    `<span class="chip"><span class="ic" aria-hidden="true">${ICONS[f.platform] || ICONS.web}</span><span>${esc(f.value)}</span><button type="button" data-unfollow="${i}" aria-label="${esc(x.soc_remove + ': ' + f.value)}">×</button></span>`).join('')
    : `<p class="empty">${esc(x.soc_empty)}</p>`;
}

function fillSelect(el, values, labelFn, current) { el.innerHTML = values.map(v => `<option value="${v}" ${String(v) === String(current) ? 'selected' : ''}>${esc(labelFn(v))}</option>`).join(''); }

/* Deterministic cover: one ring per chosen topic, coloured by its category. No images, no network. */
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function coverSVG() {
  const ids = Object.keys(profile.topics).sort(), cats = [...new Set(ids.map(catOf))];
  const c1 = COLORS[cats[0]] || '#5b43ff', c2 = COLORS[cats[1]] || '#00c8ff';
  const rings = ids.slice(0, 12).map((id, i) => {
    const h = hash(id), r = 34 + i * 7.5, len = 0.35 + (h % 55) / 100, start = (h >> 8) % 360, circ = 2 * Math.PI * r;
    return `<circle cx="120" cy="120" r="${r.toFixed(1)}" fill="none" stroke="${COLORS[catOf(id)]}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${(circ * len).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(${start} 120 120)" opacity=".92"/>`;
  }).join('');
  const label = cats.slice(0, 2).map(catLabel).join(' · ');
  return `<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="cv" cx="35%" cy="30%"><stop offset="0" stop-color="${c1}" stop-opacity=".55"/><stop offset=".6" stop-color="${c2}" stop-opacity=".18"/><stop offset="1" stop-color="#0b1024"/></radialGradient></defs>` +
    `<rect width="240" height="240" fill="#0b1024"/><rect width="240" height="240" fill="url(#cv)"/>${rings || '<circle cx="120" cy="120" r="60" fill="none" stroke="#2a3366" stroke-width="2" stroke-dasharray="4 8"/>'}` +
    `<circle cx="120" cy="120" r="22" fill="#070a16"/><circle cx="120" cy="120" r="5" fill="#eef1ff"/>` +
    `<text x="16" y="28" fill="#eef1ff" font-family="Georgia,serif" font-size="20" font-weight="700">MyCast</text>` +
    `<text x="16" y="224" fill="#c8cee8" font-family="ui-monospace,Menlo,monospace" font-size="10">${esc(label || '— — —')}</text></svg>`;
}

/* The hero simulation picks up the colours and names of what you chose. */
function renderStage() {
  const ids = Object.keys(profile.topics);
  const cols = ids.length ? ids.map(id => COLORS[catOf(id)]) : Object.values(COLORS);
  const n = 9, dur = 9;
  $('#particles').innerHTML = Array.from({ length: n }, (_, i) =>
    `<circle r="${(3 + (i % 3)).toFixed(1)}" fill="${cols[i % cols.length]}"><animateMotion dur="${dur}s" begin="${(-i * dur / n).toFixed(2)}s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion></circle>`).join('');
  const names = (ids.length ? ids : ['sports.boxing.ua_boxers', 'tech.ai.claude', 'news.local.events']).slice(0, 3);
  $('#chipCloud').innerHTML = names.map((id, i) => { const label = MyCast.topicLabel(id, lang).slice(0, 18), w = label.length * 6.6 + 18, y = 238 + i * 26;
    return `<g transform="translate(14 ${y})"><rect width="${w.toFixed(0)}" height="20" rx="10" fill="rgba(12,16,36,.85)" stroke="${COLORS[catOf(id)]}" stroke-opacity=".7"/><text x="9" y="14" fill="#dfe4ff">${esc(label)}</text></g>`; }).join('');
  const svg = $('#stage svg');
  if (calm && svg.pauseAnimations) svg.pauseAnimations();
}

function renderDNA(errors) {
  const x = t(), ids = Object.keys(profile.topics), n = MyCast.selectionCount(profile);
  const countEl = $('#dnaCount'); countEl.textContent = n;
  if (n !== lastCount && !calm) { countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump'); setTimeout(() => countEl.classList.remove('bump'), 300); }
  lastCount = n;
  $('#cover').innerHTML = coverSVG(); $('#cover').setAttribute('aria-label', x.dna_h);
  const byCat = {}; ids.forEach(id => { byCat[catOf(id)] = (byCat[catOf(id)] || 0) + 1; });
  const cats = Object.keys(byCat);
  Object.keys(profile.custom || {}).forEach(g => { const c = g.split('.')[0]; byCat[c] = (byCat[c] || 0) + profile.custom[g].length; });
  const cats2 = Object.keys(byCat); cats.splice(0, cats.length, ...cats2);
  $('#mix').innerHTML = cats.map(c => `<i style="width:${(100 * byCat[c] / Math.max(1, n)).toFixed(1)}%;background:${COLORS[c]}"></i>`).join('');
  $('#legend').innerHTML = cats.map(c => `<span style="--c:${COLORS[c]}">${esc(catLabel(c))} · ${byCat[c]}</span>`).join('');
  const geo = { ukraine: 0, world: 0, custom: 0 };
  ids.forEach(id => { const s = (profile.topics[id] || {}).scope; if (s) geo[s.kind] = (geo[s.kind] || 0) + 1; });
  const geoText = Object.keys(geo).filter(k => geo[k]).map(k => `${x.scope[k]} ${geo[k]}`).join(' · ') || x.dna_none;
  const sch = profile.schedule, when = `${sch.frequency === 'days' ? (sch.days.map(d => x.days[d]).join(' ') || '—') : x.freqs.daily} · ${sch.time} · ${sch.durationMin} ${x.min}`;
  const watch = (profile.follows || []).map(f => f.value).slice(0, 3).join(', ') || x.dna_none;
  const rows = [[x.dna_geo, geoText], [x.dna_watch, watch], [x.dna_when, when], [x.dna_voice, `${x.modes[profile.voice.mode]} · ${x.langs[profile.voice.language]}`],
    [x.dna_ch, `${x.ch[profile.delivery] || profile.delivery} · ${x.chs[MyCast.channelStatus(profile.delivery, profile.preview).reason || 'ready']}`]];
  $('#dnaFacts').innerHTML = rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
  const has = f => errors.some(e => f.includes(e.field));
  const steps = [['topics', n >= MyCast.MIN_TOPICS && !has(['topics'])], ['geo', n >= MyCast.MIN_TOPICS && !has(['scope', 'follows', 'custom', 'freeText', 'customSources'])],
    ['voice', !has(['timezone', 'time', 'frequency', 'days', 'duration', 'language', 'voice', 'delivery'])], ['preview', profile.state !== 'draft'], ['approved', profile.state === 'approved']];
  $('#progress').innerHTML = steps.map(([k, on]) => `<li class="${on ? 'on' : ''}">${esc(x.pg[k])}</li>`).join('');
  $('#mbarCount').textContent = `${n} ${x.mbar_n}`;
  $('#mbarState').textContent = `${x.state[profile.state]} · ${geoText}`;
  $('#mbarGo').textContent = n >= MyCast.MIN_TOPICS ? x.mbar_go : x.mbar_pick;
  $('#mbarGo').dataset.ready = n >= MyCast.MIN_TOPICS ? '1' : '';
}

function render() {
  const x = t(); document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = x[el.dataset.t] || ''; });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('#statePill').className = 'pill state-' + profile.state; $('#statePill').textContent = x.state[profile.state];
  renderTaxonomy(); renderGeo();
  $('#freeText').value = profile.freeText || ''; $('#rss').value = (profile.customSources || [])[0] || '';
  const zones = ['Europe/Kyiv', 'Europe/Warsaw', 'Europe/Berlin', 'Europe/London', 'America/New_York', 'Asia/Dubai'];
  if (!zones.includes(profile.schedule.timezone)) zones.push(profile.schedule.timezone);
  fillSelect($('#tz'), zones, v => v.replace('_', ' '), profile.schedule.timezone);
  $('#time').value = profile.schedule.time;
  fillSelect($('#freq'), MyCast.FREQUENCIES, v => x.freqs[v], profile.schedule.frequency);
  $('#daysField').hidden = profile.schedule.frequency !== 'days';  // daily needs no weekday
  $('#days').innerHTML = MyCast.WEEKDAYS.map(d => `<button type="button" class="day" data-day="${d}" aria-pressed="${(profile.schedule.days || []).includes(d)}">${esc(x.days[d])}</button>`).join('');
  fillSelect($('#dur'), MyCast.DURATIONS, v => v + ' ' + x.min, profile.schedule.durationMin);
  fillSelect($('#mode'), MyCast.VOICES, v => x.modes[v], profile.voice.mode);
  fillSelect($('#vlang'), MyCast.LANGUAGES, v => x.langs[v], profile.voice.language);
  $('#channels').innerHTML = Object.keys(MyCast.CHANNELS).map(ch => { const st = MyCast.channelStatus(ch, profile.preview);
    const tag = st.reason === 'planned' ? 'plan' : st.usable ? 'yes' : 'no';
    return `<label class="${st.selectable ? '' : 'off'}"><span class="nm"><input type="radio" name="channel" value="${ch}" ${profile.delivery === ch ? 'checked' : ''} ${st.selectable ? '' : 'disabled'}> ${esc(x.ch[ch])}</span><span class="tags">` +
      (ch === 'telegram' ? `<span class="tag pri">${esc(x.primary)}</span>` : '') + `<span class="tag ${tag}">${esc(x.chs[st.reason || 'ready'])}</span></span><span class="why">${esc(x.chw[ch])}</span></label>`; }).join('') +
    `<button type="button" class="btn" disabled title="${esc(x.tg_soon)}">${ICONS.telegram.replace('<svg ', '<svg width="16" height="16" style="vertical-align:-3px;margin-right:6px" ')}${esc(x.tg_soon)}</button>`;
  $('#importBanner').hidden = !sharedProfile;
  $('#shareNative').hidden = !navigator.share;
  const errors = MyCast.validate(profile);
  $('#errors').innerHTML = errors.map(e => `<li>${esc(x.err[e.code] || e.code)}</li>`).join('');
  $('#previewBtn').disabled = errors.length > 0;
  const dl = MyCast.channelStatus('download', profile.preview);
  $('#downloadBtn').disabled = !dl.usable; $('#downloadBtn').title = dl.usable ? '' : x.chs[dl.reason];
  const st = $('#previewStatus');
  if (profile.state === 'draft') { st.className = 'status' + (errors.length ? ' bad' : ''); st.textContent = errors.length ? x.pv.invalid : (st.dataset.unavailable ? x.pv.unavailable : x.pv.idle); }
  else if (!$('#player').classList.contains('playing')) { st.className = 'status info'; st.textContent = x.pv.ready; }
  $('#reviewBtn').disabled = profile.state !== 'preview_ready';
  $('#confirm').disabled = profile.state !== 'reviewed'; if (profile.state !== 'reviewed') $('#confirm').checked = false;
  $('#approveBtn').disabled = profile.state !== 'reviewed' || !$('#confirm').checked;
  const ap = $('#approveStatus');
  ap.className = 'status' + (profile.state === 'approved' ? ' ok' : lastNote ? ' bad' : '');
  ap.textContent = profile.state === 'approved' ? x.ap.done : (lastNote || x.ap.need);
  $('#json').textContent = JSON.stringify(MyCast.toJSON(profile), null, 2);
  renderStage(); renderDNA(errors);
}

$('#wave').innerHTML = Array.from({ length: 36 }, (_, i) => `<i style="--i:${i};--h:${(28 + 62 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * .45))).toFixed(0)}"></i>`).join('');

function addFollowFromInput() {
  const input = $('#followValue'), msg = $('#followMsg');
  if (!input.value.trim()) return;
  try { change(MyCast.addFollow(profile, platform, input.value)); msg.textContent = ''; input.value = ''; }
  catch (e) { msg.className = 'msg'; msg.textContent = t().soc_bad; }
  input.focus();
}
function addOwn(input) {
  const gk = input.dataset.own, value = input.value;
  if (!value.trim()) return;
  change(MyCast.addCustom(profile, gk, value));
  const again = document.querySelector(`input[data-own="${gk}"]`);   // keep typing in the same row after re-render
  if (again) again.focus();
}
function shareUrl() {
  // On the site, use the short public address /mycast; elsewhere (local file, preview) keep the current page.
  const onSite = location.pathname.startsWith('/static/mycast-configurator/');
  return (onSite ? location.origin + '/mycast' : location.origin + location.pathname) + '#p=' + MyCast.encodeShare(profile);
}
/* QR code of the share link with the podcast DNA cover in the middle. Level Q tolerates the covered centre. */
function qrSVG(text) {
  const qr = qrcode(0, 'Q'); qr.addData(text, 'Byte'); qr.make();
  const n = qr.getModuleCount(), q = 2, size = n + q * 2, hole = Math.round(n * 0.22), lo = Math.floor((n - hole) / 2), hi = lo + hole;
  let mods = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (!qr.isDark(r, c) || (r >= lo && r < hi && c >= lo && c < hi)) continue;
    mods += `M${c + q} ${r + q}h1v1h-1z`;
  }
  const cover = coverSVG().replace('<svg ', `<svg x="${lo + q}" y="${lo + q}" width="${hole}" height="${hole}" `);
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/>` +
    `<path d="${mods}" fill="#0b1024"/><defs><clipPath id="qc"><circle cx="${lo + q + hole / 2}" cy="${lo + q + hole / 2}" r="${hole / 2}"/></clipPath></defs>` +
    `<circle cx="${lo + q + hole / 2}" cy="${lo + q + hole / 2}" r="${hole / 2 + 0.6}" fill="#fff"/><g clip-path="url(#qc)">${cover}</g></svg>`;
}
function showQr() {
  if (typeof qrcode !== 'function') return;
  $('#qr').innerHTML = qrSVG(shareUrl()); $('#qr').setAttribute('aria-label', t().share_qr);
  $('#qrBox').hidden = false;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
function shareMsg(text, ok) { const m = $('#shareMsg'); m.className = 'msg' + (ok ? ' ok' : ''); m.textContent = text; }

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.topic) { change(MyCast.setTopic(profile, el.dataset.topic, el.checked, { kind: 'world' })); return; }
  if (el.dataset.scope) { change(MyCast.setScope(profile, el.dataset.scope, el.value, '')); return; }
  if (el.dataset.place) { change(MyCast.setScope(profile, el.dataset.place, 'custom', el.value)); return; }
  if (el.name === 'channel') { change(MyCast.update(profile, { delivery: el.value })); return; }
  const sched = { tz: 'timezone', time: 'time', freq: 'frequency', dur: 'durationMin' }[el.id];
  if (sched) { change(MyCast.update(profile, { schedule: { [sched]: sched === 'durationMin' ? Number(el.value) : el.value } })); return; }
  if (el.id === 'mode') change(MyCast.update(profile, { voice: { mode: el.value } }));
  if (el.id === 'vlang') change(MyCast.update(profile, { voice: { language: el.value } }));
  if (el.id === 'freeText') change(MyCast.update(profile, { freeText: el.value }));
  if (el.id === 'rss') change(MyCast.update(profile, { customSources: el.value.trim() ? [el.value.trim()] : [] }));
  if (el.id === 'confirm') render();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-unfollow],[data-own-del],[data-plat],[data-person],[data-day]');
  if (!el) return;
  if (el.dataset.unfollow !== undefined) change(MyCast.removeFollow(profile, Number(el.dataset.unfollow)));
  else if (el.dataset.ownDel) change(MyCast.removeCustom(profile, el.dataset.ownDel, Number(el.dataset.i)));
  else if (el.dataset.plat) { platform = el.dataset.plat; $('#followMsg').textContent = ''; renderGeo(); $('#followValue').focus(); }
  else if (el.dataset.day) change(MyCast.toggleDay(profile, el.dataset.day));
  else if (el.dataset.person) {
    const f = MyCast.SUGGESTED_FOLLOWS.find(x => x.id === el.dataset.person);
    const i = (profile.follows || []).findIndex(y => y.platform === f.platform && y.value.toLowerCase() === f.value.toLowerCase());
    change(i >= 0 ? MyCast.removeFollow(profile, i) : MyCast.addFollow(profile, f.platform, f.value));
  }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && el.dataset.own) { e.preventDefault(); addOwn(el); }
});
document.addEventListener('focusout', e => { const el = e.target; if (el.dataset && el.dataset.own && el.value.trim()) addOwn(el); });
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.cat && !$('#search').value.trim()) { d.open ? openCats.add(d.dataset.cat) : openCats.delete(d.dataset.cat); } }, true);
$('#search').addEventListener('input', renderTaxonomy);
$('#followAdd').addEventListener('click', addFollowFromInput);
$('#followValue').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addFollowFromInput(); } });
$('#shareLink').addEventListener('click', async () => { const ok = await copyText(shareUrl()); shareMsg(ok ? t().share_copied : t().share_copy_fail, ok); if (!ok) { $('#importBox').hidden = false; $('#importJson').value = shareUrl(); } });
$('#shareNative').addEventListener('click', async () => { try { await navigator.share({ title: 'MyCast', text: t().share_h, url: shareUrl() }); } catch (e) { /* the visitor closed the sheet */ } });
$('#showQr').addEventListener('click', showQr);
$('#dnaQr').addEventListener('click', () => { showQr(); go('#stepShare'); });
$('#qrPng').addEventListener('click', () => {
  const svg = $('#qr svg'); if (!svg) return;
  const img = new Image(), url = URL.createObjectURL(new Blob([svg.outerHTML], { type: 'image/svg+xml' }));
  img.onload = () => { const cv = document.createElement('canvas'); cv.width = cv.height = 1024; const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, 1024, 1024); g.drawImage(img, 32, 32, 960, 960); URL.revokeObjectURL(url);
    const a = document.createElement('a'); a.download = 'mycast-qr.png'; a.href = cv.toDataURL('image/png'); a.click(); };
  img.src = url;
});
$('#copyJson').addEventListener('click', async () => { const ok = await copyText(JSON.stringify(MyCast.toJSON(profile), null, 2)); shareMsg(ok ? t().share_copied : t().share_copy_fail, ok); });
$('#importJsonBtn').addEventListener('click', () => { $('#importBox').hidden = !$('#importBox').hidden; if (!$('#importBox').hidden) $('#importJson').focus(); });
$('#importApply').addEventListener('click', () => {
  const raw = $('#importJson').value.trim();
  try {
    const m = /[#&]p=([A-Za-z0-9_-]+)/.exec(raw);
    const next = m ? MyCast.decodeShare(m[1]) : fromJSON(JSON.parse(raw));
    change(next); shareMsg(t().share_done, true); $('#importBox').hidden = true; $('#importJson').value = '';
  } catch (e) { shareMsg(t().share_bad, false); }
});
/* JSON exported by toJSON() back into a draft profile, validated through the same functions as the UI. */
function fromJSON(j) {
  if (!j || j.version !== 1 || !Array.isArray(j.topics)) throw new Error('not a profile');
  let p = MyCast.newProfile();
  for (const tpc of j.topics) if (MyCast.INDEX[tpc.id]) { p = MyCast.setTopic(p, tpc.id, true, tpc.scope || undefined); if (tpc.scope && tpc.scope.kind === 'custom') p = MyCast.setScope(p, tpc.id, 'custom', tpc.scope.place); }
  for (const c of j.custom || []) if (MyCast.GROUPS[c.group]) for (const v of c.items || []) p = MyCast.addCustom(p, c.group, v);
  for (const f of j.follows || []) { try { p = MyCast.addFollow(p, f.platform, f.value); } catch (e) {} }
  const code = MyCast.encodeShare({ ...p, schedule: { ...p.schedule, ...(j.schedule || {}) }, voice: { ...p.voice, ...(j.voice || {}) },
    delivery: (j.delivery || {}).channel || 'telegram', freeText: j.free_text || '' });
  return MyCast.decodeShare(code);   // decode re-validates schedule, voice and channel
}
$('#impUse').addEventListener('click', () => { const next = sharedProfile; sharedProfile = null; history.replaceState(null, '', location.pathname); change(next); });
$('#impKeep').addEventListener('click', () => { sharedProfile = null; history.replaceState(null, '', location.pathname); render(); });
$('#expandAll').addEventListener('click', () => { MyCast.TAXONOMY.forEach(c => openCats.add(c.id)); renderTaxonomy(); });
$('#collapseAll').addEventListener('click', () => { openCats.clear(); renderTaxonomy(); });
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; save(); render(); }));
const go = id => $(id).scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
$('#tryDemo').addEventListener('click', () => go('#stepTopics'));
$('#howBtn').addEventListener('click', () => go('#builders'));
$('#mbarGo').addEventListener('click', () => go($('#mbarGo').dataset.ready ? '#stepListen' : '#stepTopics'));
$('#previewBtn').addEventListener('click', () => {
  const out = MyCast.makePreview(profile, { speechSynthesis: speech });
  if (!out.ok) { $('#previewStatus').dataset.unavailable = out.reason === 'audio_unavailable' ? '1' : ''; profile = out.profile; render(); return; }
  profile = out.profile; lastNote = ''; save(); render();
  const st = $('#previewStatus'), code = { uk: 'uk-UA', ru: 'ru-RU', en: 'en-US' }[profile.voice.language];
  // Two hosts take turns. The browser rarely has two voices for one language, so host B also gets a lower pitch.
  let voices = []; try { voices = speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().startsWith(code.slice(0, 2))); } catch (e) {}
  const lines = profile.preview.lines || [{ host: 'A', text: profile.preview.script }];
  try { speechSynthesis.cancel(); } catch (e) {}
  lines.forEach((line, i) => {
    const u = new SpeechSynthesisUtterance(line.text); u.lang = code;
    if (line.host === 'B') { if (voices[1]) u.voice = voices[1]; u.pitch = 0.8; } else if (voices[0]) u.voice = voices[0];
    // The waveform moves only between the engine's real start and end events.
    u.onstart = () => { setPlaying(true); st.className = 'status info'; st.textContent = t().pv.playing; };
    u.onend = () => { if (i === lines.length - 1) { setPlaying(false); st.textContent = t().pv.ready; } };
    u.onerror = () => { setPlaying(false); st.textContent = t().pv.stopped; };
    try { speechSynthesis.speak(u); } catch (err) { setPlaying(false); st.textContent = t().pv.stopped; }  // no audio was played
  });
});
$('#stopBtn').addEventListener('click', () => { if (speech) { try { speechSynthesis.cancel(); } catch (e) {} } setPlaying(false); $('#previewStatus').textContent = t().pv.stopped; });
$('#reviewBtn').addEventListener('click', () => { profile = MyCast.markReviewed(profile); save(); render(); });
$('#approveBtn').addEventListener('click', () => { if (!$('#confirm').checked) return; profile = MyCast.approve(profile, true); save(); render(); });

/* Gentle pointer parallax on the aurora (fine pointers only, never in calm mode). */
if (!calm && mq('(pointer: fine)')) {
  let raf = 0, px = 0, py = 0;
  window.addEventListener('pointermove', e => { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; document.documentElement.style.setProperty('--px', px.toFixed(3)); document.documentElement.style.setProperty('--py', py.toFixed(3)); }); }, { passive: true });
}
render();
</script>
</body>
