<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>FactoryOS · Координація</title>
<style>
:root{--bg:#0b1020;--card:#131a30;--line:#26304f;--text:#e7ecff;--mute:#9aa6c9;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--unk:#a5b4fc;--acc:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 4px}h2{font-size:16px;margin:0 0 10px}p.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{background:#1f2a4a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.5;cursor:progress}
.hero{display:flex;gap:14px;align-items:flex-start}.dot{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:#071022}
.v-clear .dot{background:var(--ok)}.v-attention .dot{background:var(--warn)}.v-conflict .dot{background:var(--bad)}.v-unknown .dot{background:var(--unk)}
.hero b{font-size:18px;display:block}.hero small{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.stat{background:#0d1328;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.stat span{display:block;font-size:20px;font-weight:600}.stat small{color:var(--mute)}
.f{border-left:4px solid var(--line);background:#0d1328;border-radius:8px;padding:10px 12px;margin:0 0 10px}
.f.conflict{border-color:var(--bad)}.f.warning{border-color:var(--warn)}.f.unknown{border-color:var(--unk)}
.f b{display:block}.f .do{margin-top:6px;color:var(--mute);font-size:14px}.f code{background:#1a2342;border-radius:6px;padding:1px 6px;font-size:13px;word-break:break-all}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--line);color:var(--mute);margin-right:4px}
.chip.conflict{color:var(--bad);border-color:var(--bad)}.chip.warning{color:var(--warn);border-color:var(--warn)}.chip.unknown{color:var(--unk);border-color:var(--unk)}.chip.ok{color:var(--ok);border-color:var(--ok)}
.w{border-top:1px solid var(--line);padding:10px 0}.w:first-child{border-top:0}
.w .t{word-break:break-word}.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;color:var(--mute);font-size:13px}.meta b{color:var(--text);font-weight:500}
a{color:var(--acc)}small{color:var(--mute)}.empty{color:var(--mute)}
details summary{cursor:pointer;color:var(--mute)}ul{margin:6px 0 0;padding-left:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main>
<a href="/" style="display:inline-block;margin:0 0 6px;color:inherit;opacity:.7;text-decoration:none;font-size:14px">← FactoryOS</a>
<div class="row" style="justify-content:space-between"><h1 data-t="title"></h1>
<div class="row"><button id="refresh" data-t="refresh"></button><label class="sr" for="lang">Language</label><select id="lang"><option value="uk">UK</option><option value="ru">RU</option><option value="en">EN</option></select></div></div>
<p class="sub" data-t="sub"></p>
<section class="card" id="hero" aria-live="polite"></section>
<section class="card"><h2 data-t="findings"></h2><div id="findings"></div></section>
<section class="card"><h2 data-t="work"></h2><p class="sub" style="margin:0 0 8px" data-t="workHint"></p><div id="work"></div></section>
<section class="card"><details><summary data-t="how"></summary><div id="how"></div></details></section>
</main>

  const ids=(x.task_ids||[]).filter(Boolean);const st=x.state?(t('state')[x.state]||x.state):(x.draft?t('draft'):t('open'));
  return `<div class="w"><div class="t"><span class="chip">${esc(t('kind')[x.kind]||x.kind)}</span>${title}</div>
  <div class="meta"><span>${esc(t('k').lane)}: <b>${esc(x.lane)}</b></span><span>${esc(t('k').state)}: <b>${esc(st)}</b></span>${x.files_count!=null?`<span>${esc(t('k').files)}: <b>${x.files_count}</b></span>`:''}<span>${esc(t('k').task)}: ${ids.length?code(ids):`<small>${esc(t('noTask'))}</small>`}</span></div></div>`}).join(''):`<p class="empty">${esc(t('noWork'))}</p>`;
 $('#how').innerHTML=`<ul>${t('howList').map(x=>`<li>${x}</li>`).join('')}</ul>`;
}
async function load(force){busy=true;paint();
 try{const r=await fetch('/api/factory/coordination'+(force?'?refresh=1':''),{credentials:'same-origin'});const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));R=d;E=''}catch(e){E=e.message}
 busy=false;paint()}
$('#lang').onchange=e=>{L=e.target.value;store('coord_lang',L);paint()};
$('#refresh').onclick=()=>load(true);
paint();load(false);
</script>
</body>
