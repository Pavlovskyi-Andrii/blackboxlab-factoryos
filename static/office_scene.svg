<circle cx="1140" cy="455" r="270" fill="url(#violetGlow)" filter="url(#blur)"/>
<path d="M100 505C390 430 540 560 800 480S1250 395 1510 470" fill="none" stroke="#18bdf4" stroke-width="3" opacity=".18"/>

