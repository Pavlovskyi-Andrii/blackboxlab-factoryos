<text x="800" y="115" text-anchor="middle" fill="#76deff" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="700" letter-spacing="13" filter="url(#softGlow)">BLACKBOX LAB</text>
<text x="800" y="150" text-anchor="middle" fill="#7390a7" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="7">FACTORYOS • AGENT OPERATIONS</text>

