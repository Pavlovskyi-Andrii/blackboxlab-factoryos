<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-label="Blackbox Lab cyber office">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#091a2b"/><stop offset="1" stop-color="#08131f"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#14263a"/><stop offset="1" stop-color="#07111b"/></linearGradient>
<linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203b57"/><stop offset="1" stop-color="#0b1b2a"/></linearGradient>
