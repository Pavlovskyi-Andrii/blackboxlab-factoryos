<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-label="Blackbox Lab AI agent office">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#06101a"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#112238"/><stop offset="1" stop-color="#050c14"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18324a"/><stop offset="1" stop-color="#0a1724"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082a40"/><stop offset=".55" stop-color="#0d5271"/><stop offset="1" stop-color="#082233"/></linearGradient>
  <radialGradient id="cyanGlow"><stop stop-color="#2cc8ff" stop-opacity=".34"/><stop offset="1" stop-color="#2cc8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="violetGlow"><stop stop-color="#9c73ff" stop-opacity=".2"/><stop offset="1" stop-color="#9c73ff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .line{stroke:#1d4f70;stroke-width:2;opacity:.58}
    .screenLine{stroke:#52d8ff;stroke-width:2;opacity:.75}
    .status{fill:#48e89d}
    .pulse{animation:pulse 1.9s ease-in-out infinite;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
  <g id="station">
    <ellipse cx="0" cy="52" rx="106" ry="35" fill="#000" opacity=".23"/>
    <rect x="-101" y="-8" width="202" height="76" rx="17" fill="url(#desk)" stroke="#2a506b" stroke-width="2"/>
    <path d="M-93 17H93" stroke="#38749a" opacity=".35"/>
    <rect x="-58" y="-75" width="116" height="69" rx="10" fill="#050d15" stroke="#2597c4" stroke-width="2"/>
    <rect x="-49" y="-66" width="98" height="50" rx="6" fill="url(#screen)"/>
    <path d="M-37-51H18M-37-40H37M-37-29H5" class="screenLine"/>
    <circle cx="38" cy="-51" r="3.6" fill="#50ddff" class="pulse"/>
    <rect x="-26" y="-3" width="52" height="7" rx="3.5" fill="#09131d" stroke="#254861"/>
    <rect x="-15" y="-13" width="30" height="10" rx="4" fill="#101f2c"/>
    <path d="M-58 29h116" stroke="#06111b" stroke-width="6" stroke-linecap="round" opacity=".85"/>
    <rect x="-72" y="22" width="35" height="10" rx="5" fill="#101e2b"/>
    <rect x="37" y="22" width="35" height="10" rx="5" fill="#101e2b"/>
    <path d="M-73 68v24M73 68v24" stroke="#14293a" stroke-width="10" stroke-linecap="round"/>
    <path d="M-46 81h92" stroke="#122638" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(0 -96)">
      <ellipse cx="0" cy="38" rx="39" ry="17" fill="#02070d" opacity=".35"/>
      <path d="M-32 31q32-23 64 0l11 60h-86z" fill="var(--shirt,#183f58)"/>
      <path d="M-32 36q-24 20-25 49M32 36q24 20 25 49" fill="none" stroke="var(--shirt,#183f58)" stroke-width="15" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="24" fill="var(--skin,#b9795f)"/>
      <path d="M-22-3q3-25 24-25 20 0 24 21-11-9-22-8-15 1-26 12z" fill="var(--hair,#141920)"/>
      <path d="M-25 1q0 23 5 30M25 1q0 23-5 30" fill="none" stroke="var(--hair,#141920)" stroke-width="5" stroke-linecap="round" opacity=".75"/>
      <rect x="-5" y="21" width="10" height="11" rx="4" fill="var(--skin,#b9795f)"/>
      <circle cx="-52" cy="84" r="8" fill="var(--skin,#b9795f)"/>
      <circle cx="52" cy="84" r="8" fill="var(--skin,#b9795f)"/>
      <path d="M-40 44q40 17 80 0" fill="none" stroke="var(--accent,#2bc8ff)" stroke-width="3" opacity=".35"/>
    </g>
    <path d="M-35 70q35 13 70 0v26h-70z" fill="#0b1621" stroke="#1d3345"/>
    <circle cx="-84" cy="10" r="4" class="status pulse"/>
  </g>
</defs>

