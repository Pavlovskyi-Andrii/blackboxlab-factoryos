<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>FactoryOS · Surfer</title>
<style>
:root{--bg:#0b1020;--card:#131a30;--line:#26304f;--text:#e7ecff;--mute:#9aa6c9;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 4px}h2{font-size:16px;margin:0 0 8px}p.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}
button{background:#1f2a4a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button.primary{background:var(--acc);color:#071022;border-color:var(--acc);font-weight:600}button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}button.small{padding:4px 9px;font-size:13px}
input[type=text],select{background:#0d1328;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;max-width:100%}
label.box{display:inline-flex;gap:5px;align-items:center;margin-right:10px;font-size:14px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}small,.mute{color:var(--mute)}a{color:var(--acc)}
.need{border-color:var(--warn)}.need h2{color:var(--warn)}
.screen{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;margin:10px 0}
.screen img{display:block;width:100%;height:auto}.screen.live img{cursor:crosshair}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:5px 6px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
th{color:var(--mute);font-weight:500;border-top:0}.site{border-top:1px solid var(--line);padding:10px 0}.site:first-child{border-top:0}
details summary{cursor:pointer;color:var(--mute)}.msg{min-height:20px;margin:6px 0;font-size:14px}
code{background:#0d1328;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<main>
<div class="row between"><h1 data-t="title"></h1><select id="lang"><option value="ru">RU</option><option value="uk">UK</option><option value="en">EN</option></select></div>
<p class="sub" data-t="sub"></p>
<section class="card" id="gate"></section>
<div id="msg" class="msg"></div>
<section class="card" id="live"></section>
<section class="card"><h2 data-t="allowTitle"></h2><p class="mute" data-t="allowSub"></p><div id="allow"></div></section>
<section class="card"><h2 data-t="filesTitle"></h2><p class="mute" data-t="filesSub"></p><div id="files"></div></section>
<section class="card"><h2 data-t="recTitle"></h2><p class="mute" data-t="recSub"></p><div id="recipes"></div></section>
<section class="card"><details id="pastBox"><summary data-t="pastTitle"></summary><div id="past"></div></details></section>
<section class="card"><details id="auditBox"><summary data-t="auditTitle"></summary><div id="audit"></div></details></section>
</main>

const API="/api/factory/surfer/owner";
let lang=(()=>{try{return localStorage.getItem("fos_lang")}catch(e){return null}})()||(navigator.language||"ru").slice(0,2);
if(!T[lang])lang="ru";
let S={gate:{},allow:[],logins:[],presets:[],classes:[],sessions:[],uploads:[],audit:[],recipes:[],runs:[]};
let shotKey="",pastKey="",recKey="",busy=false,timer=null,allowDirty=false;
const $=id=>document.getElementById(id);
const tr=(k,v)=>{let s=(T[lang][k]??T.en[k]??k);for(const n in (v||{}))s=s.replace("{"+n+"}",v[n]);return s};
function h(tag,props,...kids){const el=document.createElement(tag);for(const k in (props||{})){const v=props[k];if(k==="class")el.className=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(v===true)el.setAttribute(k,"");else if(v!==false&&v!=null)el.setAttribute(k,v)}
  for(const kid of kids.flat()){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(String(kid)))}return el}
function say(text,bad){const m=$("msg");m.textContent=text||"";m.className="msg "+(bad?"bad":"ok");if(text&&!bad)setTimeout(()=>{if(m.textContent===text)m.textContent=""},4000)}
async function api(path,body){const opt=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  const r=await fetch(API+path,opt);let data={};try{data=await r.json()}catch(e){}
  if(!r.ok)throw new Error(typeof data.detail==="string"?data.detail:("HTTP "+r.status));return data}
async function act(fn,okText){if(busy)return;busy=true;try{await fn();allowDirty=false;if(okText)say(okText);await load()}catch(e){say(tr("error")+e.message,true)}finally{busy=false}}
const when=ts=>ts?new Date(ts*1000).toLocaleTimeString():"";
const reasons=list=>(list||[]).map(r=>tr("r_"+r)).join(", ");

function renderGate(){const g=S.gate||{},box=$("gate");box.replaceChildren();
  const state=g.enabled?h("span",{class:"chip ok"},tr("gateOn")):g.paused?h("span",{class:"chip warn"},tr("gatePaused")):h("span",{class:"chip bad"},tr("gateOff"));
  const u=g.usage||{},c=g.caps||{};
  box.append(h("div",{class:"row between"},h("div",{class:"row"},state,h("small",null,tr("usage",{s:u.sessions||0,sc:c.sessions||0,t:u.steps||0,tc:c.steps||0})),h("small",null,tr("sites",{n:g.sites_enabled||0}))),
    g.flag?h("button",{class:g.paused?"primary":"danger",onclick:()=>{if(!g.paused&&!confirm(tr("confirmPause")))return;act(()=>api("/policy/pause",{paused:!g.paused}))}},tr(g.paused?"unpause":"pause")):null));
  if(!g.flag)box.append(h("p",{class:"warn"},tr("flagOff")))}

function shot(session){const id=session.screen;if(!id)return h("p",{class:"mute"},tr("noShot"));
  const live=session.status==="takeover";
  const img=h("img",{src:API+"/steps/"+id+"/screenshot",alt:""});
  if(live)img.addEventListener("click",ev=>{const r=img.getBoundingClientRect();if(!img.naturalWidth)return;
    const x=(ev.clientX-r.left)*img.naturalWidth/r.width,y=(ev.clientY-r.top)*img.naturalHeight/r.height;
    act(()=>api("/sessions/"+session.id+"/control",{kind:"click",x:x,y:y}))});
  return h("div",{class:"screen"+(live?" live":"")},img)}

function renderLive(){const box=$("live");const s=S.sessions.find(x=>x.status!=="closed");
  const need=s&&["waiting_human","needs_owner_confirmation","takeover"].includes(s.status);box.className="card"+(need?" need":"");
  if(!s){box.replaceChildren(h("p",{class:"mute"},tr("noLive")));shotKey="";return}
  const key=[s.id,s.status,s.screen,s.steps.length,(s.steps[s.steps.length-1]||{}).status,lang].join("|");
  if(key===shotKey)return;                      /* nothing changed: keep the inputs the owner is typing into */
  shotKey=key;
  const kids=[h("div",{class:"row between"},h("h2",null,tr("liveTitle")),h("span",{class:"chip "+(need?"warn":"ok")},tr("st_"+s.status))),

    h("div",{class:"row",style:"margin-top:8px"},h("label",null,tr("upload")+": "),pick))}

  const fills=s.steps.filter(x=>x.status==="done"&&x.by!=="owner"&&["fill","select"].includes(x.action)&&x.value!=null&&!x.value_from);
  const inputs=fills.map(x=>[x.seq,h("input",{type:"text",placeholder:tr("recParam"),maxlength:"30"})]);
  return h("details",null,h("summary",null,tr("recSave")),h("p",{class:"mute"},tr("recHint")),h("div",{class:"row"},name),
    ...inputs.map((pair,i)=>h("div",{class:"row"},h("small",null,"#"+pair[0]+" "+((fills[i].element||{}).name||"")+" = "+fills[i].value),pair[1])),

function renderStatic(){document.documentElement.lang=lang;document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=tr(el.dataset.t)});$("lang").value=lang}
function render(){renderGate();renderLive();renderAllow();if(!$("files").contains(document.activeElement))renderFiles();if(!$("recipes").contains(document.activeElement))renderRecipes();if(!$("past").contains(document.activeElement))renderPast();if($("auditBox").open)renderAudit()}
async function load(){try{const [pol,ses,up,rec]=await Promise.all([api("/policy"),api("/sessions"),api("/uploads"),api("/recipes")]);S.recipes=rec.recipes;S.runs=rec.runs;
    S.gate=pol.gate;S.allow=pol.allow;S.logins=pol.logins;S.presets=pol.presets;S.classes=pol.classes;S.uploads=up.uploads;S.sessions=ses.sessions;
    const live=S.sessions.find(x=>x.status!=="closed");if(live){const one=await api("/sessions/"+live.id);Object.assign(live,one.session)}
    if($("auditBox").open)S.audit=(await api("/audit?limit=150")).audit;
    render();schedule(live?2500:10000)}catch(e){say(tr("error")+e.message,true);schedule(15000)}}
function schedule(ms){clearTimeout(timer);timer=setTimeout(load,ms)}
$("lang").addEventListener("change",ev=>{lang=ev.target.value;try{localStorage.setItem("fos_lang",lang)}catch(e){}shotKey="";pastKey="";recKey="";renderStatic();render()});
