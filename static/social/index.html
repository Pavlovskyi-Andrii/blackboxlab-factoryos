<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>FactoryOS · Соцсети</title>
<style>
:root{--bg:#0b1020;--card:#131a30;--line:#26304f;--text:#e7ecff;--mute:#9aa6c9;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0 4px}h2{font-size:17px;margin:0 0 8px}p.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{background:#1f2a4a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button.primary{background:var(--acc);color:#071022;border-color:var(--acc);font-weight:600}button.stop{background:var(--bad);color:#200;border-color:var(--bad);font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}
textarea,input,select{background:#0d1328;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;max-width:100%}
textarea{width:100%;min-height:110px}label{display:block;margin:6px 0}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}.text{white-space:pre-wrap;word-break:break-word;margin:6px 0}
.day{margin:12px 0 4px;font-weight:600;color:var(--acc)}small{color:var(--mute)}a{color:var(--acc);word-break:break-all}
.ib{display:flex;gap:12px;align-items:flex-start}.ib>div{flex:1;min-width:0}.thumb{flex:none;display:block;width:150px;height:150px;border-radius:10px;border:1px solid var(--line);background:#0d1328;object-fit:cover}
@media(max-width:520px){.thumb{width:96px;height:96px}}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}legend{color:var(--mute);padding:0 6px}
</style>
</head>
<body>
<main>
<a href="/" style="display:inline-block;margin:0 0 6px;color:inherit;opacity:.7;text-decoration:none;font-size:14px">← FactoryOS</a>
<div class="row" style="justify-content:space-between"><h1 data-t="title"></h1><select id="lang"><option value="ru">RU</option><option value="uk">UK</option><option value="en">EN</option></select></div>
<p class="sub" data-t="sub"></p>
<section class="card" id="status"></section>
<section class="card"><h2 data-t="modeTitle"></h2><div id="mode"></div></section>
<section class="card"><div class="row" style="justify-content:space-between"><h2 data-t="planTitle"></h2>
<div class="row"><button id="gen" data-t="generate"></button><button class="primary" id="approvePlan" data-t="approvePlan"></button></div></div>
<small id="genInfo"></small><p><small data-t="imgNote"></small></p><div id="plan"></div></section>
<section class="card"><h2 data-t="newItem"></h2>
<div class="row"><select id="nPlatform"><option value="telegram">Telegram</option><option value="linkedin">LinkedIn</option></select>
<input type="datetime-local" id="nWhen"><small data-t="kyiv"></small></div>
<textarea id="nText" maxlength="4096"></textarea><div class="row" style="justify-content:flex-end"><button class="primary" id="nSave" data-t="save"></button></div></section>
<section class="card"><h2 data-t="history"></h2><div id="history"></div></section>
</main>

function itemHtml(i,withActions){const st=(T[L].st||{})[i.status]||i.status;const cls=i.status==='published'?'ok':(['failed','uncertain','missed'].includes(i.status)?'bad':'warn');

 if(i.status==='uncertain')btn+=`<button data-a="yes" data-id="${i.id}">${esc(t('confirmYes'))}</button><button data-a="no" data-id="${i.id}">${esc(t('confirmNo'))}</button>`;

 const wait=(i.waiting||[]).length&&['draft','approved'].includes(i.status)?`<div><small class="warn">${esc(i.waiting.map(bl).join(' · '))}</small></div>`:'';
 return `<div class="item"><span class="chip ${cls}">${esc(st)}</span> <b>${esc(i.planned_local.slice(11))}</b> <span class="chip">${esc(i.platform)}</span> <small>${esc(i.created_by||'')}${by}</small>${wait}<div class="ib">${i.image_url?`<a href="${esc(i.image_url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(i.image_url)}" alt="${esc(t('imgAlt')+': '+((i.image||{}).headline||''))}" loading="lazy" width="150" height="150"></a>`:''}<div><div class="text">${esc(i.text)}</div>`+
  (r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>`:'')+(r.code?`<small class="bad"> ${esc(r.code)}</small>`:'')+`</div></div><div class="row">${btn}</div></div>`}
function paintPlan(){const open=(S.items||[]).filter(i=>i.status==='draft'||i.status==='approved');
 if(!open.length){$('#plan').innerHTML=`<p><small>${esc(t('empty'))}</small></p>`}
 else{let h='',day='';for(const i of open){const d=i.planned_local.slice(0,10);if(d!==day){day=d;h+=`<div class="day">${esc(new Date(d+'T12:00:00').toLocaleDateString(L,{weekday:'long',day:'numeric',month:'long'}))}</div>`}h+=itemHtml(i,true)}$('#plan').innerHTML=h}
 $('#approvePlan').disabled=(S.settings||{}).mode==='each'||!open.some(i=>i.status==='draft');
 const hist=(S.items||[]).filter(i=>!(i.status==='draft'||i.status==='approved')).reverse();
 $('#history').innerHTML=hist.length?hist.map(i=>`<div class="day">${esc(i.planned_local.slice(0,10))}</div>`+itemHtml(i,true)).join(''):`<p><small>${esc(t('noHistory'))}</small></p>`;
 document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id));}
function paint(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('#lang').value=L;document.documentElement.lang=L;paintStatus();paintMode();paintPlan()}
async function act(a,id){const base='/api/factory/social/items/'+id+'/';try{
 if(a==='edit'){const i=S.items.find(x=>x.id===id)||{};const v=prompt(t('askEdit'),i.text||'');if(v==null)return;const w=prompt(t('askWhen'),i.planned_local||'');if(w==null)return;await post(base+'edit',{text:v,planned_local:w})}
 else if(a==='yes'){const u=prompt(t('askUrl'));if(!u)return;await post(base+'confirm',{outcome:u})}
 else if(a==='no'){await post(base+'confirm',{outcome:'not_published'})}
 else await post(base+a);}catch(e){alert(e.message)}load()}
async function load(){try{S=await api('/api/factory/social')}catch(e){$('#status').innerHTML=`<p class="bad">${esc(e.message)}</p>`;return}paint()}
$('#gen').onclick=async()=>{try{const r=await post('/api/factory/social/plan/generate');$('#genInfo').textContent=t('gen')(r)}catch(e){alert(e.message)}load()};
$('#approvePlan').onclick=async()=>{if(!confirm(t('askApprovePlan')))return;try{const r=await post('/api/factory/social/plan/approve');$('#genInfo').textContent=t('approved')(r.approved.length)}catch(e){alert(e.message)}load()};
$('#nSave').onclick=async()=>{const v=$('#nText').value.trim();if(!v||!$('#nWhen').value)return;try{await post('/api/factory/social/items',{platform:$('#nPlatform').value,text:v,planned_local:$('#nWhen').value.slice(0,16)});$('#nText').value=''}catch(e){alert(e.message)}load()};
$('#lang').onchange=e=>{L=e.target.value;try{localStorage.setItem('social_lang',L)}catch(_){}paint()};
paint();load();
</script>
</body>
</html>
