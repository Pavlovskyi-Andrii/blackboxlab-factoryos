<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Faceless Models CRM · MVP Builder</title>
<style>
:root{color-scheme:dark;--bg:#070f1a;--panel:#0c1929;--panel2:#102239;--edge:#294560;--ink:#e8f1fc;--muted:#9db1c9;--blue:#189eff;--cyan:#69d4f2;--ok:#64cf9b;--warning:#e7b35b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#142b49 0%,transparent 42%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}a{color:var(--cyan)}button,input,select,textarea{font:inherit}button,.btn{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button,.btn{border:1px solid var(--edge);border-radius:10px;color:var(--ink);background:var(--panel2);padding:10px 14px;text-decoration:none;display:inline-block}button:hover,.btn:hover{border-color:var(--blue)}.primary{background:linear-gradient(110deg,#1575ec,#11b4ec);color:white;border:0;font-weight:700}.wrap{max-width:1200px;margin:auto;padding:25px 22px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.top .langs{display:flex;gap:5px}.langs button{padding:6px 11px}.langs button[aria-pressed=true]{background:#174e86;border-color:var(--blue)}h1{font-size:clamp(27px,4vw,42px);line-height:1.15;margin:24px 0 8px}h2{font-size:19px;margin:0 0 10px}.lede{max-width:840px;color:var(--muted);margin-bottom:18px}.warning{font-size:13px;padding:12px 15px;border-radius:12px;border:1px solid #705b37;background:#312919;color:#ffe2a4}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:23px 0}.stat{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:18px}.stat strong{display:block;font-size:32px;line-height:1.2}.stat small{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:20px;margin:20px 0}.formrow{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}input,select,textarea{background:#071522;border:1px solid #34506a;color:var(--ink);border-radius:9px;padding:10px;width:100%;min-width:0}textarea{resize:vertical;min-height:85px}.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.model{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:20px;min-width:0}.modelHead{display:flex;align-items:start;justify-content:space-between;gap:8px}.model h3{margin:0;font-size:20px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:13px;margin:4px 0 12px}.tag{display:inline-block;background:#173658;color:#b5ddff;border:1px solid #315c8d;border-radius:30px;padding:3px 9px;font-size:12px}.modelFields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.model form{margin-top:12px}.actionLine{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:11px 0}.actionLine h4{margin:0;font-size:14px}.actionLine small{color:var(--muted)}.taskList{list-style:none;margin:6px 0;padding:0}.taskList li{display:flex;gap:9px;align-items:start;padding:7px 0;border-bottom:1px solid #1b3247;overflow-wrap:anywhere}.taskList input{width:auto;margin-top:5px}.taskList .done{text-decoration:line-through;color:var(--muted)}.taskForm{display:flex;gap:8px}.taskForm input{flex:1}.taskForm button{white-space:nowrap}.empty{padding:32px;color:var(--muted);border:1px dashed #3d5672;border-radius:14px;text-align:center}.msg{color:var(--muted);min-height:22px;margin:10px 0}.msg.error{color:#ffaaa6}.history{color:var(--muted);font-size:12px}.history summary{cursor:pointer}.history li{margin:7px 0}.footer{font-size:12px;color:var(--muted);margin-top:24px}
@media(max-width:800px){.models{grid-template-columns:1fr}.formrow{grid-template-columns:1fr 1fr}.formrow button{grid-column:span 2}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr 1fr;gap:7px}.stat{padding:12px}.stat strong{font-size:26px}.modelFields,.formrow{grid-template-columns:1fr}.formrow button{grid-column:auto}.wrap{padding:18px 12px 60px}.panel,.model{padding:15px}}
</style>
</head>
<body>
<main class="wrap">
 <header class="top"><a href="/static/mvp-factory/index.html" id="back">← MVP Builder</a><div class="langs" role="group" aria-label="Language"><button data-lang="uk" type="button">UK</button><button data-lang="ru" type="button">RU</button><button data-lang="en" type="button">EN</button></div></header>
 <h1>Faceless <span style="color:#63d4ff">Models CRM</span></h1>
 <p class="lede" id="intro"></p><p class="warning" id="safety"></p>
 <div class="stats"><div class="stat"><strong id="count-models">—</strong><small id="label-models"></small></div><div class="stat"><strong id="count-active">—</strong><small id="label-active"></small></div><div class="stat"><strong id="count-tasks">—</strong><small id="label-tasks"></small></div></div>
 <section class="panel" aria-labelledby="create-label"><h2 id="create-label"></h2><form id="new-form" class="formrow"><label class="field"><span id="label-alias"></span><input name="alias" maxlength="70" minlength="2" required autocomplete="off"></label><label class="field"><span id="label-niche"></span><input name="niche" maxlength="80" autocomplete="off"></label><label class="field"><span id="label-channel"></span><select name="channel"><option value="none">—</option><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="youtube">YouTube</option><option value="fanvue">Fanvue</option><option value="other">Other</option></select></label><button type="submit" class="primary" id="create-btn"></button></form><p class="msg" id="status" role="status" aria-live="polite"></p></section>
 <section aria-labelledby="list-label"><h2 id="list-label"></h2><div id="list" class="models"><div class="empty">Loading…</div></div></section>
 <p class="footer" id="footer"></p>
</main>
<script>
'use strict';
const I={
 en:{intro:'Private operational board for draft synthetic creator personas: profile, workflow stage, checklist and local change history.',safety:'Prototype only. Do not enter legal names, private contacts, identity documents, sensitive videos or adult-content links. No platform connections, publishing, face processing or payments.',models:'Persona cards',active:'Active',tasks:'Open tasks',create:'Add a model persona',alias:'Persona / alias',niche:'Niche',channel:'Channel',add:'Create card',list:'Model profiles',empty:'No models yet. Create the first draft persona.',stage:'Workflow stage',notes:'Internal notes (non-sensitive)',save:'Save changes',task:'New internal task',addTask:'Add task',checklist:'Checklist',history:'Local activity history',loading:'Loading…',error:'Cannot load CRM. Sign in as the FactoryOS owner and retry.',saved:'Saved',failed:'Request failed',footer:'Local owner-only CRM. Records are stored on the existing FactoryOS persistent data volume, not sent to a third party.',idea:'Idea',research:'Research',onboarding:'Onboarding',ready:'Ready',activeStage:'Active',paused:'Paused',archived:'Archived'},
 uk:{intro:'Приватна робоча CRM для чернеток синтетичних моделей: профіль, етап, задачі та локальна історія змін.',safety:'Лише прототип. Не додавайте справжні імена, приватні контакти, документи, чутливі відео чи посилання на adult-контент. Без підключення платформ, публікацій, обробки облич та платежів.',models:'Картки моделей',active:'Активні',tasks:'Невиконані задачі',create:'Додати модель',alias:'Псевдонім моделі',niche:'Ніша',channel:'Канал',add:'Створити картку',list:'Профілі моделей',empty:'Моделей поки немає. Створіть першу чернетку.',stage:'Етап роботи',notes:'Внутрішні нотатки (нечутливі)',save:'Зберегти зміни',task:'Нова внутрішня задача',addTask:'Додати задачу',checklist:'Список задач',history:'Локальна історія',loading:'Завантаження…',error:'Не вдалося завантажити CRM. Увійдіть як власник FactoryOS і повторіть.',saved:'Збережено',failed:'Помилка запиту',footer:'Приватна CRM власника. Записи зберігаються у наявному постійному сховищі FactoryOS без передачі стороннім сервісам.',idea:'Ідея',research:'Дослідження',onboarding:'Підготовка',ready:'Готово до перевірки',activeStage:'Активна',paused:'На паузі',archived:'Архів'},
 ru:{intro:'Приватная CRM для черновых синтетических моделей: профиль, этап работы, задачи и локальная история изменений.',safety:'Только прототип. Не вводите реальные имена, личные контакты, документы, чувствительные видео или ссылки на adult-контент. Нет подключения платформ, публикаций, обработки лиц или платежей.',models:'Карточки моделей',active:'Активные',tasks:'Открытые задачи',create:'Добавить модель',alias:'Псевдоним модели',niche:'Ниша',channel:'Канал',add:'Создать карточку',list:'Профили моделей',empty:'Моделей пока нет. Создайте первую черновую карточку.',stage:'Этап работы',notes:'Внутренние заметки (без личных данных)',save:'Сохранить',task:'Новая внутренняя задача',addTask:'Добавить задачу',checklist:'Список задач',history:'Локальная история',loading:'Загрузка…',error:'Не удалось загрузить CRM. Войдите как владелец FactoryOS и повторите.',saved:'Сохранено',failed:'Ошибка запроса',footer:'Приватная CRM владельца. Записи хранятся в существующем постоянном хранилище FactoryOS, без передачи сторонним сервисам.',idea:'Идея',research:'Исследование',onboarding:'Подготовка',ready:'Готово к проверке',activeStage:'Активная',paused:'Пауза',archived:'Архив'}
};
const STAGES=['idea','research','onboarding','ready','active','paused','archived'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='ru',data=null;
try{const l=localStorage.getItem('faceless-crm:lang');if(I[l])lang=l}catch(e){}
const t=k=>I[lang][k]||k;
function message(s,error){const e=$('#status');e.textContent=s;e.className='msg'+(error?' error':'')}
async function req(url,body){const init={credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}};
 if(body!==undefined){init.method='POST';init.headers['Content-Type']='application/json';init.body=JSON.stringify(body)}
 const res=await fetch(url,init);const obj=await res.json().catch(()=>({}));if(!res.ok)throw Error(obj.detail||String(res.status));return obj}
async function load(){try{data=await req('/api/faceless-crm');message('');render()}catch(e){data=null;message(t('error')+' ('+e.message+')',true);render()}}
function stages(selected){return STAGES.map(s=>'<option value="'+s+'"'+(selected===s?' selected':'')+'>'+esc(t(s==='active'?'activeStage':s))+'</option>').join('')}
function card(m){const activity=(data.events||[]).filter(e=>e.model_id===m.id).slice(0,6);
 const tasks=m.tasks||[],done=tasks.filter(x=>x.done).length;
 return '<article class="model"><div class="modelHead"><div><h3>'+esc(m.alias)+'</h3><p class="meta">'+esc(m.niche||'—')+' · '+esc(m.channel||'none')+'</p></div><span class="tag">'+esc(t(m.stage==='active'?'activeStage':m.stage))+'</span></div>'
 +'<form data-kind="edit" data-id="'+esc(m.id)+'"><div class="modelFields"><label class="field">'+esc(t('alias'))+'<input name="alias" maxlength="70" required value="'+esc(m.alias)+'"></label><label class="field">'+esc(t('stage'))+'<select name="stage">'+stages(m.stage)+'</select></label><label class="field">'+esc(t('niche'))+'<input name="niche" maxlength="80" value="'+esc(m.niche)+'"></label><label class="field">'+esc(t('channel'))+'<select name="channel">'+['none','instagram','tiktok','youtube','fanvue','other'].map(c=>'<option value="'+c+'"'+(m.channel===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label></div><label class="field" style="margin-top:12px">'+esc(t('notes'))+'<textarea name="notes" maxlength="1000">'+esc(m.notes||'')+'</textarea></label><div style="margin-top:10px"><button type="submit">'+esc(t('save'))+'</button></div></form>'
 +'<div class="actionLine"><h4>'+esc(t('checklist'))+'</h4><small>'+done+' / '+tasks.length+'</small></div>'
 +'<ul class="taskList">'+tasks.map(task=>'<li><input type="checkbox" aria-label="'+esc(task.title)+'" data-task="'+esc(task.id)+'" data-id="'+esc(m.id)+'"'+(task.done?' checked':'')+'><span class="'+(task.done?'done':'')+'">'+esc(task.title)+'</span></li>').join('')+'</ul>'
 +'<form class="taskForm" data-kind="task" data-id="'+esc(m.id)+'"><input name="title" required maxlength="120" placeholder="'+esc(t('task'))+'" aria-label="'+esc(t('task'))+'"><button type="submit">'+esc(t('addTask'))+'</button></form>'
 +'<details class="history" style="margin-top:16px"><summary>'+esc(t('history'))+'</summary><ul>'+activity.map(e=>'<li>'+esc((e.at||'').slice(0,16).replace('T',' '))+' · '+esc(e.action)+' · '+esc(e.detail)+'</li>').join('')+'</ul></details></article>'}
function render(){document.documentElement.lang=lang;
 document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
 const ids={'intro':'intro','safety':'safety','label-models':'models','label-active':'active','label-tasks':'tasks','create-label':'create','label-alias':'alias','label-niche':'niche','label-channel':'channel','create-btn':'add','list-label':'list','footer':'footer'};
 Object.keys(ids).forEach(id=>{$('#'+id).textContent=t(ids[id])});
 const models=data?.models||[];$('#count-models').textContent=data?String(models.length):'—';
 $('#count-active').textContent=data?String(models.filter(m=>m.stage==='active').length):'—';
 $('#count-tasks').textContent=data?String(models.reduce((n,m)=>n+(m.tasks||[]).filter(x=>!x.done).length,0)):'—';
 $('#list').innerHTML=data?(models.length?models.map(card).join(''):'<div class="empty">'+esc(t('empty'))+'</div>'):'<div class="empty">'+esc(t('loading'))+'</div>'}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('faceless-crm:lang',lang)}catch(e){}render()}));
document.addEventListener('submit',async e=>{const form=e.target.closest('form');if(!form)return;e.preventDefault();
 const kind=form.id==='new-form'?'new':form.dataset.kind,id=form.dataset.id,fd=new FormData(form);let path,body;
 if(kind==='new'){path='/api/faceless-crm/models';body={alias:fd.get('alias'),niche:fd.get('niche'),channel:fd.get('channel')}}
 else if(kind==='edit'){path='/api/faceless-crm/models/'+encodeURIComponent(id);body={alias:fd.get('alias'),niche:fd.get('niche'),channel:fd.get('channel'),stage:fd.get('stage'),notes:fd.get('notes')}}
 else if(kind==='task'){path='/api/faceless-crm/models/'+encodeURIComponent(id)+'/tasks';body={title:fd.get('title')}}
 else return;
 const btn=form.querySelector('button[type=submit]');if(btn)btn.disabled=true;
 try{await req(path,body);if(kind==='new')form.reset();await load();message(t('saved'))}catch(err){message(t('failed')+': '+err.message,true)}finally{if(btn)btn.disabled=false}});
document.addEventListener('change',async e=>{const box=e.target;if(!box.matches('input[data-task]'))return;
 box.disabled=true;try{await req('/api/faceless-crm/models/'+encodeURIComponent(box.dataset.id)+'/tasks/'+encodeURIComponent(box.dataset.task),{done:box.checked});await load();message(t('saved'))}
 catch(err){box.checked=!box.checked;message(t('failed')+': '+err.message,true)}finally{box.disabled=false}});
render();load();
</script>
</body>
</html>
