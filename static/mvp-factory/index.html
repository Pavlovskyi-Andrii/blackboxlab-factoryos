<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>MVP Factory</title>
<!-- #186 MVP Factory overview. Reads /api/mvp-factory (signed-in only). Stages change only through recorded events with
     evidence; nothing on this page starts a worker, spends money, deploys or publishes. -->
<style>
:root{--bg:#070a16;--glass:rgba(20,27,54,.6);--glass2:rgba(28,37,72,.66);--edge:rgba(160,180,255,.14);--edge2:rgba(160,180,255,.26);
  --ink:#eef1ff;--mute:#a3abc9;--dim:#717a9c;--violet:#8b7bff;--cyan:#4fe3ff;--teal:#3ee6c1;--coral:#ff7a6b;--coral-ink:#2a0d08;
  --warn:#ffd27a;--bad:#ff8f86;--ok:#79e8b0;--display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
body{overflow-x:hidden}
.aurora{position:fixed;inset:-20vmax;z-index:0;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px)}
.aurora .a1{width:55vmax;height:55vmax;left:0;top:-8vmax;background:radial-gradient(circle,#5b43ff 0,transparent 65%);opacity:.45;animation:d1 38s ease-in-out infinite alternate}
.aurora .a2{width:50vmax;height:50vmax;right:-4vmax;top:12vmax;background:radial-gradient(circle,#00c8ff 0,transparent 62%);opacity:.28;animation:d2 44s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(8vmax,6vmax)}}@keyframes d2{to{transform:translate(-8vmax,4vmax)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:grid;gap:26px;min-width:0}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font:700 12px var(--mono);letter-spacing:.18em;color:var(--mute);text-transform:uppercase;text-decoration:none}
.topR{display:flex;gap:8px;flex-wrap:wrap}
.langs{display:flex;gap:4px;padding:3px;border:1px solid var(--edge);border-radius:999px;background:var(--glass)}
.langs button{font:600 12px var(--mono);background:transparent;color:var(--mute);border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--bg);background:var(--ink)}
h1{font:700 clamp(32px,5.6vw,56px)/1.04 var(--display);margin:6px 0 10px}
h1 em{font-style:italic;background:linear-gradient(100deg,#c9c2ff,var(--cyan) 50%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:#c8cee8;max-width:66ch;margin:0}
.honest{margin-top:12px;font:12.5px/1.5 var(--mono);color:var(--warn)}
h2{font:700 clamp(22px,3vw,30px)/1.1 var(--display);margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14.5px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.st{padding:12px 10px;border-radius:14px;border:1px solid var(--edge);background:rgba(10,14,32,.55);display:grid;gap:4px;min-width:0}
.st b{font:700 22px/1 var(--display)}.st span{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.st.has{border-color:var(--edge2);background:linear-gradient(160deg,rgba(91,67,255,.25),rgba(10,14,32,.6))}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.role{padding:14px;border-radius:14px;border:1px solid var(--edge);background:rgba(10,14,32,.55)}
.role b{display:block}.role small{color:var(--mute);font-size:13px}
.tag{display:inline-block;font:600 10.5px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--edge2);color:var(--mute);margin-top:8px}
.projects{display:grid;gap:14px}
.proj{padding:18px;display:grid;gap:12px;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.ph h3{margin:0;font:700 20px var(--body)}
.ph a{color:var(--cyan);font:600 13px var(--mono);text-decoration:none}
.badge{font:700 11px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid var(--edge2);text-transform:uppercase;letter-spacing:.06em}
.badge.stage{color:var(--cyan);border-color:rgba(79,227,255,.4)}.badge.blocked{color:var(--bad);border-color:rgba(255,143,134,.45)}.badge.done{color:var(--ok);border-color:rgba(121,232,176,.45)}
.bar{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.bar i{height:8px;border-radius:999px;background:rgba(255,255,255,.08)}
.bar i.on{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.bar i.now{background:var(--coral);box-shadow:0 0 12px rgba(255,122,107,.6)}
.next{font-size:14.5px;padding:10px 12px;border-radius:12px;background:rgba(10,14,32,.55);border:1px solid var(--edge)}
.next b{color:var(--teal)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 14px var(--body);border-radius:12px;padding:9px 14px;border:1px solid var(--edge2);background:rgba(28,37,72,.7);color:var(--ink);cursor:pointer;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,#ff9a7b,var(--coral));color:var(--coral-ink);border-color:transparent}
details.hist>summary,details.act>summary{cursor:pointer;color:var(--mute);font-size:14px}
ol.tl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;border-left:2px solid var(--edge2);padding-left:14px}
ol.tl li{font-size:13.5px;position:relative}
ol.tl li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--violet)}
ol.tl small{color:var(--dim);font-family:var(--mono)}
ol.tl a{color:var(--cyan);overflow-wrap:anywhere}
form.ev{display:grid;gap:8px;margin-top:10px}
form.ev .row{display:flex;flex-wrap:wrap;gap:8px}
input,select{font:14px var(--body);background:rgba(9,13,30,.75);color:var(--ink);border:1px solid var(--edge2);border-radius:10px;padding:9px 10px;min-width:0;max-width:100%}
input{flex:1 1 220px}
.msg{font-size:13.5px}
.unv{font:600 10.5px var(--mono);color:var(--warn);border:1px solid rgba(255,210,122,.35);border-radius:999px;padding:1px 7px;white-space:nowrap}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.state{padding:16px;border-radius:14px}
.state.bad{color:var(--bad)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
footer{color:var(--dim);font-size:13px;text-align:center}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const PIPE=['idea','researching','spec_draft','spec_review','build_queued','building','qa_review','preview_ready','owner_review'];
let lang='uk',data=null,error='',msgs={};const openForms=new Set();
try{const l=localStorage.getItem('mvp-factory:lang');if(['uk','ru','en'].includes(l))lang=l}catch(e){}
const t=()=>T[lang];
function link(u){const safe=/^(https:\/\/github\.com\/|\/static\/)/.test(u);return safe?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace('https://github.com/Pavlovskyi-Andrii/blackboxlab-factoryos/','gh:'))+'</a>':esc(u)}
async function load(){
  error='';
  try{const r=await fetch('/api/mvp-factory',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
    const type=r.headers.get('content-type')||'';
    if(r.status===401||r.status===403||!type.includes('json')){error='auth';data=null}
    else if(!r.ok){error=t().failed+' · HTTP '+r.status;data=null}
    else data=await r.json();
  }catch(e){error=t().failed;data=null}
  render();
}
function render(){
  const x=t();document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=x[el.dataset.t]||''});
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  const projects=(data&&data.projects)||[];
  const counts={};projects.forEach(p=>{counts[p.stage]=(counts[p.stage]||0)+1});
  $('#flow').innerHTML=PIPE.concat(['validated']).map(s=>'<div class="st'+(counts[s]?' has':'')+'"><b>'+(counts[s]||0)+'</b><span>'+esc(x.stages[s])+'</span></div>').join('');
  const roleNames=Object.keys(x.roles);
  $('#roles').innerHTML=roleNames.map(r=>'<div class="role"><b>'+esc(r)+'</b><small>'+esc(x.roles[r])+'</small><br><span class="tag">'+esc(x.role_tag)+'</span></div>').join('');
  if(error==='auth'){$('#projects').innerHTML='<div class="glass state">'+esc(x.auth)+' <a class="btn primary" href="/login">'+esc(x.login)+'</a></div>';return}
  if(error){$('#projects').innerHTML='<div class="glass state bad">'+esc(error)+'</div>';return}
  if(!data){$('#projects').innerHTML='<div class="glass state">'+esc(x.loading)+'</div>';return}
  $('#projects').innerHTML=projects.map(p=>{
    const idx=PIPE.indexOf(p.stage),closed=p.stage==='validated'||p.stage==='rejected';
    const bar='<div class="bar" aria-hidden="true">'+PIPE.map((s,i)=>'<i class="'+(closed&&p.stage==='validated'?'on':i<idx?'on':i===idx?'now':'')+'"></i>').join('')+'</div>';
    const badge=p.blocked?'<span class="badge blocked">'+esc(x.blocked)+'</span>':closed?'<span class="badge done">'+esc(x.stages[p.stage])+'</span>':'<span class="badge stage">'+esc(x.stages[p.stage]||p.stage)+'</span>';
    const r=p.recommendation||{};
    const next=p.blocked?'<b>'+esc(x.blocked)+':</b> '+esc(p.blocked.reason):closed?esc(x.closed):'<b>'+esc(x.next)+':</b> '+esc(x.stages[r.next_stage]||r.next_stage||'')+' · '+esc(r.role||'')+' — '+esc(r.decision==='owner'?x.owner:x.rec);
    const hist=(p.history||[]).slice().reverse().map(e=>'<li><small>'+esc(String(e.at).replace('T',' ').slice(0,16))+' · '+esc(e.actor)+'</small><br>'+esc(x.kinds[e.kind]||e.kind)+(e.from_stage!==e.to_stage?' · '+esc(x.stages[e.from_stage])+' → '+esc(x.stages[e.to_stage]):'')+(e.note?' — '+esc(e.note):'')+(e.evidence&&e.evidence.length?'<br>'+e.evidence.map(link).join(' · ')+' <span class="unv">'+esc(x.unverified)+'</span>':'')+'</li>').join('');
    const m=msgs[p.id]||{};
    const form='<details class="act" data-p="'+esc(p.id)+'"'+(openForms.has(p.id)?' open':'')+'><summary>'+esc(x.act)+'</summary><form class="ev" data-p="'+esc(p.id)+'"><div class="row"><select name="kind" aria-label="'+esc(x.kind)+'">'+Object.keys(x.kinds).map(k=>'<option value="'+k+'">'+esc(x.kinds[k])+'</option>').join('')+'</select><input name="evidence" type="text" placeholder="'+esc(x.evidence)+'" aria-label="'+esc(x.evidence)+'"></div><div class="row"><input name="note" type="text" maxlength="500" placeholder="'+esc(x.note)+'" aria-label="'+esc(x.note)+'"><button class="btn" type="submit">'+esc(x.save)+'</button></div><div class="msg '+(m.ok?'ok':'bad')+'" role="status">'+esc(m.text||'')+'</div></form></details>';
    return '<article class="glass proj"><div class="ph"><h3>'+esc(p.title)+'</h3>'+badge+'<a href="https://github.com/Pavlovskyi-Andrii/blackboxlab-factoryos/issues/'+Number(p.issue)+'" target="_blank" rel="noopener">#'+Number(p.issue)+'</a></div>'+bar+'<div class="next">'+next+'</div>'+
      (p.prototype?'<div class="links"><a class="btn primary" href="'+esc(p.prototype)+'" target="_blank" rel="noopener">'+esc(x.open)+' ↗</a></div>':'')+
      '<details class="hist"><summary>'+esc(x.history)+' · '+(p.history||[]).length+' '+esc(x.events)+'</summary><ol class="tl">'+hist+'</ol></details>'+form+'</article>';
  }).join('');
}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form.ev');if(!f)return;e.preventDefault();
  const pid=f.dataset.p,kind=f.kind.value,ev=f.evidence.value.trim(),note=f.note.value.trim(),x=t();
  // One opaque key per intended operation. It is reused only to retry that same operation after a network failure,
  // and dropped once the server answers or the form changes, so two real submissions never collapse into one.
  if(!f.dataset.key)f.dataset.key=newKey();
  const body={kind,evidence:ev?[ev]:[],note,reason:kind==='block'?note:'',idempotency_key:f.dataset.key};
  try{const r=await fetch('/api/mvp-factory/'+encodeURIComponent(pid)+'/events',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    delete f.dataset.key;  // the server answered: this operation is finished either way
    if(r.ok){msgs[pid]={ok:true,text:d.duplicate?x.dup:x.saved};openForms.add(pid);await load();return}
    showMsg(f,x.err[d.detail]||String(d.detail||('HTTP '+r.status)));  // keep the form and what was typed
  }catch(err){showMsg(f,x.retry)}  // network failure: the key stays, so pressing again retries the same operation
});
function newKey(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form.ev');if(f)delete f.dataset.key});
function showMsg(f,text){const m=f.querySelector('.msg');m.className='msg bad';m.textContent=text}
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('act')){d.open?openForms.add(d.dataset.p):openForms.delete(d.dataset.p)}},true);
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('mvp-factory:lang',lang)}catch(e){}render()}));
render();load();
</script>
</body>
</html>
