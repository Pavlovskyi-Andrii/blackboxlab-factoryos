body{overflow-x:hidden}

.aurora .a2{width:50vmax;height:50vmax;right:-4vmax;top:12vmax;background:radial-gradient(circle,#00c8ff 0,transparent 62%);opacity:.28;animation:d2 44s ease-in-out infinite alternate}

@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}

header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font:700 12px var(--mono);letter-spacing:.18em;color:var(--mute);text-transform:uppercase;text-decoration:none}
.topR{display:flex;gap:8px;flex-wrap:wrap}
.langs{display:flex;gap:4px;padding:3px;border:1px solid var(--edge);border-radius:999px;background:var(--glass)}
.langs button{font:600 12px var(--mono);background:transparent;color:var(--mute);border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--bg);background:var(--ink)}
h1{font:700 clamp(32px,5.6vw,56px)/1.04 var(--display);margin:6px 0 10px}

.lede{color:#c8cee8;max-width:66ch;margin:0}
.honest{margin-top:12px;font:12.5px/1.5 var(--mono);color:var(--warn)}
h2{font:700 clamp(22px,3vw,30px)/1.1 var(--display);margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14.5px}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.st{padding:12px 10px;border-radius:14px;border:1px solid var(--edge);background:rgba(10,14,32,.55);display:grid;gap:4px;min-width:0}
.st b{font:700 22px/1 var(--display)}.st span{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.st.has{border-color:var(--edge2);background:linear-gradient(160deg,rgba(91,67,255,.25),rgba(10,14,32,.6))}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.role{padding:14px;border-radius:14px;border:1px solid var(--edge);background:rgba(10,14,32,.55)}
.role b{display:block}.role small{color:var(--mute);font-size:13px}
.tag{display:inline-block;font:600 10.5px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--edge2);color:var(--mute);margin-top:8px}
.projects{display:grid;gap:14px}
.proj{padding:18px;display:grid;gap:12px;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.ph h3{margin:0;font:700 20px var(--body)}
.ph a{color:var(--cyan);font:600 13px var(--mono);text-decoration:none}
.badge{font:700 11px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid var(--edge2);text-transform:uppercase;letter-spacing:.06em}

.next{font-size:14.5px;padding:10px 12px;border-radius:12px;background:rgba(10,14,32,.55);border:1px solid var(--edge)}
.next b{color:var(--teal)}

.btn{font:600 14px var(--body);border-radius:12px;padding:9px 14px;border:1px solid var(--edge2);background:rgba(28,37,72,.7);color:var(--ink);cursor:pointer;text-decoration:none}

ol.tl a{color:var(--cyan);overflow-wrap:anywhere}

input,select{font:14px var(--body);background:rgba(9,13,30,.75);color:var(--ink);border:1px solid var(--edge2);border-radius:10px;padding:9px 10px;min-width:0;max-width:100%}
input{flex:1 1 220px}
.msg{font-size:13.5px}

:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.barRow{display:flex;align-items:center;gap:12px;min-width:0}

.pct{font:700 13px var(--mono);color:var(--ink);white-space:nowrap}.pct small{color:var(--dim);font-weight:600}
.proj:target{border-color:rgba(79,227,255,.55);box-shadow:0 0 0 1px rgba(79,227,255,.35)}
.briefTxt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(10,14,32,.55);border:1px solid var(--edge)}
/* "Команда MVP" as a pipeline (owner 2026-11-11): cards joined by → arrows; on narrow screens one column with ↓ arrows */
.team{display:grid;gap:12px}
.pipe{display:grid;gap:26px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.pipe .role{position:relative;min-width:0}
.pipe .role:not(:last-child)::after{content:"→";position:absolute;right:-21px;top:50%;transform:translateY(-50%);width:16px;text-align:center;font:700 18px/1 var(--body);color:var(--cyan)}
.pipe .role b{overflow-wrap:anywhere}
.pipe .role.now{border-color:rgba(79,227,255,.55);background:linear-gradient(160deg,rgba(0,200,255,.18),rgba(10,14,32,.6));box-shadow:0 0 18px rgba(79,227,255,.18)}
.pipe .role .tag.now{color:var(--bg);background:var(--cyan);border-color:transparent}
.thenSep{display:flex;align-items:center;gap:10px;color:var(--mute);font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.12em}
.thenSep::before,.thenSep::after{content:"";flex:1;height:1px;background:var(--edge2)}
@media (max-width:760px){.pipe{grid-template-columns:1fr;gap:22px}.pipe .role:not(:last-child)::after{content:"→";right:auto;left:50%;top:auto;bottom:-21px;transform:translateX(-50%) rotate(90deg)}}
</style>

  // T-742: counters, stage names, progress, next step and links come from the server read model (`view`, `summary`,
  // `labels`) that the dashboard card uses too; nothing about a project's state is derived on this page.
  const counts=sm.by_stage||{};
  $('#flow').innerHTML=data?PIPE.concat(['validated']).map(s=>'<div class="st'+(counts[s]?' has':'')+'"><b>'+(counts[s]||0)+'</b><span>'+esc(L.stage[s]||s)+'</span></div>').join(''):'';
  // Team as a pipeline: the build path first, then the later steps. A role is highlighted when projects sit at its stage now.
  const stageRole=(data&&data.roles)||{},busy={};
  projects.forEach(p=>{const v=p.view||{};if(v.status==='validated'||v.status==='rejected')return;const r=stageRole[v.stage];if(r)busy[r]=(busy[r]||0)+1});
  const card=r=>'<div class="role'+(busy[r]?' now':'')+'"><b>'+esc(r)+'</b><small>'+esc(x.roles[r]||'')+'</small><br>'+(busy[r]?'<span class="tag now">'+esc(x.now_n.replace('{n}',busy[r]))+'</span> ':'')+'<span class="tag">'+esc(x.role_tag)+'</span></div>';
  const row=list=>'<div class="pipe" style="--n:'+list.length+'">'+list.map(card).join('')+'</div>';
  $('#roles').innerHTML=row(['MVP Manager','Product Analyst','Spec Writer','Claude Builder','QA / Security'])+'<div class="thenSep" aria-hidden="true">↓ '+esc(x.then)+'</div>'+row(['Deploy Agent','Owner','Content Factory']);
  if(error==='auth'){$('#projects').innerHTML='<div class="glass state">'+esc(x.auth)+' <a class="btn primary" href="/login">'+esc(x.login)+'</a></div>';return}
  if(error){$('#projects').innerHTML='<div class="glass state bad">'+esc(error)+'</div>';return}
  if(!data){$('#projects').innerHTML='<div class="glass state">'+esc(x.loading)+'</div>';return}
  const drafts=saveDrafts();
  $('#projects').innerHTML=projects.map(p=>{
    const v=p.view||{},nx=v.next||{},ui=L.ui;
    const bar='<div class="barRow"><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Number(v.progress||0)+'"><i style="width:'+Number(v.progress||0)+'%"></i></div><span class="pct">'+Number(v.progress||0)+'% <small>· '+esc(fmt(ui.step,{step:v.step,steps:v.steps}))+'</small></span></div>';
    const badge=v.status==='blocked'?'<span class="badge blocked">'+esc(ui.blocked)+'</span>':'<span class="badge '+(v.status==='validated'||v.status==='rejected'?'done':'stage')+'">'+esc(L.stage[v.stage]||v.stage)+'</span>';
    const next=nextHtml(v,L);
    const hist=(p.history||[]).slice().reverse().map(e=>'<li><small>'+esc(String(e.at).replace('T',' ').slice(0,16))+' · '+esc(e.actor)+'</small><br>'+esc(x.kinds[e.kind]||e.kind)+(e.from_stage!==e.to_stage?' · '+esc(L.stage[e.from_stage]||e.from_stage)+' → '+esc(L.stage[e.to_stage]||e.to_stage):'')+(e.note?' — '+esc(e.note):'')+(e.evidence&&e.evidence.length?'<br>'+e.evidence.map(link).join(' · ')+' <span class="unv">'+esc(x.unverified)+'</span>':'')+'</li>').join('');
    const m=msgs[p.id]||{};
    const form='<details class="act" data-p="'+esc(p.id)+'"'+(openForms.has(p.id)?' open':'')+'><summary>'+esc(x.act)+'</summary><form class="ev" data-p="'+esc(p.id)+'"><div class="row"><select name="kind" aria-label="'+esc(x.kind)+'">'+Object.keys(x.kinds).map(k=>'<option value="'+k+'">'+esc(x.kinds[k])+'</option>').join('')+'</select><input name="evidence" type="text" placeholder="'+esc(x.evidence)+'" aria-label="'+esc(x.evidence)+'"></div><div class="row"><input name="note" type="text" maxlength="500" placeholder="'+esc(x.note)+'" aria-label="'+esc(x.note)+'"><button class="btn" type="submit">'+esc(x.save)+'</button></div><div class="msg '+(m.ok?'ok':'bad')+'" role="status">'+esc(m.text||'')+'</div></form></details>';
    const issue=(v.links||[]).filter(l=>l.key==='issue').map(l=>'<a href="'+esc(l.href)+'" target="_blank" rel="noopener">'+esc(l.text)+'</a>').join('');
    const brief=p.brief?'<details class="hist"><summary>'+esc(x.brief)+'</summary><div class="briefTxt">'+esc(p.brief)+'</div></details>':'';
    const links=(v.links||[]).filter(l=>l.key!=='issue').map(l=>'<a class="btn'+(l.primary?' primary':'')+'" href="'+esc(l.href)+'" target="_blank" rel="noopener">'+esc(L.links[l.key]||l.key)+' ↗</a>').join('');
    return '<article class="glass proj" id="p-'+esc(p.id)+'"><div class="ph"><h3>'+esc(p.title)+'</h3>'+badge+issue+'</div>'+bar+'<div class="next">'+next+'</div>'+brief+
      (links?'<div class="links">'+links+'</div>':'')+
      '<details class="hist"><summary>'+esc(x.history)+' · '+(p.history||[]).length+' '+esc(x.events)+'</summary><ol class="tl">'+hist+'</ol></details>'+form+'</article>';
  }).join('');
  restoreDrafts(drafts);
}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form.ev');if(!f)return;e.preventDefault();
  const pid=f.dataset.p,kind=f.kind.value,ev=f.evidence.value.trim(),note=f.note.value.trim(),x=t();
  // One opaque key per intended operation. It is reused only to retry that same operation after a network failure,
  // and dropped once the server answers or the form changes, so two real submissions never collapse into one.
  if(!f.dataset.key)f.dataset.key=newKey();
  const body={kind,evidence:ev?[ev]:[],note,reason:kind==='block'?note:'',idempotency_key:f.dataset.key};
  try{const r=await fetch('/api/mvp-factory/'+encodeURIComponent(pid)+'/events',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    delete f.dataset.key;  // the server answered: this operation is finished either way
    if(r.ok){msgs[pid]={ok:true,text:d.duplicate?x.dup:x.saved};openForms.add(pid);f.reset();await load();return}  // recorded: the draft is done, the refresh must not bring it back
    showMsg(f,x.err[d.detail]||String(d.detail||('HTTP '+r.status)));  // keep the form and what was typed
  }catch(err){showMsg(f,x.retry)}  // network failure: the key stays, so pressing again retries the same operation
});
function newKey(){try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form.ev');if(f)delete f.dataset.key});
function showMsg(f,text){const m=f.querySelector('.msg');m.className='msg bad';m.textContent=text}
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('act')){d.open?openForms.add(d.dataset.p):openForms.delete(d.dataset.p)}},true);
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('mvp-factory:lang',lang)}catch(e){}render()}));
render();load();
// T-742 live sync: re-read the same endpoint as the dashboard every 30 s and when the tab comes back. A half-filled
// event form never stops the refresh: render() keeps its draft (values, retry key, focus and cursor) across re-renders.
function saveDrafts(){const out={};const a=document.activeElement;
  document.querySelectorAll('form.ev').forEach(f=>{const d={kind:f.kind.value,evidence:f.evidence.value,note:f.note.value,key:f.dataset.key||''};
    if(a&&f.contains(a)&&a.name){d.focus=a.name;try{d.s=a.selectionStart;d.e=a.selectionEnd}catch(e){}}out[f.dataset.p]=d});return out}
function restoreDrafts(drafts){document.querySelectorAll('form.ev').forEach(f=>{const d=drafts[f.dataset.p];if(!d)return;
    f.kind.value=d.kind;f.evidence.value=d.evidence;f.note.value=d.note;if(d.key)f.dataset.key=d.key;
    if(d.evidence||d.note||d.focus){f.closest('details').open=true;openForms.add(f.dataset.p)}
    if(d.focus&&f[d.focus]){const el=f[d.focus];el.focus({preventScroll:true});try{if(d.s!=null)el.setSelectionRange(d.s,d.e)}catch(e){}}})}
function refresh(){if(document.visibilityState==='visible')load()}
setInterval(refresh,30000);
document.addEventListener('visibilitychange',refresh);window.addEventListener('focus',refresh);
</script>
