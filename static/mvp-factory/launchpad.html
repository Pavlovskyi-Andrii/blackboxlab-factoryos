<style>
:root{--bg:#0b1220;--card:#131c2e;--line:#26334d;--text:#e8eefc;--muted:#9fb0cf;--accent:#7cc4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}

.sub,.small{color:var(--muted);font-size:13px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.langs button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer}
.langs button[aria-pressed=true]{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-wrap:anywhere}
.big{font-size:26px;font-weight:700}.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px}
.strip{border-left:4px solid var(--accent)}ul{margin:6px 0;padding-left:18px}table{border-collapse:collapse;width:100%}td{padding:2px 6px 2px 0;font-size:13px;vertical-align:top}td+td{white-space:nowrap;text-align:right}
@media (max-width:430px){main{padding:10px}.grid{grid-template-columns:1fr}.big{font-size:22px}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pid=(new URLSearchParams(location.search).get('project')||'mycast').replace(/[^a-z0-9-]/g,'').slice(0,41)||'mycast';
let lang='uk',data=null,failed=false;
try{const l=localStorage.getItem('launchpad:lang');if(I[l])lang=l}catch(e){}
const t=k=>(I[lang][k]!==undefined?I[lang][k]:(I.en[k]!==undefined?I.en[k]:k));
const val=v=>(v==='unknown'||v===null||v===undefined)?t('unknown'):esc(v);
function target(c){const g=c.target||{};if(g.min==null&&g.max==null)return t('target_none');return (g.min!=null?t('target_from')+' '+esc(g.min):'')+(g.max!=null?' '+t('target_to')+' '+esc(g.max):'')}
function checkCard(c){
 const lv=Object.keys(c.levels||{}).filter(k=>c.levels[k]>0).map(k=>'<span class="chip">'+t('level_'+k)+' · '+esc(c.levels[k])+'</span>').join('');
 const ex=c.excluded||{};const exl=(ex.test||ex.synthetic)?'<div class="small">'+t('excluded')+': '+esc(ex.test||0)+' '+t('x_test')+', '+esc(ex.synthetic||0)+' '+t('x_synthetic')+'</div>':'';
 const met=c.target_met===true?t('met_yes'):c.target_met===false?t('met_no'):'';
 const loop=(c.loop||[]).map(e=>'<li>'+esc(t('step_'+e.step))+' · '+esc(e.by)+(e.verdict?' · '+esc(e.verdict):'')+'</li>').join('');
 return '<div class="card"><h3>'+esc(t('c_'+c.id))+'</h3><div class="big">'+val(c.actual)+'</div><div class="small">'+t('actual')+' · '+t('target')+': '+target(c)+'</div>'
  +(c.honest_zero?'<div>'+t('honest_zero')+'</div>':'')+(met?'<div class="small">'+met+'</div>':'')+(lv?'<div>'+lv+'</div>':'')+exl
  +(loop?'<details><summary class="small">'+t('loop')+'</summary><ul class="small">'+loop+'</ul></details>':'')+'</div>'}
function decision(d){if(!d)return '';const what=d.extra_check?t('extra_check')+': '+esc(d.extra_check):t('chosen')+': <b>'+esc(Array.isArray(d.chosen)?d.chosen.join(', '):d.chosen)+'</b>';
 return '<div>'+what+'</div><div class="small">'+t('rationale')+': '+esc(d.rationale)+' · '+t('by')+': '+esc(d.decided_by||d.by)+'</div>'}
function gateCard(g){const props=(g.proposals||[]).map(p=>'<li>'+decision(p)+'</li>').join('');
 return '<div class="card"><h3>'+esc(t('g_'+g.gate))+'</h3><div>'+t('st_'+g.state)+'</div><div class="small">'+t('who')+': '+t('who_'+g.who_decides)+'</div>'+decision(g.decision)
  +(props&&!g.decision?'<details><summary class="small">'+t('proposals')+' · '+esc(g.proposals.length)+'</summary><ul>'+props+'</ul></details>':'')+'</div>'}
function funnelCard(name,f){const rows=Object.keys(f.stages).map(k=>'<tr><td>'+t('f_'+k)+'</td><td><b>'+val(f.stages[k])+'</b></td></tr>').join('');
 const d=f.largest_drop;return '<div class="card"><h3>'+esc(t('ch_'+name))+'</h3><div>'+t('dr_'+f.demand_reading)+'</div><table>'+rows+'</table><div class="small">'+t('largest_drop')+': '
  +(d?esc(t('f_'+d.from))+' → '+esc(t('f_'+d.to))+' · −'+esc(Math.round(d.lost_share*100))+'%':t('no_drop'))+'</div></div>'}
function render(){
 document.documentElement.lang=lang;document.title=t('title');$('#title').textContent=t('title');$('#sub').textContent=t('sub');$('#back').textContent=t('back');
 $('#proj').textContent=t('project')+': '+pid;
 document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
 const el=$('#board');
 if(failed){el.innerHTML='<div class="card">'+t('error')+'</div>';return}
 if(!data){el.innerHTML='<div class="card">'+t('loading')+'</div>';return}
 const needs=(data.needs_you||[]).map(n=>'<li>'+t('n_'+n.kind)+(n.gate?' · '+esc(t('g_'+n.gate)):'')+(n.artifact?' · '+esc(n.artifact)+(n.channel?' · '+esc(t('ch_'+n.channel)):''):'')+'</li>').join('');
 let html='<div class="card strip"><h3>'+t('needs_you')+'</h3>'+(needs?'<ul>'+needs+'</ul>':'<div class="small">'+t('none')+'</div>')+'</div>';
 for(const ph of ['battle','build','promote','learn']){const cs=(data.checks||[]).filter(c=>c.phase===ph);if(!cs.length)continue;
  html+='<h2>'+t('phase_'+ph)+'</h2><div class="grid">'+cs.map(checkCard).join('')+'</div>'}
 html+='<h2>'+t('gates')+'</h2><div class="grid">'+(data.gates||[]).map(gateCard).join('')+'</div>';
 const fs=Object.keys(data.funnels||{});
 html+='<h2>'+t('funnels')+'</h2>'+(fs.length?'<div class="grid">'+fs.map(k=>funnelCard(k,data.funnels[k])).join('')+'</div><p class="small">'+t('attention')+'</p>':'<div class="card small">'+t('no_funnels')+'</div>');
 const L=data.learn||{};
 html+='<h2>'+t('learn')+'</h2><div class="card"><table><tr><td>'+t('verdict')+'</td><td><b>'+val(L.verdict)+'</b></td></tr><tr><td>'+t('main_channel')+'</td><td><b>'
  +(L.main_channel&&L.main_channel!=='unknown'?esc(t('ch_'+L.main_channel)):t('unknown'))+'</b></td></tr><tr><td>'+t('main_metric')+'</td><td><b>'+val(L.main_metric)+'</b></td></tr><tr><td>'
  +t('price_covers')+'</td><td><b>'+val(L.price_covers_direct_cost)+'</b></td></tr></table></div>';
 html+='<p class="small">'+t('counted_note')+' · '+esc(data.artifact_count||0)+' '+t('records')+'</p>';
 el.innerHTML=html}
async function load(){
 try{const res=await fetch('/api/mvp-factory/'+encodeURIComponent(pid)+'/launchpad',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error(res.status);data=await res.json();failed=false}catch(e){failed=true}
 render()}
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('launchpad:lang',lang)}catch(e){}render()}));
render();load();
</script></body></html>
