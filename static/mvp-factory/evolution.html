<style>

.msg{min-height:22px;color:var(--muted);font-size:13px}.msg.error{color:#ffaaa6}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form .wide{grid-column:1/-1}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row input{flex:1 1 200px;width:auto}
details>summary{cursor:pointer;color:var(--cyan);margin:6px 0}section{margin:18px 0}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

async function api(path,body){

 let out={};try{out=await res.json()}catch(e){}

async function loadProjects(){
 try{const reg=await api('/api/mvp-factory');const sel=$('#project');
  sel.innerHTML=(reg.projects||[]).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title)+'</option>').join('');

 }catch(e){say(t().error,true)}
}

 render();
}

 $('#demo').textContent=demo?x.real:x.demo;$('#reload').textContent=x.reload;$('#project').disabled=demo;
 const synth=$('#synth');synth.hidden=!demo;synth.textContent=x.synth;
 if(!data){['#cohort','#funnel','#themes','#proposals','#feedback','#forms'].forEach(s=>$(s).innerHTML='');return}
 const c=data.cohort,v=data.current_version;
 $('#n-version').textContent=v;$('#n-sub').textContent=c.unique_substantive_real+' / '+c.targets[0];
 $('#n-fb').textContent=c.feedback_real+' / '+c.feedback_synthetic;
 $('#n-open').textContent=(data.proposals||[]).filter(p=>['proposed','approved','handed_off'].includes(p.state)).length;
 const fn=(data.funnel||{})[v]||{};const invited=fn.invited&&fn.invited.count;
 const m=(n,target)=>'<div class="meter" role="img" aria-label="'+n+' / '+target+'"><i style="width:'+Math.min(100,Math.round(100*n/target))+'%"></i></div>';
 $('#cohort').innerHTML='<p>'+esc(x.cohort1)+'<br><b>'+c.unique_substantive_real+' / '+c.targets[0]+'</b> — '+esc(c.first_target_met?x.met:x.notMet)+'</p>'+m(c.unique_substantive_real,c.targets[0])+
  '<p>'+esc(x.cohort2)+'<br><b>'+(invited==null?esc(x.unknown):Number(invited)+' / '+c.targets[1])+'</b>'+(invited!=null&&invited>=c.targets[1]?' — '+esc(x.met):' — '+esc(x.notMet))+'</p>'+m(Number(invited||0),c.targets[1]);
 $('#funnel').innerHTML='<table><thead><tr><th>'+esc(v)+'</th><th></th><th>'+esc(x.source)+'</th></tr></thead><tbody>'+FUNNEL.map(s=>{const r=fn[s];return '<tr><td>'+esc(x[s])+'</td><td>'+(r?Number(r.count):'<span class="small">'+esc(x.unknown)+'</span>')+'</td><td class="small">'+esc(r?r.source:'')+'</td></tr>'}).join('')+
  '<tr><td>'+esc(x.feedback_received)+'</td><td>'+Number(fn.feedback_received||0)+'</td><td class="small">FactoryOS</td></tr></tbody></table>';
 const themes=(demo?(data.synthetic_themes||{}):(data.themes||{}));
 const tv=Object.keys(themes).filter(k=>(themes[k]||[]).length);
 $('#themes').innerHTML=tv.length?tv.map(ver=>'<h3 class="small">'+esc(ver)+'</h3><ul class="plain">'+themes[ver].map(th=>'<li><b>'+esc(th.theme)+'</b> '+confBadge(th.confidence)+(demo?' '+badge('b-violet',x.synthetic):'')+'<div class="small">'+esc(x.support)+': '+th.unique_support+' '+esc(x.people)+' · '+esc(x.contra)+': '+th.unique_contra+' · '+esc(x.sample)+': '+th.sample_size+' · '+esc(x.share)+': '+Math.round(th.share*100)+'%'+(th.avg_importance!=null?' · '+esc(x.importance)+': '+th.avg_importance:'')+'</div><div class="small">'+th.support_ids.map(esc).join(', ')+(th.contra_ids.length?' | − '+th.contra_ids.map(esc).join(', '):'')+'</div></li>').join('')+'</ul>').join(''):'<div class="empty">'+esc(x.noThemes)+'</div>';
 $('#proposals').innerHTML=(data.proposals||[]).length?'<ul class="plain">'+data.proposals.slice().reverse().map(p=>proposal(p)).join('')+'</ul>':'<div class="empty">'+esc(x.noProposals)+'</div>';
 $('#feedback').innerHTML=(data.feedback||[]).length?'<ul class="plain">'+data.feedback.map(r=>{const a=r.answers||{};return '<li><b>'+esc(r.id)+'</b> · '+esc(r.version)+' · '+esc(r.source)+' '+(r.synthetic?badge('b-violet',x.synthetic):'')+' '+badge(r.substantive?'b-green':'b-grey',r.substantive?x.substantive:x.notSubst)+(r.retest_of?' · '+esc(x.t_retest)+' '+esc(r.retest_of)+': '+esc(r.solved):'')+
  '<div class="small">'+[a.job&&(x.job+' '+a.job),a.helped&&(x.helped+' '+a.helped),a.failed&&(x.failed+' '+a.failed),a.change&&(x.change+' '+a.change)].filter(Boolean).map(esc).join(' · ')+'</div><div class="small">'+(r.themes||[]).map(esc).join(', ')+((r.contra||[]).length?' | − '+r.contra.map(esc).join(', '):'')+' · '+esc((r.consent||{}).ref)+'</div>'+
  (demo?'':'<button type="button" data-del="'+esc(r.id)+'">'+esc(x.del)+'</button>')+'</li>'}).join('')+'</ul>':'<div class="empty">—</div>';
 renderForms();
}
function proposal(p){
 const x=t(),h=p.handoff||{},r=p.retest||{solved:{}};
 const pr=(p.shipped_evidence||[]).map(u=>gh(u)?'<a href="'+esc(gh(u))+'" target="_blank" rel="noopener">'+esc(u.replace(/^https:\/\/github\.com\/[^/]+\/[^/]+\//,''))+'</a>':esc(u)).join(' ')||esc(x.none);
 const issue=p.issue?'<a href="https://github.com/Pavlovskyi-Andrii/blackboxlab-factoryos/issues/'+Number(p.issue)+'" target="_blank" rel="noopener">#'+Number(p.issue)+'</a>':esc(x.none);
 const rel=(data.versions||[]).some(v=>v.version===p.target_version)?esc(p.target_version):esc(x.none);
 const trace='<div class="trace"><span class="step">'+esc(x.t_feedback)+': '+p.feedback_ids.length+'</span><span class="arrow">→</span><span class="step">'+esc(x.t_issue)+': '+issue+'</span><span class="arrow">→</span><span class="step">'+esc(x.t_ticket)+': '+esc(p.ticket_id||x.none)+(p.handoff?' · '+esc(h.state)+' '+verBadge(h.verification)+(h.run_id?' · '+esc(h.run_id):''):'')+'</span><span class="arrow">→</span><span class="step">'+esc(x.t_pr)+': '+pr+'</span><span class="arrow">→</span><span class="step">'+esc(x.t_release)+': '+rel+'</span><span class="arrow">→</span><span class="step">'+esc(x.t_retest)+': '+Number(r.responses||0)+' ('+esc(x.solved)+' '+Number(r.solved.yes||0)+', '+esc(x.partly)+' '+Number(r.solved.partly||0)+', '+esc(x.no)+' '+Number(r.solved.no||0)+'; '+Number(r.original_participants||0)+' '+esc(x.original)+')</span></div>';
 let acts='';
 if(!demo){
  if(p.state==='proposed')acts='<button type="button" data-act="approve" data-p="'+esc(p.id)+'">'+esc(x.approve)+'</button> <button type="button" data-act="decline" data-p="'+esc(p.id)+'">'+esc(x.decline)+'</button>';
  if(p.state==='approved')acts='<label>'+esc(x.lane)+' <select data-lane="'+esc(p.id)+'"><option>claude</option><option>chatgpt</option><option>gemini</option><option>unassigned</option></select></label><button type="button" class="primary" data-act="handoff" data-p="'+esc(p.id)+'">'+esc(x.handoff)+'</button> <button type="button" data-act="decline" data-p="'+esc(p.id)+'">'+esc(x.decline)+'</button>';
  if(p.state==='handed_off')acts='<div class="row"><input data-pr="'+esc(p.id)+'" placeholder="'+esc(x.prUrl)+'" aria-label="'+esc(x.prUrl)+'"><button type="button" data-act="ship" data-p="'+esc(p.id)+'">'+esc(x.ship)+'</button></div>';
 }
 return '<li><b>'+esc(p.id)+' · '+esc(p.title)+'</b> '+badge(p.state==='shipped'?'b-green':p.state==='declined'?'b-red':'b-amber',x['s_'+p.state]||p.state)+(p.synthetic?' '+badge('b-violet',x.synthetic):'')+' <span class="small">'+esc(p.from_version)+' → '+esc(p.target_version)+(p.theme?' · '+esc(p.theme):'')+'</span>'+
  '<div class="small">'+esc(x.problem)+': '+esc(p.problem)+'<br>'+esc(x.changeP)+': '+esc(p.change)+'<br>'+esc(x.test)+': '+esc(p.acceptance_test)+'</div>'+trace+'<div class="row">'+acts+'</div></li>';
}
function opts(list,labels){return list.map(v=>'<option value="'+esc(v)+'">'+esc(labels?labels[v]||v:v)+'</option>').join('')}
function renderForms(){
 const x=t(),f=$('#forms');f.hidden=demo;if(demo){f.innerHTML='';return}
 const shipped=(data.proposals||[]).filter(p=>p.state==='shipped'&&p.target_version===data.current_version);
 const tri=opts(['unknown','yes','no'],{unknown:x.unk,yes:x.yes,no:x.no});
 f.innerHTML='<details><summary>'+esc(x.addFb)+'</summary><form id="fbForm" class="form">'+
  '<label>'+esc(x.participant)+'<input name="participant" required maxlength="120" autocomplete="off"></label><label>'+esc(x.src)+'<select name="source">'+opts(['interview','survey','in_product'])+'</select></label>'+
  '<label class="check wide"><input type="checkbox" name="consent" required> '+esc(x.consent)+'</label><label class="wide">'+esc(x.consentRef)+'<input name="consent_ref" required maxlength="160"></label>'+
  '<label>'+esc(x.tried)+'<select name="tried">'+tri+'</select></label><label>'+esc(x.imp)+'<input name="importance" type="number" min="1" max="5"></label>'+
  '<label class="wide">'+esc(x.job)+'<textarea name="job" maxlength="600"></textarea></label><label>'+esc(x.helped)+'<textarea name="helped" maxlength="600"></textarea></label><label>'+esc(x.failed)+'<textarea name="failed" maxlength="600"></textarea></label>'+
  '<label class="wide">'+esc(x.change)+'<textarea name="change" maxlength="600"></textarea></label>'+
  '<label>'+esc(x.pay)+'<select name="would_pay">'+tri+'</select></label><label>'+esc(x.period)+'<input name="pay_period" maxlength="40"></label><label>'+esc(x.pilot)+'<select name="paid_pilot">'+tri+'</select></label>'+
  '<label>'+esc(x.themes)+'<input name="themes" autocomplete="off"></label><label>'+esc(x.contraT)+'<input name="contra" autocomplete="off"></label>'+
  (shipped.length?'<label>'+esc(x.retest)+'<select name="retest_of"><option value=""></option>'+shipped.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.id+' · '+p.title)+'</option>').join('')+'</select></label><label>'+esc(x.solvedQ)+'<select name="solved">'+opts(['unknown','yes','partly','no'],{unknown:x.unk,yes:x.yes,partly:x.partly,no:x.no})+'</select></label>':'')+
  '<div class="wide"><button class="primary" type="submit">'+esc(x.save)+'</button></div></form></details>'+
  '<details><summary>'+esc(x.addProp)+'</summary><form id="propForm" class="form"><label class="wide">'+esc(x.title)+'<input name="title" required maxlength="140"></label><label>'+esc(x.problem)+'<textarea name="problem" required></textarea></label><label>'+esc(x.changeP)+'<textarea name="change" required></textarea></label><label class="wide">'+esc(x.test)+'<textarea name="acceptance_test" required></textarea></label><label>'+esc(x.theme)+'<input name="theme"></label><label>'+esc(x.fbIds)+'<input name="feedback_ids" required></label><label>'+esc(x.issue)+'<input name="issue" type="number" min="1"></label><div class="wide"><button class="primary" type="submit">'+esc(x.propose)+'</button></div></form></details>'+
  '<details><summary>'+esc(x.funnelSet)+'</summary><form id="funnelForm" class="form"><label>'+esc(x.step)+'<select name="step">'+opts(FUNNEL.filter(s=>!EVENT_STEPS.includes(s)),x)+'</select></label><label>'+esc(x.count)+'<input name="count" type="number" min="0"></label><label class="wide">'+esc(x.fsource)+'<input name="source" maxlength="200"></label><div class="wide"><button type="submit">'+esc(x.record)+'</button></div></form></details>'+
  '<details><summary>'+esc(x.releaseT)+'</summary><form id="relForm" class="row"><input name="evidence" required placeholder="'+esc(x.evidence)+'" aria-label="'+esc(x.evidence)+'"><button type="submit">'+esc(x.release)+'</button></form></details>'+
  (project==='mybrief-pro'?'<div class="row"><button type="button" id="importMb">'+esc(x.importMb)+'</button></div>':'');
}
const tags=s=>String(s||'').split(',').map(v=>v.trim().toLowerCase()).filter(Boolean);
async function send(path,body){try{await api(path,Object.assign({idempotency_key:key()},body));say(t().saved);await load()}catch(e){say(e.message,true)}}
const base=()=>'/api/mvp-evolution/'+encodeURIComponent(project);
document.addEventListener('submit',e=>{
 const f=e.target;if(!f.id)return;e.preventDefault();const v=n=>f.elements[n]?f.elements[n].value.trim():'';
 if(f.id==='fbForm'){const imp=v('importance');send(base()+'/feedback',{consent:f.elements.consent.checked,consent_ref:v('consent_ref'),participant:v('participant'),source:v('source'),tried:v('tried'),job:v('job'),helped:v('helped'),failed:v('failed'),change:v('change'),importance:imp?Number(imp):null,would_pay:v('would_pay'),pay_period:v('pay_period'),paid_pilot:v('paid_pilot'),themes:tags(v('themes')),contra:tags(v('contra')),retest_of:v('retest_of'),solved:v('solved')||null})}
 if(f.id==='propForm'){const iss=v('issue');send(base()+'/proposals',{title:v('title'),problem:v('problem'),change:v('change'),acceptance_test:v('acceptance_test'),theme:v('theme').toLowerCase(),feedback_ids:v('feedback_ids').split(',').map(s=>s.trim()).filter(Boolean),issue:iss?Number(iss):null})}
 if(f.id==='funnelForm'){const c=v('count');send(base()+'/funnel',{step:v('step'),count:c===''?null:Number(c),source:v('source')})}
 if(f.id==='relForm'){send(base()+'/release',{evidence:[v('evidence')]})}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.act){const id=b.dataset.p,body={action:b.dataset.act};
  if(b.dataset.act==='handoff'){const s=document.querySelector('select[data-lane="'+CSS.escape(id)+'"]');body.lane=s?s.value:'claude'}
  if(b.dataset.act==='ship'){const i=document.querySelector('input[data-pr="'+CSS.escape(id)+'"]');body.evidence=[i?i.value.trim():'']}
  send(base()+'/proposals/'+encodeURIComponent(id)+'/decision',body)}
 if(b.dataset.del&&confirm(t().confirmDel))send(base()+'/feedback/'+encodeURIComponent(b.dataset.del)+'/delete',{});
 if(b.id==='importMb')send(base()+'/import-mybrief',{});
});
$('#project').addEventListener('change',e=>{project=e.target.value;history.replaceState(null,'','?project='+encodeURIComponent(project));load()});
$('#demo').addEventListener('click',()=>{demo=!demo;load()});
$('#reload').addEventListener('click',load);
document.querySelectorAll('.langs button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('mvp-evolution:lang',lang)}catch(e){}render()}));
render();loadProjects().then(load);
</script>
