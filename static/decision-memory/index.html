<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="robots" content="noindex">
<title>Decision Memory · MVP Builder</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#070f1a;--panel:#0c1929;--panel2:#102239;--edge:#294560;--ink:#e8f1fc;--muted:#9db1c9;--blue:#189eff;--cyan:#69d4f2;--ok:#64cf9b;--warn:#e7b35b;--bad:#f07a7a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#142b49 0%,transparent 42%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
a{color:var(--cyan)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--edge);border-radius:10px;color:var(--ink);background:var(--panel2);padding:8px 13px}button:hover{border-color:var(--blue)}button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:linear-gradient(110deg,#1575ec,#11b4ec);color:#fff;border:0;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:22px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.langs{display:flex;gap:5px}.langs button{padding:5px 10px}.langs button[aria-pressed=true]{background:#174e86;border-color:var(--blue)}
h1{font-size:clamp(26px,4vw,40px);line-height:1.15;margin:22px 0 8px}.lede{max-width:820px;color:var(--muted);margin:0 0 14px}
.notice{font-size:13px;padding:11px 14px;border-radius:12px;border:1px solid #705b37;background:#312919;color:#ffe2a4}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px}.stat strong{display:block;font-size:28px;line-height:1.2}.stat small{color:var(--muted)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}.bar input,.bar select{flex:1 1 180px}
input,select,textarea{background:#071522;border:1px solid #34506a;color:var(--ink);border-radius:9px;padding:9px;width:100%;min-width:0}textarea{resize:vertical;min-height:70px}
details.new{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:12px 16px;margin:0 0 16px}details.new summary{cursor:pointer;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.grid .full{grid-column:1/-1}label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px;margin:0 0 12px;min-width:0}.meta{color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card h3{margin:6px 0;font-size:17px;overflow-wrap:anywhere}.why{color:#c6d5e6;margin:4px 0 8px;overflow-wrap:anywhere}.why.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;background:#173658;color:#b5ddff;border:1px solid #315c8d;border-radius:30px;padding:1px 8px;font-size:12px}.tag.due{background:#3b1d1d;color:#ffc4c4;border-color:#7a3a3a}.tag.ok{background:#173a2b;color:#bff0d6;border-color:#2e7253}.tag.gap{background:#33291a;color:#ffe2a4;border-color:#705b37}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0;font-size:13px}.fields div{background:#0a1626;border:1px solid #1d3550;border-radius:10px;padding:8px;overflow-wrap:anywhere}.fields b{display:block;color:var(--muted);font-weight:500;font-size:12px}
.empty{color:var(--warn)}.links{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.form{margin-top:10px;border-top:1px solid #1d3550;padding-top:10px}
.reviews{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:18px}.err{color:var(--bad);font-size:13px}.more{display:block;margin:10px auto}
footer{margin-top:28px;color:var(--muted);font-size:13px}
@media (max-width:720px){.stats{grid-template-columns:1fr 1fr}.grid,.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/static/mvp-factory/index.html" id="back"></a><div class="langs" id="langs"></div></div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="notice" id="notice"></div>
  <div id="state"></div>
  <div id="app" hidden>
    <div class="stats" id="stats"></div>
    <details class="new" id="newBox"><summary id="newTitle"></summary>
      <form id="newForm" class="grid">
        <label class="full"><span data-t="f_decision"></span><input name="decision" maxlength="500" required></label>
        <label class="full"><span data-t="f_rationale"></span><textarea name="rationale" maxlength="2000" required></textarea></label>
        <label><span data-t="f_owner"></span><input name="owner" maxlength="80"></label>
        <label><span data-t="f_review_at"></span><input name="review_at" type="date"></label>
        <label class="full"><span data-t="f_outcome"></span><input name="expected_outcome" maxlength="500"></label>
        <label class="full"><span data-t="f_sources"></span><textarea name="sources" rows="2"></textarea></label>
        <div class="full"><button class="primary" type="submit" data-t="save"></button> <span class="err" id="newErr"></span></div>
      </form>
    </details>
    <div class="bar">
      <input id="q" type="search">
      <select id="filter"></select>
    </div>
    <div id="list"></div>
    <button class="more" id="more" hidden></button>
  </div>
  <section id="improve" aria-labelledby="improveTitle" data-api="/api/decision-memory/quiz" data-product="Decision Memory" data-key="decision-memory" data-plain hidden></section><!-- T-636 #270: optional improve-the-product quiz (shared improve.js) -->
  <section id="usage" data-api="/api/decision-memory/usage" data-product="Decision Memory" data-key="decision-memory" data-used="form" data-used-on="submit" hidden></section><!-- T-633 #270: opt-in anonymous usage counting (shared usage.js) -->
  <footer id="foot"></footer>
</div>

var I18N={

  as_expected:'как ожидали',partly:'частично',missed:'не сработало',reversed:'решение отменено',show_more:'Показать ещё',nothing:'Ничего не найдено.',

  notice:'Пілот #187. Демо-дані — реальні записи з DECISIONS.md FactoryOS (без секретів). Відповідальний, очікуваний результат і рев’ю в DECISIONS.md не записані — тому вони порожні: цю прогалину й перевіряє MVP. Без ШІ-викликів і зовнішніх запитів; бачить лише власник.',
  loading:'Завантаження…',login:'Потрібно увійти у FactoryOS як власник.',login_btn:'Увійти',owner_only:'Ця сторінка доступна лише власнику.',failed:'Не вдалося завантажити дані.',
  s_total:'рішень',s_owner:'без відповідального',s_outcome:'без очікуваного результату',s_due:'час провести рев’ю',
  newt:'+ Нове рішення',f_decision:'Рішення',f_rationale:'Обґрунтування',f_owner:'Відповідальний',f_review_at:'Дата рев’ю',f_outcome:'Очікуваний результат (як зрозуміємо, що рішення спрацювало)',f_sources:'Посилання-джерела (по одному в рядку, https://… або /static/…)',save:'Зберегти',
  q:'Пошук за рішенням, обґрунтуванням, задачею (T-…)',all:'Усі',gaps:'З прогалинами (немає відповідального чи результату)',due:'Час рев’ю',scheduled:'Рев’ю заплановано',reviewed:'Уже перевірені',mine:'Додані вручну',
  from_md:'DECISIONS.md',manual:'додано вручну',redacted:'приховано текст, схожий на секрет',none:'не вказано',none_o:'не записано',none_r:'не призначено',
  st_due:'час рев’ю',st_scheduled:'рев’ю заплановано',st_reviewed:'перевірено',st_none:'без рев’ю',
  edit:'Заповнити поля',review:'Записати рев’ю',more_text:'Читати повністю',verdict:'Підсумок',note:'Що сталося насправді',next:'Наступне рев’ю (необов’язково)',
  as_expected:'як очікували',partly:'частково',missed:'не спрацювало',reversed:'рішення скасовано',show_more:'Показати ще',nothing:'Нічого не знайдено.',
  e_secret_like_text:'Текст схожий на секрет — приберіть його.',e_bad_sources:'Невірне посилання: лише https://… або /static/….',e_bad_date:'Невірна дата.',e_decision_required:'Вкажіть рішення.',e_rationale_required:'Вкажіть обґрунтування.',e_other:'Не збереглося: ',
  foot:'Скрипт валідаційного інтерв’ю',issue:'Issue #187',source:'Джерело: DECISIONS.md'},
 en:{back:'← MVP Builder',title:'Decision Memory: decisions you can check later',lede:'Every decision gets a rationale, a responsible person, source links, an expected outcome and a review date. Later you come back and record whether it worked.',
  notice:'Pilot #187. Demo data are real entries from FactoryOS DECISIONS.md (no secrets). DECISIONS.md does not record a responsible person, expected outcome or review, so those start empty: that gap is what this MVP tests. No AI calls, no external requests; owner only.',
  loading:'Loading…',login:'Sign in to FactoryOS as the owner.',login_btn:'Sign in',owner_only:'This page is available to the owner only.',failed:'Could not load the data.',

  newt:'+ New decision',f_decision:'Decision',f_rationale:'Rationale',f_owner:'Responsible',f_review_at:'Review date',f_outcome:'Expected outcome (how we will know it worked)',f_sources:'Source links (one per line, https://… or /static/…)',save:'Save',
  q:'Search decision, rationale, task (T-…)',all:'All',gaps:'With gaps (no responsible or outcome)',due:'Review due',scheduled:'Review scheduled',reviewed:'Already reviewed',mine:'Added manually',
  from_md:'DECISIONS.md',manual:'added manually',redacted:'credential-like text hidden',none:'not set',none_o:'not recorded',none_r:'not scheduled',
  st_due:'review due',st_scheduled:'review scheduled',st_reviewed:'reviewed',st_none:'no review',
  edit:'Fill in fields',review:'Record a review',more_text:'Read all',verdict:'Result',note:'What actually happened',next:'Next review (optional)',
  as_expected:'as expected',partly:'partly',missed:'did not work',reversed:'decision reversed',show_more:'Show more',nothing:'Nothing found.',
  e_secret_like_text:'The text looks like a secret — remove it.',e_bad_sources:'Bad link: only https://… or /static/….',e_bad_date:'Bad date.',e_decision_required:'Enter the decision.',e_rationale_required:'Enter the rationale.',e_other:'Not saved: ',
  foot:'Validation interview script',issue:'Issue #187',source:'Source: DECISIONS.md'}};
var LANGS=['ru','uk','en'],lang=pickLang(),data=null,shown=40,openForm={};
function pickLang(){var q=(new URLSearchParams(location.search).get('lang')||'').toLowerCase();if(LANGS.indexOf(q)>=0)return q;
 try{var s=localStorage.getItem('dm_lang');if(LANGS.indexOf(s)>=0)return s}catch(e){}
 var n=(navigator.language||'ru').slice(0,2);return LANGS.indexOf(n)>=0?n:'ru'}
function t(k){return (I18N[lang]||I18N.ru)[k]||I18N.en[k]||k}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){u=String(u||'');return (/^https:\/\//.test(u)||/^\/static\//.test(u))?u:'#'}
function key(){try{return crypto.randomUUID()}catch(e){return 'k'+Date.now()+Math.random().toString(16).slice(2)}}
function $(id){return document.getElementById(id)}
function chrome(){document.documentElement.lang=lang;$('back').textContent=t('back');$('title').textContent=t('title');$('lede').textContent=t('lede');$('notice').textContent=t('notice');
 $('langs').innerHTML=LANGS.map(function(l){return '<button type="button" data-lang="'+l+'" aria-pressed="'+(l===lang)+'">'+l.toUpperCase()+'</button>'}).join('');
 $('newTitle').textContent=t('newt');document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'))});
 $('q').placeholder=t('q');var f=$('filter'),cur=f.value||'all';
 f.innerHTML=['all','gaps','due','scheduled','reviewed','mine'].map(function(v){return '<option value="'+v+'">'+esc(t(v))+'</option>'}).join('');f.value=cur;
 $('more').textContent=t('show_more');
 $('foot').innerHTML=data?'<div class="links"><a target="_blank" rel="noopener" href="'+esc(safeUrl(data.interview_script))+'">'+esc(t('foot'))+' ↗</a><a target="_blank" rel="noopener" href="'+esc(safeUrl(data.issue))+'">'+esc(t('issue'))+' ↗</a><a target="_blank" rel="noopener" href="'+esc(safeUrl(data.source.url))+'">'+esc(t('source'))+' ↗</a></div>':''}
function setState(html){$('state').innerHTML=html?'<div class="card">'+html+'</div>':''}
function load(){setState(esc(t('loading')));
 fetch('/api/decision-memory',{credentials:'same-origin'}).then(function(r){
  if(r.status===401){setState(esc(t('login'))+' <a href="/login?lang='+lang+'">'+esc(t('login_btn'))+'</a>');return null}
  if(r.status===403){setState(esc(t('owner_only')));return null}
  if(!r.ok)throw new Error(String(r.status));return r.json()}).then(function(j){if(!j)return;data=j;setState('');$('app').hidden=false;chrome();render()})
 .catch(function(){setState(esc(t('failed')))})}
function matches(d,q,f){
 if(f==='gaps'&&d.owner&&d.expected_outcome)return false;
 if((f==='due'||f==='scheduled'||f==='reviewed')&&d.follow_up!==f)return false;
 if(f==='mine'&&d.origin!=='owner')return false;
 if(!q)return true;var hay=(d.decision+' '+d.rationale+' '+d.title+' '+(d.tasks||[]).join(' ')+' '+d.owner+' '+d.expected_outcome).toLowerCase();return hay.indexOf(q)>=0}
function stats(){var s=data.stats;$('stats').innerHTML=[['total','s_total'],['missing_owner','s_owner'],['missing_outcome','s_outcome'],['due','s_due']].map(function(p){return '<div class="stat"><strong>'+esc(s[p[0]])+'</strong><small>'+esc(t(p[1]))+'</small></div>'}).join('')}
function card(d){
 var st={due:'due',reviewed:'ok',scheduled:'',none:'gap'}[d.follow_up]||'';
 var head='<div class="meta"><span>'+esc(d.date||'—')+'</span><span class="tag">'+esc(d.origin==='owner'?t('manual'):t('from_md'))+'</span>'+(d.tasks||[]).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'<span class="tag '+st+'">'+esc(t('st_'+d.follow_up))+'</span>'+(d.redacted?'<span class="tag due">'+esc(t('redacted'))+'</span>':'')+'</div>';
 var title=d.title&&d.title!==d.decision?'<div class="meta">'+esc(d.title)+'</div>':'';
 var f='<div class="fields"><div><b>'+esc(t('f_owner'))+'</b>'+(d.owner?esc(d.owner):'<span class="empty">'+esc(t('none'))+'</span>')+'</div><div><b>'+esc(t('f_outcome').split(' (')[0])+'</b>'+(d.expected_outcome?esc(d.expected_outcome):'<span class="empty">'+esc(t('none_o'))+'</span>')+'</div><div><b>'+esc(t('f_review_at'))+'</b>'+(d.review_at?esc(d.review_at):'<span class="empty">'+esc(t('none_r'))+'</span>')+'</div></div>';
 var links='<div class="links">'+(d.sources||[]).map(function(s){return '<a target="_blank" rel="noopener" href="'+esc(safeUrl(s.url))+'">'+esc(s.label)+' ↗</a>'}).join('')+'</div>';
 var revs=(d.reviews||[]).length?'<ul class="reviews">'+d.reviews.map(function(r){return '<li>'+esc(r.at.slice(0,10))+' — <b>'+esc(t(r.verdict))+'</b>'+(r.note?': '+esc(r.note):'')+'</li>'}).join('')+'</ul>':'';
 var form='';
 if(openForm[d.id]==='edit')form='<form class="form grid" data-kind="edit" data-id="'+esc(d.id)+'"><label><span>'+esc(t('f_owner'))+'</span><input name="owner" maxlength="80" value="'+esc(d.owner)+'"></label><label><span>'+esc(t('f_review_at'))+'</span><input type="date" name="review_at" value="'+esc(d.review_at)+'"></label><label class="full"><span>'+esc(t('f_outcome'))+'</span><input name="expected_outcome" maxlength="500" value="'+esc(d.expected_outcome)+'"></label><div class="full"><button class="primary" type="submit">'+esc(t('save'))+'</button> <span class="err"></span></div></form>';
 if(openForm[d.id]==='review')form='<form class="form grid" data-kind="review" data-id="'+esc(d.id)+'" data-key="'+esc(key())+'"><label><span>'+esc(t('verdict'))+'</span><select name="verdict">'+data.verdicts.map(function(v){return '<option value="'+esc(v)+'">'+esc(t(v))+'</option>'}).join('')+'</select></label><label><span>'+esc(t('next'))+'</span><input type="date" name="next_review_at"></label><label class="full"><span>'+esc(t('note'))+'</span><textarea name="note" maxlength="1000"></textarea></label><div class="full"><button class="primary" type="submit">'+esc(t('save'))+'</button> <span class="err"></span></div></form>';
 return '<article class="card">'+head+title+'<h3>'+esc(d.decision)+'</h3><div class="why clamp" data-why>'+esc(d.rationale)+'</div>'+f+links+revs+
  '<div class="actions"><button type="button" data-open="edit" data-id="'+esc(d.id)+'">'+esc(t('edit'))+'</button><button type="button" data-open="review" data-id="'+esc(d.id)+'">'+esc(t('review'))+'</button></div>'+form+'</article>'}
function render(){if(!data)return;stats();var q=$('q').value.trim().toLowerCase(),f=$('filter').value||'all';
 var items=data.decisions.filter(function(d){return matches(d,q,f)});
 $('list').innerHTML=items.length?items.slice(0,shown).map(card).join(''):'<div class="card">'+esc(t('nothing'))+'</div>';
 $('more').hidden=items.length<=shown}
function errText(code){var k='e_'+code;return I18N[lang][k]?t(k):t('e_other')+code}
function post(url,body){return fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.detail||String(r.status));return j})})}
function formBody(form){var o={};new FormData(form).forEach(function(v,k){o[k]=String(v)});return o}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('dm_lang',lang)}catch(x){}chrome();render();return}
 if(b.dataset.open){var id=b.dataset.id;openForm[id]=openForm[id]===b.dataset.open?null:b.dataset.open;render();return}
 if(b.id==='more'){shown+=40;render()}});
document.addEventListener('click',function(e){var w=e.target.closest('[data-why]');if(w)w.classList.toggle('clamp')});
document.addEventListener('submit',function(e){var form=e.target;e.preventDefault();var err=form.querySelector('.err')||$('newErr');err.textContent='';
