<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Blackbox Lab</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe3ff"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3470"/>
      <stop offset="1" stop-color="#1a2050"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070a16"/>
  <!-- the black box: an isometric cube; faces darkest on the right, a glowing seam on the front edge -->
  <path d="M32 11 50 21.5 32 32 14 21.5Z" fill="url(#top)"/>
  <path d="M14 21.5 32 32V53L14 42.5Z" fill="#11163a"/>
  <path d="M50 21.5 32 32V53L50 42.5Z" fill="#090d24"/>
  <path d="M32 11 50 21.5V42.5L32 53 14 42.5V21.5Z M14 21.5 32 32 50 21.5 M32 32V53" fill="none" stroke="url(#edge)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M32 35V50" stroke="#ff9a6b" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>
</svg>
